<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Operativo Educativo - Aula Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* RESET Y ESTILOS GLOBALES */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; height: 100vh; background: #004275 url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; overflow: hidden; }

        /* ESCRITORIO */
        #desktop { height: calc(100vh - 45px); padding: 20px; display: flex; flex-direction: column; flex-wrap: wrap; gap: 20px; align-content: flex-start; }
        .icon { width: 90px; text-align: center; color: white; cursor: pointer; padding: 10px; border-radius: 5px; font-size: 13px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .icon:hover { background: rgba(255, 255, 255, 0.2); }
        .icon i { font-size: 40px; display: block; margin-bottom: 8px; }

        /* BARRA DE TAREAS */
        #taskbar { position: absolute; bottom: 0; width: 100%; height: 45px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); display: flex; align-items: center; color: white; z-index: 9999; padding: 0 10px; }
        .start-btn { font-size: 22px; cursor: pointer; padding: 0 15px; }
        .clock { margin-left: auto; font-size: 14px; }

        /* MENÚ INICIO */
        #start-menu { position: absolute; bottom: 45px; left: 0; width: 320px; height: 450px; background: rgba(30, 30, 30, 0.95); display: none; flex-direction: column; color: white; z-index: 9000; border-top-right-radius: 10px; padding: 15px; }
        .menu-item { padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #444; }
        .menu-item:hover { background: rgba(255,255,255,0.1); }

        /* VENTANAS */
        .window { position: absolute; top: 50px; left: 100px; width: 700px; height: 500px; background: white; border: 1px solid #999; display: none; flex-direction: column; box-shadow: 10px 10px 30px rgba(0,0,0,0.5); z-index: 1000; }
        .win-header { background: #e6e6e6; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        .win-body { flex: 1; padding: 25px; overflow-y: auto; }
        .win-close { cursor: pointer; font-weight: bold; padding: 0 10px; }

        /* COMPONENTES DE APPS */
        .btn-main { background: #0078d7; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; border-radius: 3px; }
        .input-field { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        .file-list { list-style: none; }
        .file-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <!-- ICONOS ESCRITORIO -->
    <div id="desktop">
        <div class="icon" onclick="openWindow('win-pc')"><i class="fa-solid fa-desktop" style="color:#56ccf2;"></i><span>Este Equipo</span></div>
        <div class="icon" onclick="openWindow('win-factura')"><i class="fa-solid fa-file-invoice" style="color:#e8e8e8;"></i><span>Facturador</span></div>
        <div class="icon" onclick="openWindow('win-mail')"><i class="fa-solid fa-envelope" style="color:#f2c94c;"></i><span>Mail</span></div>
        <div class="icon" onclick="openWindow('win-tramites')"><i class="fa-solid fa-id-card" style="color:#27ae60;"></i><span>Trámites</span></div>
    </div>

    <!-- MENÚ INICIO -->
    <div id="start-menu">
        <div class="menu-item" onclick="openWindow('win-pc')"><i class="fa-solid fa-folder"></i> Documentos</div>
        <div class="menu-item" onclick="openWindow('win-factura')"><i class="fa-solid fa-pen"></i> Generar Factura</div>
        <div class="menu-item" onclick="openWindow('win-mail')"><i class="fa-solid fa-envelope"></i> Correo</div>
        <div class="menu-item" onclick="openWindow('win-tramites')"><i class="fa-solid fa-check-circle"></i> Trámites y Turnos</div>
    </div>

    <!-- VENTANAS -->
    <div id="win-pc" class="window">
        <div class="win-header"><span>Este Equipo > Documentos</span><span class="win-close" onclick="closeWindow('win-pc')">✕</span></div>
        <div class="win-body"><h3>Tus Archivos Guardados</h3><ul id="lista-archivos" class="file-list"></ul></div>
    </div>

    <div id="win-factura" class="window">
        <div class="win-header"><span>Generador de Facturas</span><span class="win-close" onclick="closeWindow('win-factura')">✕</span></div>
        <div class="win-body">
            <h3>Nueva Factura</h3>
            <input type="text" id="fac-cliente" placeholder="Nombre del Cliente" class="input-field">
            <input type="number" id="fac-monto" placeholder="Monto $" class="input-field">
            <button class="btn-main" onclick="guardarFactura()">Guardar PDF</button>
        </div>
    </div>

    <div id="win-mail" class="window">
        <div class="win-header"><span>Outlook Express - Redactar</span><span class="win-close" onclick="closeWindow('win-mail')">✕</span></div>
        <div class="win-body">
            <input type="text" placeholder="Para: destinatario@ejemplo.com" class="input-field">
            <label>Adjuntar desde "Documentos":</label>
            <select id="select-archivos" class="input-field"><option>-- Sin archivos --</option></select>
            <button class="btn-main" onclick="alert('Mail enviado con éxito')">Enviar</button>
        </div>
    </div>

    <div id="win-tramites" class="window">
        <div class="win-header"><span>Portal de Trámites</span><span class="win-close" onclick="closeWindow('win-tramites')">✕</span></div>
        <div class="win-body">
            <h3>Seleccioná un trámite:</h3>
            <button class="btn-main" onclick="alert('Turno solicitado')">Solicitar Turno Médico</button><br>
            <button class="btn-main" onclick="alert('Certificado descargado')">Descargar Certificado</button>
        </div>
    </div>

    <!-- BARRA DE TAREAS -->
    <div id="taskbar">
        <div class="start-btn" onclick="toggleStart()"><i class="fa-brands fa-windows"></i></div>
        <div class="clock" id="reloj">00:00</div>
    </div>

    <script>
        // Lógica de Estado
        let archivos = [];

        function openWindow(id) { document.getElementById(id).style.display = 'flex'; document.getElementById('start-menu').style.display = 'none'; }
        function closeWindow(id) { document.getElementById(id).style.display = 'none'; }
        function toggleStart() { const sm = document.getElementById('start-menu'); sm.style.display = (sm.style.display === 'flex') ? 'none' : 'flex'; }
        
        function actualizarReloj() {
            const now = new Date();
            document.getElementById('reloj').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(actualizarReloj, 1000);

        function guardarFactura() {
            const cliente = document.getElementById('fac-cliente').value;
            const monto = document.getElementById('fac-monto').value;
            if(!cliente || !monto) return alert("Faltan datos");

            const nombre = `Factura_${cliente}_$${monto}.pdf`;
            archivos.push(nombre);

            // Actualizar lista en "Este Equipo"
            const lista = document.getElementById('lista-archivos');
            lista.innerHTML += `<li class="file-item"><i class="fa-solid fa-file-pdf"></i> ${nombre}</li>`;

            // Actualizar selector en "Mail"
            const select = document.getElementById('select-archivos');
            if(archivos.length === 1) select.innerHTML = ""; // Borrar el placeholder
            select.innerHTML += `<option>${nombre}</option>`;

            alert("Archivo guardado correctamente en 'Documentos'");
            closeWindow('win-factura');
        }
    </script>
</body>
</html>
