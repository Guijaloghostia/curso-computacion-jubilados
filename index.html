<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Windows 10 - Eterna Juventud (100 Ejercicios)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; overflow: hidden; background: #004275 url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; color: #333; }
    
    #desktop { position: absolute; top: 0; left: 0; right: 0; bottom: 38px; padding: 15px; display: flex; flex-direction: column; flex-wrap: wrap; gap: 15px; align-content: flex-start; }
    
    /* Iconos Escritorio */
    .icon { width: 95px; text-align: center; color: white; cursor: pointer; padding: 8px; border-radius: 6px; font-size: 12px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); transition: background 0.2s; border: 1px solid transparent; }
    .icon:hover { background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.4); }
    .icon i { font-size: 38px; display: block; margin-bottom: 5px; }

    /* Barra de tareas (Abajo fija) */
    #taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 38px; background: rgba(12, 12, 12, 0.94); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 9999; backdrop-filter: blur(5px); color: white; }
    .taskbar-btn { height: 100%; padding: 0 15px; display: flex; align-items: center; background: transparent; border: none; color: white; cursor: pointer; font-size: 16px; }
    .taskbar-btn:hover { background: rgba(255, 255, 255, 0.15); }

    /* Ventanas */
    .window { position: absolute; background: #fdfdfd; color: #000; border: 1px solid #707070; box-shadow: 0 10px 25px rgba(0,0,0,0.4); display: flex; flex-direction: column; z-index: 100; border-radius: 6px; overflow: hidden; }
    
    /* POSICIÓN FIJA GUÍA: Esquina superior derecha, resguardada de la barra inferior */
    #guide-window {
      top: 15px !important;
      right: 15px !important;
      left: auto !important;
      bottom: auto !important;
      width: 360px !important;
      height: calc(100vh - 70px) !important;
      max-height: 620px !important;
      border: 3px solid #27ae60 !important;
      z-index: 200 !important;
    }

    .window-header { background: #e8e8e8; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; font-weight: 600; font-size: 14px; color: #333; }
    .window-body { padding: 16px; flex-grow: 1; overflow-y: auto; background: #fff; font-size: 14px; color: #333; display: flex; flex-direction: column; }
    .window-actions { padding: 12px; background: #f9f9f9; border-top: 1px solid #eee; }

    .btn { padding: 10px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: 600; width: 100%; }
    .btn-success { background: #27ae60; color: white; }
    .btn-success:hover { background: #219150; }
    .btn-primary { background: #0078d7; color: white; margin-top: 8px; }

    .input-box { width: 100%; padding: 10px; margin: 8px 0 12px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
  </style>
</head>
<body>

  <div id="desktop">
    <div class="icon" onclick="openWindow('win-word')">
      <i class="fa-solid fa-file-word" style="color:#2980b9;"></i>
      <span>WordPad</span>
    </div>
    <div class="icon" onclick="openWindow('win-factura')">
      <i class="fa-solid fa-file-invoice" style="color:#f39c12;"></i>
      <span>Facturador</span>
    </div>
    <div class="icon" onclick="openWindow('win-carpeta')">
      <i class="fa-solid fa-folder-open" style="color:#f1c40f;"></i>
      <span>Mis Archivos</span>
    </div>
  </div>

  <!-- VENTANA GUÍA FIJA A LA DERECHA CON 100 EJERCICIOS -->
  <div id="guide-window" class="window">
    <div class="window-header" style="background:#27ae60; color:white;">
      <span><i class="fa-solid fa-graduation-cap"></i> Guía de Aprendizaje</span>
    </div>
    <div class="window-body">
      <label for="select-ejercicios" style="font-weight:bold; font-size:12px; color:#555;">SELECCIONAR TAREA (1 a 100):</label>
      <select id="select-ejercicios" class="input-box" onchange="cambiarEjercicio()"></select>

      <div style="background:#f0f9f4; padding:12px; border-left:4px solid #27ae60; border-radius:4px; margin-bottom:12px;">
        <h4 id="ex-title" style="color:#1e824c; font-size:15px; margin-bottom:6px;">Cargando...</h4>
        <p id="ex-desc" style="font-size:14px; line-height:1.4; color:#222;"></p>
      </div>

      <div id="feedback" style="display:none; padding:10px; border-radius:4px; font-size:13px; font-weight:600; margin-bottom:10px;"></div>
    </div>
    <div class="window-actions">
      <button class="btn btn-success" onclick="verificarEjercicio()">Verificar Ejercicio</button>
      <button id="btn-siguiente" class="btn btn-primary" style="display:none;" onclick="siguienteEjercicio()">Siguiente Lección ➔</button>
    </div>
  </div>

  <!-- VENTANAS DE TRABAJO (ABREN A LA IZQUIERDA) -->
  <div id="win-word" class="window" style="top:20px; left:20px; width:500px; height:420px; display:none;">
    <div class="window-header"><span>WordPad</span><button onclick="closeWindow('win-word')">✕</button></div>
    <div class="window-body"><textarea id="word-input" style="width:100%; height:100%; padding:10px; font-size:15px; border:1px solid #ccc; resize:none;" placeholder="Escriba aquí..."></textarea></div>
  </div>

  <div id="win-factura" class="window" style="top:20px; left:20px; width:450px; height:380px; display:none;">
    <div class="window-header"><span>Facturador</span><button onclick="closeWindow('win-factura')">✕</button></div>
    <div class="window-body">
      <label style="font-size:13px; font-weight:bold;">Cliente:</label>
      <input type="text" id="factura-cliente" class="input-box" placeholder="Nombre...">
      <label style="font-size:13px; font-weight:bold;">Monto ($):</label>
      <input type="number" id="factura-monto" class="input-box" placeholder="0.00">
    </div>
  </div>

  <div id="win-carpeta" class="window" style="top:20px; left:20px; width:420px; height:320px; display:none;">
    <div class="window-header"><span>Mis Archivos</span><button onclick="closeWindow('win-carpeta')">✕</button></div>
    <div class="window-body"><p style="color:#666; font-size:13px;">Carpeta lista para guardar documentos.</p></div>
  </div>

  <!-- BARRA DE TAREAS -->
  <div id="taskbar">
    <button class="taskbar-btn"><i class="fa-brands fa-windows"></i></button>
    <div style="font-size:12px;" id="reloj">12:00 PM</div>
  </div>

  <script>
    // GENERADOR COMPLETO DE LOS 100 EJERCICIOS
    const ejercicios = [];

    // Módulo 1: Precisión Touchpad (1-15)
    for(let i = 1; i <= 15; i++) {
      ejercicios.push({
        id: i,
        modulo: "Módulo 1: Touchpad",
        title: `${i}. Práctica de Precisión Táctil #${i}`,
        desc: `Tocá el botón 'Verificar Ejercicio' abajo a la derecha usando el pad para confirmar tu toque de nivel ${i}.`,
        tipo: "simple"
      });
    }

    // Módulo 2: Manejo de Ventanas (16-30)
    const apps = [
      { id: "win-factura", nombre: "Facturador" },
      { id: "win-word", nombre: "WordPad" },
      { id: "win-carpeta", nombre: "Mis Archivos" }
    ];
    for(let i = 16; i <= 30; i++) {
      const app = apps[i % 3];
      ejercicios.push({
        id: i,
        modulo: "Módulo 2: Ventanas",
        title: `${i}. Abrir ventana de ${app.nombre}`,
        desc: `Tocá el ícono de '${app.nombre}' en el escritorio para abrir la ventana correspondiente.`,
        tipo: "ventana",
        target: app.id
      });
    }

    // Módulo 3: Escritura en WordPad (31-45)
    const palabras = ["Hola", "Eterna", "Juventud", "Argentina", "Computación", "Tablet", "Teclado", "Mensaje", "Texto", "Práctica", "Digital", "Mar del Plata", "Mañana", "Curso", "Final"];
    for(let i = 31; i <= 45; i++) {
      const pal = palabras[i - 31];
      ejercicios.push({
        id: i,
        modulo: "Módulo 3: Redacción",
        title: `${i}. Escribir palabra en WordPad: '${pal}'`,
        desc: `Abrí WordPad e ingresá la palabra '${pal}' dentro de la hoja blanca.`,
        tipo: "texto",
        targetInput: "word-input",
        esperado: pal.toLowerCase()
      });
    }

    // Módulo 4: Facturación (46-60)
    const clientes = ["Juan", "María", "Pedro", "Ana", "Luis", "Carmen", "Roberto", "Laura", "Diego", "Marta", "Jorge", "Lucía", "Esteban", "Rosa", "Guillermo"];
    for(let i = 46; i <= 60; i++) {
      const cli = clientes[i - 46];
      ejercicios.push({
        id: i,
        modulo: "Módulo 4: Facturación",
        title: `${i}. Cargar Cliente: ${cli}`,
        desc: `Abrí la app Facturador e ingresá '${cli}' en el casillero de Cliente.`,
        tipo: "texto",
        targetInput: "factura-cliente",
        esperado: cli.toLowerCase()
      });
    }

    // Módulo 5: Gestión de Archivos y Carpetas (61-75)
    for(let i = 61; i <= 75; i++) {
      ejercicios.push({
        id: i,
        modulo: "Módulo 5: Archivos",
        title: `${i}. Explorar Carpeta de Archivos #${i-60}`,
        desc: `Abrí la ventana 'Mis Archivos' desde el escritorio para revisar los archivos del sistema.`,
        tipo: "ventana",
        target: "win-carpeta"
      });
    }

    // Módulo 6: Formularios Combinados (76-85)
    for(let i = 76; i <= 85; i++) {
      const monto = i * 100;
      ejercicios.push({
        id: i,
        modulo: "Módulo 6: Montos",
        title: `${i}. Cargar Monto: $${monto}`,
        desc: `Abrí Facturador e ingresá el valor '${monto}' en la casilla de Monto.`,
        tipo: "texto",
        targetInput: "factura-monto",
        esperado: monto.toString()
      });
    }

    // Módulo 7: Trámites y Comandos (86-95)
    for(let i = 86; i <= 95; i++) {
      ejercicios.push({
        id: i,
        modulo: "Módulo 7: Combinados",
        title: `${i}. Tarea Integrada #${i-85}`,
        desc: `Abrí la app WordPad para validar el inicio de sesión del sistema.`,
        tipo: "ventana",
        target: "win-word"
      });
    }

    // Módulo 8: Evaluación Final (96-100)
    for(let i = 96; i <= 100; i++) {
      ejercicios.push({
        id: i,
        modulo: "Módulo 8: Evaluación",
        title: `${i}. Gran Desafío Final #${i-95}`,
        desc: `Abrí Facturador y completá la tarea de cierre de módulo.`,
        tipo: "ventana",
        target: "win-factura"
      });
    }

    let indiceActual = 0;

    function poblarSelect() {
      const sel = document.getElementById('select-ejercicios');
      sel.innerHTML = '';
      ejercicios.forEach((ej, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.innerText = ej.title;
        sel.appendChild(opt);
      });
    }

    function cargarEjercicio() {
      const ej = ejercicios[indiceActual];
      document.getElementById('ex-title').innerText = ej.title;
      document.getElementById('ex-desc').innerText = ej.desc;
      document.getElementById('select-ejercicios').value = indiceActual;
      document.getElementById('btn-siguiente').style.display = 'none';
      ocultarFeedback();
    }

    function cambiarEjercicio() {
      indiceActual = parseInt(document.getElementById('select-ejercicios').value);
      cargarEjercicio();
    }

    function verificarEjercicio() {
      const ej = ejercicios[indiceActual];
      let ok = false;

      if (ej.tipo === "simple") ok = true;
      else if (ej.tipo === "ventana") {
        const win = document.getElementById(ej.target);
        if (win && win.style.display !== 'none') ok = true;
      } else if (ej.tipo === "texto") {
        const input = document.getElementById(ej.targetInput);
        if (input && input.value.trim().toLowerCase().includes(ej.esperado)) ok = true;
      }

      if (ok) {
        mostrarFeedback("¡Excelente! Tarea completada correctamente.", true);
        document.getElementById('btn-siguiente').style.display = 'block';
      } else {
        mostrarFeedback("Todavía no se cumplió la consigna. Revisá los pasos e intentalo de nuevo.", false);
      }
    }

    function siguienteEjercicio() {
      if (indiceActual < ejercicios.length - 1) {
        indiceActual++;
        cargarEjercicio();
      } else {
        mostrarFeedback("¡Felicitaciones! Completaste los 100 ejercicios del curso.", true);
      }
    }

    function mostrarFeedback(msg, exito) {
      const fb = document.getElementById('feedback');
      fb.innerText = msg;
      fb.style.display = 'block';
      fb.style.background = exito ? '#d4edda' : '#f8d7da';
      fb.style.color = exito ? '#155724' : '#721c24';
    }

    function ocultarFeedback() {
      document.getElementById('feedback').style.display = 'none';
    }

    function openWindow(id) { document.getElementById(id).style.display = 'flex'; }
    function closeWindow(id) { document.getElementById(id).style.display = 'none'; }

    poblarSelect();
    cargarEjercicio();
  </script>
</body>
</html>
