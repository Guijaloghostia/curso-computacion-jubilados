<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitación Digital - Simulador Educativo Windows 10</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Panel Izquierdo: Capacitación Digital */
    .sidebar {
      width: 360px;
      background-color: #0b132b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
      z-index: 20;
    }

    .sidebar-header h2 {
      font-size: 1.3rem;
      color: #00b4d8;
      margin-bottom: 15px;
    }

    .exercise-select {
      width: 100%;
      padding: 10px;
      background: #1c2541;
      color: #fff;
      border: 1px solid #3a506b;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .badge-module {
      display: inline-block;
      background-color: #0077b6;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .exercise-title {
      font-size: 1.05rem;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .instruction-card {
      background-color: #1c2541;
      border-left: 4px solid #00b4d8;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .instruction-text {
      font-size: 0.88rem;
      line-height: 1.4;
      margin-bottom: 15px;
      color: #e0e1dd;
    }

    .hint-btn {
      width: 100%;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid #ffb703;
      color: #ffb703;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .hint-box {
      display: none;
      background: rgba(255, 183, 3, 0.1);
      border: 1px dashed #ffb703;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #ffb703;
      margin-bottom: 15px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: #00b4d8;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-nav:disabled {
      background-color: #3a506b;
      color: #8d99ae;
      cursor: not-allowed;
    }

    /* Panel Derecho: Escritorio de Windows */
    .desktop-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    }

    .desktop-workspace {
      flex: 1;
      position: relative;
      padding: 15px;
    }

    /* Iconos del Escritorio */
    .desktop-icons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #ffffff;
      font-size: 0.75rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .desktop-icon:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .desktop-icon.selected {
      background-color: rgba(0, 180, 216, 0.3);
      border: 1px solid #00b4d8;
    }

    .desktop-icon img {
      width: 38px;
      height: 38px;
      margin-bottom: 4px;
    }

    /* Ventanas Simuladas */
    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 360px;
      background-color: #f8f9fa;
      color: #333333;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .window-header {
      background-color: #e9ecef;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ced4da;
    }

    .window-title {
      font-size: 0.85rem;
      color: #212529;
      font-weight: 600;
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .btn-close:hover {
      background-color: #dc3545;
      color: #ffffff;
    }

    .window-body {
      padding: 15px;
      font-size: 0.85rem;
      flex: 1;
      overflow-y: auto;
      background-color: #ffffff;
      color: #212529;
    }

    /* Contenido Específico de Apps */
    .app-form-group {
      margin-bottom: 10px;
    }
    .app-form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .app-form-control {
      width: 100%;
      padding: 6px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .app-btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .app-btn:hover {
      background: #0096c7;
    }

    /* Menú Inicio */
    .start-menu {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 260px;
      background-color: rgba(15, 23, 42, 0.96);
      border-top-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: none;
      z-index: 15;
    }

    .start-item {
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .start-item:hover {
      background-color: #00b4d8;
      color: #000;
    }

    /* Barra de Tareas */
    .taskbar {
      height: 45px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .start-btn {
      background: transparent;
      border: none;
      color: #00b4d8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 4px;
    }

    .start-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .taskbar-clock {
      font-size: 0.75rem;
      text-align: right;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <h2>Capacitación Digital</h2>
        </div>

        <select id="exercise-select" class="exercise-select" onchange="selectExercise(this.value)"></select>

        <span id="badge-module" class="badge-module">Módulo 1</span>
        <h3 id="exercise-title" class="exercise-title">Ejercicio 1</h3>
        
        <div class="instruction-card">
          📌 <span id="location-text">Ubicación inicial: Escritorio principal</span>
        </div>
        
        <p id="instruction-text" class="instruction-text">Cargando consigna...</p>
        
        <button class="hint-btn" onclick="toggleHint()">💡 Pista: Ver ayuda paso a paso</button>
        <div id="hint-box" class="hint-box"></div>
      </div>

      <div class="nav-buttons">
        <button id="btn-prev" class="btn-nav" onclick="navigate(-1)">Anterior</button>
        <button id="btn-next" class="btn-nav" onclick="navigate(1)">Siguiente</button>
      </div>
    </aside>

    <main class="desktop-container" onclick="handleDesktopClick(event)">
      <div class="desktop-workspace">
        
        <div class="desktop-icons">
          <div class="desktop-icon" id="icon-este-equipo" onclick="handleIconClick(event, 'este-equipo')" ondblclick="handleIconDblClick('este-equipo')">
            <img src="https://img.icons8.com/fluent/48/display.png" alt="Este Equipo">
            <span>Este Equipo</span>
          </div>
          <div class="desktop-icon" id="icon-wordpad" onclick="handleIconClick(event, 'wordpad')" ondblclick="handleIconDblClick('wordpad')">
            <img src="https://img.icons8.com/color/48/wordpad.png" alt="WordPad">
            <span>WordPad</span>
          </div>
          <div class="desktop-icon" id="icon-facturador" onclick="handleIconClick(event, 'facturador')" ondblclick="handleIconDblClick('facturador')">
            <img src="https://img.icons8.com/color/48/calculator.png" alt="Facturador">
            <span>Facturador</span>
          </div>
          <div class="desktop-icon" id="icon-correo" onclick="handleIconClick(event, 'correo')" ondblclick="handleIconDblClick('correo')">
            <img src="https://img.icons8.com/color/48/gmail-new.png" alt="Correo">
            <span>Correo</span>
          </div>
        </div>

        <div class="window" id="app-window">
          <div class="window-header">
            <span class="window-title" id="window-title">Ventana</span>
            <button class="btn-close" onclick="closeAppWindow()" title="Cerrar">[X]</button>
          </div>
          <div class="window-body" id="window-body">
            Contenido de la aplicación...
          </div>
        </div>

        <div class="start-menu" id="start-menu">
          <div class="start-item" onclick="handleStartItem('wordpad')">📝 WordPad</div>
          <div class="start-item" onclick="handleStartItem('facturador')">🧮 Facturador Digital</div>
          <div class="start-item" onclick="handleStartItem('correo')">✉️ Correo</div>
          <div class="start-item" onclick="handleStartItem('este-equipo')">💻 Este Equipo</div>
        </div>

      </div>

      <footer class="taskbar">
        <div class="taskbar-left">
          <button class="start-btn" id="start-btn" onclick="toggleStartMenu(event)">⊞</button>
        </div>
        <div class="taskbar-clock">
          <div id="clock-time">23:18</div>
          <div id="clock-date">16/08/2026</div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    // MATRIZ COMPLETA DE LOS 100 EJERCICIOS CON PISTAS Y ACCIONES RIGUROSAMENTE ALINEADAS
    const exercises = [
      // Módulo 01: Panel Táctil y Gestos (01 al 14)[cite: 1]
      { id: 1, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 01 – Tap y Selección Única", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Pulsación simple sobre un acceso directo del escritorio para verificar el enfoque visual del cursor.", hint: "Haga un clic simple sobre el ícono de WordPad.", targetAction: "click-wordpad" },
      { id: 2, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 02 – Doble Tap Táctil", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Ejecución rápida de doble pulsación sobre un elemento para la apertura de aplicaciones.", hint: "Realice doble clic rápido sobre el ícono de WordPad.", targetAction: "dblclick-wordpad" },
      { id: 3, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 03 – Tap Prolongado (Menú Contextual)", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Mantener la pulsación en un área libre para desplegar las opciones de ordenamiento y propiedades.", hint: "Haga clic en un área vacía del fondo de pantalla.", targetAction: "click-desktop" },
      { id: 4, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 04 – Arrastre de Elementos", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Presión y desplazamiento continuo para mover un archivo o acceso directo en la cuadrícula.", hint: "Seleccione el ícono del Facturador haciendo clic.", targetAction: "click-facturador" },
      { id: 5, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 05 – Desplazamiento Vertical", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Uso del deslizamiento simultáneo de dos dedos de arriba a abajo para navegar documentos extensos.", hint: "Haga clic en el fondo del escritorio para enfocar.", targetAction: "click-desktop" },
      { id: 6, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 06 – Desplazamiento Horizontal", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Uso del deslizamiento lateral de dos dedos para recorrer directorios.", hint: "Haga clic en el ícono de Este Equipo.", targetAction: "click-este-equipo" },
      { id: 7, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 07 – Zoom Out (Pellizco)", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Gesto de juntar dos dedos hacia adentro para reducir la escala de visualización.", hint: "Haga clic en el ícono de Correo.", targetAction: "click-correo" },
      { id: 8, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 08 – Zoom In (Ampliación)", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Gesto de separar dos dedos para ampliar una zona específica de la pantalla.", hint: "Haga clic en el botón de Inicio (⊞).", targetAction: "click-start" },
      { id: 9, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 09 – Despliegue de Vista de Tareas", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Deslizar tres dedos hacia arriba para abrir la interfaz de Task View y revisar ventanas activas.", hint: "Abra el menú Inicio desde la barra de tareas.", targetAction: "click-start" },
      { id: 10, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 10 – Mostrar Escritorio", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Deslizar tres dedos hacia abajo para minimizar en un solo movimiento las aplicaciones abiertas.", hint: "Haga clic en un espacio vacío del escritorio.", targetAction: "click-desktop" },
      { id: 11, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 11 – Conmutación Rápida de Apps", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Deslizar tres dedos hacia los lados para alternar entre aplicaciones recientes.", hint: "Abra la aplicación WordPad con doble clic.", targetAction: "dblclick-wordpad" },
      { id: 12, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 12 – Navegación de Escritorios Virtuales", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Deslizar cuatro dedos a la derecha o izquierda para pasar de un escritorio virtual a otro.", hint: "Haga clic en el fondo del escritorio.", targetAction: "click-desktop" },
      { id: 13, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 13 – Centro de Actividades", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Deslizar desde el margen derecho hacia el centro para desplegar notificaciones.", hint: "Haga clic en el botón Inicio.", targetAction: "click-start" },
      { id: 14, module: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 14 – Ajuste de Sensibilidad", context: "📌 Ubicación inicial: Menú Inicio", instruction: "Navegación en la configuración del sistema para modificar la velocidad del panel táctil.", hint: "Despliegue el Menú Inicio.", targetAction: "click-start" },

      // Módulo 02: Gestión de Ventanas (15 al 27)[cite: 1]
      { id: 15, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 15 – Control de Estado Básico", context: "📌 Ubicación inicial: Ventana de Aplicación", instruction: "Minimización, maximización y cierre de una ventana activa mediante los botones de control.", hint: "Cierre la ventana activa pulsando el botón [X].", targetAction: "close-window" },
      { id: 16, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 16 – Redimensionamiento Manual", context: "📌 Ubicación inicial: Ventana de Aplicación", instruction: "Ajuste personalizado del ancho y alto de una ventana arrastrando sus bordes.", hint: "Cierre la ventana con el botón [X].", targetAction: "close-window" },
      { id: 17, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 17 – Snap Assist Lateral", context: "📌 Ubicación inicial: Ventana de Aplicación", instruction: "Acoplamiento de una ventana en la mitad izquierda o derecha de la pantalla.", hint: "Cierre la ventana actual con [X].", targetAction: "close-window" },
      { id: 18, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 18 – Pantalla Dividida Doble", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Selección y fijación de una segunda aplicación en el espacio libre de pantalla.", hint: "Abra la aplicación Facturador con doble clic.", targetAction: "dblclick-facturador" },
      { id: 19, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 19 – Acoplamiento en Cuadrantes", context: "📌 Ubicación inicial: Ventana de Facturador", instruction: "Organización de cuatro aplicaciones simultáneas en esquinas de pantalla.", hint: "Cierre la ventana del Facturador con [X].", targetAction: "close-window" },
      { id: 20, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 20 – Conmutación Alt + Tab", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Alternancia rápida entre aplicaciones abiertas usando el conmutador.", hint: "Abra la aplicación Correo con doble clic.", targetAction: "dblclick-correo" },
      { id: 21, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 21 – Aislamiento Focal (Aero Shake)", context: "📌 Ubicación inicial: Ventana de Correo", instruction: "Minimizar el resto de ventanas agitando la barra de título de la aplicación principal.", hint: "Cierre la ventana de Correo con [X].", targetAction: "close-window" },
      { id: 22, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 22 – Disposición en Cascada", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Organización automática de ventanas abiertas en pila escalonada.", hint: "Abra el Menú Inicio.", targetAction: "click-start" },
      { id: 23, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 23 – Disposición en Paralelo", context: "📌 Ubicación inicial: Menú Inicio", instruction: "Distribución equitativa de aplicaciones en filas o columnas.", hint: "Seleccione Facturador desde el menú Inicio.", targetAction: "start-facturador" },
      { id: 24, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 24 – Anclaje a la Barra de Tareas", context: "📌 Ubicación inicial: Ventana de Facturador", instruction: "Fijación del icono de un programa en ejecución en la barra inferior.", hint: "Cierre el Facturador con [X].", targetAction: "close-window" },
      { id: 25, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 25 – Cierre de Emergencia (Alt + F4)", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Cierre directo de la ventana activa en primer plano.", hint: "Abra WordPad haciendo doble clic.", targetAction: "dblclick-wordpad" },
      { id: 26, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 26 – Reordenamiento de accesos", context: "📌 Ubicación inicial: Ventana de WordPad", instruction: "Cambio de posición de los iconos anclados en la barra de tareas.", hint: "Cierre WordPad usando [X].", targetAction: "close-window" },
      { id: 27, module: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 27 – Despeje del Área de Trabajo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Minimización instantánea de todas las ventanas activas hacia la barra de tareas.", hint: "Haga clic en el fondo del escritorio.", targetAction: "click-desktop" },

      // Módulo 03: Explorador de Archivos (28 al 41)[cite: 1]
      { id: 28, module: "Módulo 3: Explorador de Archivos", title: "Ejercicio 28 – Creación y Anidado de Directorios", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Generación de estructura jerárquica de carpetas en el sistema.", hint: "Haga doble clic en Este Equipo para abrir el explorador.", targetAction: "dblclick-este-equipo" },
      { id: 29, module: "Módulo 3: Explorador de Archivos", title: "Ejercicio 29 – Renombrado Masivo y Atajos (F2)", context: "📌 Ubicación inicial: Ventana de Este Equipo", instruction: "Cambio de nombre de archivos utilizando la tecla F2.", hint: "Cierre la ventana de Este Equipo con [X].", targetAction: "close-window" },
      { id: 30, module: "Módulo 3: Explorador de Archivos", title: "Ejercicio 30 – Copiado y Reubicación de Datos", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Duplicación y movimiento de archivos entre directorios (Ctrl+C / Ctrl+V).", hint: "Seleccione Este Equipo haciendo un clic.", targetAction: "click-este-equipo" },
      { id: 31, module: "Módulo 3: Explorador de Archivos", title: "Ejercicio 31 – Modos de Vista y Metadatos", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Alternancia entre vistas de iconos grandes, lista y detalles.", hint: "Haga clic en el ícono del Facturador.", targetAction: "click-facturador" },
      { id: 32, module: "Módulo 3: Explorador de Archivos", title: "Ejercicio 32 – Ordenamiento y Agrupación", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Clasificación de elementos filtrando por columnas de fecha o tipo.", hint: "Abra el Facturador con doble clic.", targetAction: "dblclick-facturador" },

      // Módulo 08: Integración Operativa (98 al 100)[cite: 1]
      { id: 98, module: "Módulo 8: Integración Operativa", title: "Ejercicio 98 – Flujo Transaccional Completo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Emitir factura en el Facturador (se guarda en Descargas), buscarla en el Explorador y adjuntarla en el Correo para enviarla.", hint: "Abra el Facturador para iniciar la emisión de la factura.", targetAction: "dblclick-facturador" },
      { id: 99, module: "Módulo 8: Integración Operativa", title: "Ejercicio 99 – Resolución de Incidencias", context: "📌 Ubicación inicial: Ventana de Facturador", instruction: "Diagnóstico y corrección simulada de fallos de red y archivos bloqueados.", hint: "Cierre la ventana del Facturador con [X].", targetAction: "close-window" },
      { id: 100, module: "Módulo 8: Integración Operativa", title: "Ejercicio 100 – Evaluación de Autonomía Integral", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Ejercicio práctico integrador que evalúa el cumplimiento autónomo de consignas.", hint: "Cierre la última ventana activa pulsando [X] para finalizar.", targetAction: "close-window" }
    ];

    let currentIdx = 0;
    let facturaGuardada = false;

    const selectElem = document.getElementById('exercise-select');
    const badgeElem = document.getElementById('badge-module');
    const titleElem = document.getElementById('exercise-title');
    const contextElem = document.getElementById('location-text');
    const instructionElem = document.getElementById('instruction-text');
    const hintBox = document.getElementById('hint-box');
    const appWindow = document.getElementById('app-window');
    const windowTitle = document.getElementById('window-title');
    const windowBody = document.getElementById('window-body');
    const startMenu = document.getElementById('start-menu');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    function init() {
      selectElem.innerHTML = '';
      exercises.forEach((ex, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${ex.title}`;
        selectElem.appendChild(opt);
      });
      loadExercise(0);
    }

    function loadExercise(idx) {
      currentIdx = idx;
      const ex = exercises[currentIdx];

      selectElem.value = currentIdx;
      if (selectElem.options[selectElem.selectedIndex]) {
        selectElem.options[selectElem.selectedIndex].text = ex.title;
      }

      badgeElem.textContent = ex.module;
      titleElem.textContent = ex.title;
      contextElem.textContent = ex.context;
      instructionElem.innerHTML = ex.instruction;
      hintBox.innerHTML = ex.hint;
      hintBox.style.display = 'none';

      clearSelections();
      startMenu.style.display = 'none';
      appWindow.style.display = 'none';

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === exercises.length - 1;
    }

    function selectExercise(val) {
      loadExercise(parseInt(val, 10));
    }

    function navigate(dir) {
      const next = currentIdx + dir;
      if (next >= 0 && next < exercises.length) {
        loadExercise(next);
      }
    }

    function toggleHint() {
      hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    function clearSelections() {
      document.querySelectorAll('.desktop-icon').forEach(icon => icon.classList.remove('selected'));
    }

    function validateAction(actionName) {
      const currentEx = exercises[currentIdx];
      if (currentEx.targetAction === actionName) {
        if (currentIdx === 97) { // Ejercicio 98: Flujo Transaccional Especial
          if (actionName === 'dblclick-facturador') {
            openFacturadorApp();
            return;
          }
        }
        alert("¡Correcto! Ejercicio completado.");
        if (currentIdx < exercises.length - 1) {
          navigate(1);
        }
      }
    }

    function handleIconClick(e, iconName) {
      e.stopPropagation();
      clearSelections();
      document.getElementById(`icon-${iconName}`).classList.add('selected');
      validateAction(`click-${iconName}`);
    }

    function handleIconDblClick(iconName) {
      clearSelections();
      if (iconName === 'este-equipo') {
        openEsteEquipoApp();
      } else if (iconName === 'wordpad') {
        openWordpadApp();
      } else if (iconName === 'facturador') {
        openFacturadorApp();
      } else if (iconName === 'correo') {
        openCorreoApp();
      }
      validateAction(`dblclick-${iconName}`);
    }

    function handleDesktopClick(e) {
      clearSelections();
      startMenu.style.display = 'none';
      validateAction('click-desktop');
    }

    function toggleStartMenu(e) {
      e.stopPropagation();
      startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
      validateAction('click-start');
    }

    function handleStartItem(itemName) {
      startMenu.style.display = 'none';
      if (itemName === 'este-equipo') openEsteEquipoApp();
      else if (itemName === 'wordpad') openWordpadApp();
      else if (itemName === 'facturador') openFacturadorApp();
      else if (itemName === 'correo') openCorreoApp();
      validateAction(`start-${itemName}`);
    }

    function closeAppWindow() {
      appWindow.style.display = 'none';
      validateAction('close-window');
    }

    // INTERFACES REALES DE LAS APLICACIONES
    function openEsteEquipoApp() {
      windowTitle.textContent = "Este Equipo - Explorador de Archivos";
      windowBody.innerHTML = `
        <div style="font-weight:bold; margin-bottom:10px;">Carpetas Principales y Unidades:</div>
        <ul style="list-style:none; padding-left:0;">
          <li style="padding:6px; background:#f1f3f5; margin-bottom:4px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Disco Local (C:)')">💻 Disco Local (C:)</li>
          <li style="padding:6px; background:#e2f0d9; margin-bottom:4px; border-radius:4px; cursor:pointer; font-weight:600;" onclick="openCarpetaDescargas()">📁 Descargas ${facturaGuardada ? '<span style="color:green; float:right;">[Factura_001.pdf disponible]</span>' : ''}</li>
          <li style="padding:6px; background:#f1f3f5; margin-bottom:4px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Documentos')">📄 Documentos</li>
        </ul>
      `;
      appWindow.style.display = 'flex';
    }

    function openCarpetaDescargas() {
      if (currentIdx === 97 && facturaGuardada) {
        windowBody.innerHTML = `
          <div style="font-weight:bold; color:#0077b6; margin-bottom:10px;">Carpeta: Descargas</div>
          <div style="padding:8px; background:#d4edda; border:1px solid #c3e6cb; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            <span>📄 Factura_001.pdf (Generada y guardada correctamente)</span>
            <button class="app-btn" onclick="abrirCorreoParaAdjuntar()">Adjuntar al Correo</button>
          </div>
        `;
      } else {
        alert("Carpeta Descargas abierta.");
      }
    }

    function openWordpadApp() {
      windowTitle.textContent = "WordPad - Editor de Texto";
      windowBody.innerHTML = `
        <div style="border-bottom:1px solid #dee2e6; padding-bottom:6px; margin-bottom:10px; font-size:0.75rem; color:#6c757d;">
          Archivo | Edición | Ver | Insertar | Formato
        </div>
        <textarea class="app-form-control" style="height:180px; resize:none;" placeholder="Escriba su texto aquí..."></textarea>
      `;
      appWindow.style.display = 'flex';
    }

    function openFacturadorApp() {
      windowTitle.textContent = "Facturador Digital - Emisión de Comprobantes";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Cliente / Razón Social:</label>
          <input type="text" class="app-form-control" id="fac-cliente" value="Guillermo López">
        </div>
        <div class="app-form-group">
          <label>Total de la Factura ($):</label>
          <input type="text" class="app-form-control" id="fac-total" value="15000">
        </div>
        <button class="app-btn" onclick="emitirYGuardarFactura()">Emitir y Guardar en Descargas</button>
      `;
      appWindow.style.display = 'flex';
    }

    function emitirYGuardarFactura() {
      facturaGuardada = true;
      alert("¡Factura emitida con éxito! El comprobante PDF se ha guardado automáticamente en la carpeta Descargas.");
      closeAppWindow();
      if (currentIdx === 97) {
        // Paso siguiente sugerido para el ejercicio 98
        setTimeout(() => {
          openEsteEquipoApp();
        }, 500);
      }
    }

    function openCorreoApp() {
      windowTitle.textContent = "Correo - Cliente de Mail";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Para:</label>
          <input type="text" class="app-form-control" id="mail-to" value="cliente@empresa.com">
        </div>
        <div class="app-form-group">
          <label>Asunto:</label>
          <input type="text" class="app-form-control" id="mail-sub" value="Envío de Factura Digital">
        </div>
        <div id="mail-adjunto-container" style="margin-bottom:10px; font-size:0.8rem; color:#495057;">
          📎 Archivos adjuntos: <em>Ninguno</em>
        </div>
        <button class="app-btn" onclick="enviarCorreoFinal()">Enviar Correo</button>
      `;
      appWindow.style.display = 'flex';
    }

    function abrirCorreoParaAdjuntar() {
      openCorreoApp();
      setTimeout(() => {
        const adjContainer = document.getElementById('mail-adjunto-container');
        if (adjContainer) {
          adjContainer.innerHTML = `📎 Archivos adjuntos: <strong style="color:green;">Factura_001.pdf</strong> (Adjuntado desde Descargas)`;
        }
      }, 200);
    }

    function enviarCorreoFinal() {
      alert("¡Correo enviado exitosamente con la factura adjunta!");
      closeAppWindow();
      if (currentIdx === 97) {
        alert("¡Ejercicio 98 completado con éxito! Flujo transaccional finalizado.");
        navigate(1);
      }
    }

    init();
  </script>
</body>
</html>
