<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Windows 10 - Capacitación Digital para la Eterna Juventud</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #7b2c83 0%, #3e1248 70%, #210728 100%);
            display: flex;
            flex-direction: column;
        }

        #desktop {
            flex: 1;
            position: relative;
            padding: 20px;
            display: flex;
        }

        .desktop-icons {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: white;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .icon-item:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 6px;
        }

        .icon-wordpad { background: #0078d7; }
        .icon-facturador { background: #107c41; }
        .icon-equipo { background: #00a4ef; }
        .icon-correo { background: #d83b01; }

        .icon-label {
            font-size: 13px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .guide-card {
            position: absolute;
            right: 35px;
            top: 25px;
            width: 440px;
            max-width: 90vw;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #d0d0d0;
        }

        .card-header {
            background-color: #f3f3f3;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .card-header-title {
            font-size: 16px;
            font-weight: bold;
            color: #005a9e;
        }

        .card-counter {
            font-size: 13px;
            font-weight: bold;
            color: #333333;
            background-color: #e5f1fb;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #0078d7;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .select-exercise {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            background-color: #fcfcfc;
            color: #222222;
            outline: none;
            cursor: pointer;
        }

        .select-exercise:focus {
            border-color: #0078d7;
            box-shadow: 0 0 0 2px rgba(0,120,215,0.2);
        }

        .exercise-title {
            font-size: 18px;
            color: #111111;
            font-weight: bold;
            line-height: 1.3;
        }

        .instruction-box {
            font-size: 15px;
            color: #333333;
            line-height: 1.6;
            background-color: #f8f9fa;
            padding: 14px;
            border-radius: 6px;
            border-left: 4px solid #0078d7;
        }

        .clarification {
            color: #555555;
            font-style: italic;
            font-weight: 600;
        }

        .hint-box {
            background-color: #fff9e6;
            border: 1px solid #ffe0b2;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            color: #7a5200;
            display: none;
        }

        .card-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-secondary {
            padding: 10px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-secondary:hover { background-color: #5a6268; }

        .btn-warning { background-color: #d97706; }
        .btn-warning:hover { background-color: #b45309; }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-primary:hover { background-color: #005a9e; }

        .feedback-success {
            padding: 12px;
            background-color: #e6f4ea;
            border: 1px solid #b7e1cd;
            color: #137333;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        #taskbar {
            height: 48px;
            background-color: #101010;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .start-btn {
            height: 100%;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
        }

        .start-btn:hover { background-color: #333333; }

        .start-icon {
            width: 18px;
            height: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }

        .start-square { background-color: white; }

        .system-tray {
            color: white;
            padding: 0 15px;
            font-size: 13px;
            text-align: right;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="desktop-icons">
            <div class="icon-item" onclick="triggerIcon('WordPad')">
                <div class="icon-box icon-wordpad">W</div>
                <span class="icon-label">WordPad</span>
            </div>
            <div class="icon-item" onclick="triggerIcon('Facturador')">
                <div class="icon-box icon-facturador">$</div>
                <span class="icon-label">Facturador</span>
            </div>
            <div class="icon-item" onclick="triggerIcon('Este equipo')">
                <div class="icon-box icon-equipo">💻</div>
                <span class="icon-label">Este equipo</span>
            </div>
            <div class="icon-item" onclick="triggerIcon('Correo')">
                <div class="icon-box icon-correo">✉</div>
                <span class="icon-label">Correo</span>
            </div>
        </div>

        <div class="guide-card">
            <div class="card-header">
                <span class="card-header-title">Capacitación Digital</span>
                <span class="card-counter" id="card-counter">Ej. 1 de 100</span>
            </div>

            <div class="card-body">
                <select id="exercise-select" class="select-exercise" onchange="loadExercise(this.value)"></select>

                <h3 class="exercise-title" id="ex-title">Cargando consigna...</h3>

                <div class="instruction-box" id="ex-instruction"></div>

                <div class="hint-box" id="hint-box"></div>

                <div class="feedback-success" id="success-box"></div>

                <div class="card-actions-row">
                    <button class="btn-secondary" onclick="toggleHint()">💡 Pista</button>
                    <button class="btn-secondary btn-warning" onclick="resetCurrent()">↺ Volver</button>
                </div>

                <button class="btn-primary" onclick="verifyCurrent()">Verificar Ejercicio</button>
            </div>
        </div>
    </div>

    <div id="taskbar" title="Barra de tareas (franja negra ubicada en la parte inferior)">
        <button class="start-btn" title="Botón de Inicio (ventanita blanca en la esquina inferior izquierda)">
            <div class="start-icon">
                <div class="start-square"></div>
                <div class="start-square"></div>
                <div class="start-square"></div>
                <div class="start-square"></div>
            </div>
        </button>
        <div class="system-tray" id="clock-display"></div>
    </div>

    <script>
        // BASE DE DATOS COMPLETA CON LOS 100 EJERCICIOS INDIVIDUALES
        const exercises = [
            // MÓDULO 1: PANEL TÁCTIL (1-14)
            { id: 1, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 1: Reconocimiento del puntero", text: "1. Mueva el dedo suavemente por la superficie del panel táctil.<br>2. Observe cómo se desplaza la flecha <span class='clarification'>(puntero)</span> libremente por la pantalla.", hint: "Desplace el dedo sin hacer fuerza sobre la superficie táctil.", ok: "¡Excelente! Puntero reconocido correctamente." },
            { id: 2, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 2: Doble toque para abrir", text: "1. Lleve la flecha sobre el icono <strong>WordPad</strong> <span class='clarification'>(el programa de escribir)</span>.<br>2. Dé dos toques rápidos seguidos para abrirlo.", hint: "Haga dos golpecitos rápidos sin mover el dedo del lugar.", ok: "¡Muy bien! Logró abrir el programa con doble toque." },
            { id: 3, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 3: Toque largo para opciones", text: "Mantenga apoyado su dedo durante 1 segundo en el centro de la pantalla para desplegar las opciones secundarias <span class='clarification'>(Menú contextual)</span>.", hint: "Deje el dedo fijo sin deslizarlo hasta que aparezca la lista.", ok: "¡Perfecto! Menú de opciones desplegado." },
            { id: 4, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 4: Arrastrar elementos", text: "Mantenga presionado un icono y arrástrelo a otra posición dentro del <strong>Escritorio</strong> <span class='clarification'>(la pantalla principal morada)</span>.", hint: "Presione y deslice el dedo al mismo tiempo.", ok: "¡Estupendo! Elemento reubicado en pantalla." },
            { id: 5, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 5: Subir y bajar página", text: "Use dos dedos juntos sobre la superficie para deslizar el texto hacia abajo.", hint: "Apoye dos dedos paralelos y muévalos en forma vertical.", ok: "¡Correcto! Desplazamiento vertical logrado." },
            { id: 6, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 6: Desplazamiento horizontal", text: "Deslice dos dedos hacia la derecha para pasar a la siguiente imagen de la galería.", hint: "Mueva dos dedos juntos hacia el costado.", ok: "¡Muy bien! Pasó a la siguiente foto." },
            { id: 7, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 7: Achicar imagen (Zoom Out)", text: "Junte dos dedos sobre la pantalla <span class='clarification'>(haciendo un pellizquito suave)</span> para achicar el tamaño de la foto.", hint: "Acerque la yema de sus dos dedos entre sí.", ok: "¡Imagen reducida correctamente!" },
            { id: 8, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 8: Agrandar imagen (Zoom In)", text: "Separe dos dedos sobre la pantalla para ampliar la vista de un detalle.", hint: "Aleje la yema de sus dos dedos entre sí.", ok: "¡Imagen ampliada con éxito!" },
            { id: 9, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 9: Ver programas abiertos", text: "Deslice tres dedos hacia arriba para activar la <strong>Vista de Tareas</strong> <span class='clarification'>(pantalla que muestra todo lo que está abierto)</span>.", hint: "Apoye tres dedos y deslícelos hacia la parte superior.", ok: "¡Excelente! Ahora ve todas sus ventanas." },
            { id: 10, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 10: Limpiar la pantalla", text: "Deslice tres dedos hacia abajo para ocultar las ventanas y ver el <strong>Escritorio</strong>.", hint: "Movimiento rápido con tres dedos hacia la parte inferior.", ok: "¡Pantalla despejada al instante!" },
            { id: 11, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 11: Cambiar de aplicación", text: "Deslice tres dedos hacia los costados para saltar de un programa a otro.", hint: "Deslice tres dedos en sentido horizontal.", ok: "¡Cambió de programa con fluidez!" },
            { id: 12, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 12: Cambiar de mesa de trabajo", text: "Deslice cuatro dedos a la derecha para pasar a su segundo <strong>Escritorio Virtual</strong>.", hint: "Movimiento suave utilizando cuatro dedos.", ok: "¡Pasó al segundo escritorio limpio!" },
            { id: 13, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 13: Centro de avisos", text: "Deslice un dedo desde el borde derecho hacia adentro para abrir las notificaciones.", hint: "Inicie el movimiento desde afuera del borde derecho.", ok: "¡Avisos del sistema desplegados!" },
            { id: 14, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 14: Regular velocidad del ratón", text: "Ajuste en la configuración la velocidad de la flecha para moverla a un ritmo más cómodo.", hint: "Seleccione una velocidad pausada y adecuada para su mano.", ok: "¡Velocidad adaptada a su comodidad!" },

            // MÓDULO 2: VENTANAS (15-27)
            { id: 15, mod: "Módulo 2: Ventanas", title: "Ejercicio 15: Guardar ventana abajo", text: "Toque la rayita <strong>[–]</strong> arriba a la derecha para ocultar la ventana en la <strong>Barra de Tareas</strong> <span class='clarification'>(franja negra de abajo)</span>.", hint: "Es el primer botón a la izquierda de la cruz roja.", ok: "¡Ventana guardada en la barra inferior!" },
            { id: 16, mod: "Módulo 2: Ventanas", title: "Ejercicio 16: Estirar borde de pantalla", text: "Lleve la flecha al borde de la ventana hasta ver la doble flecha y arrastre para agrandarla.", hint: "Busque el límite exacto del borde lateral.", ok: "¡Tamaño de pantalla ajustado!" },
            { id: 17, mod: "Módulo 2: Ventanas", title: "Ejercicio 17: Acomodar a la izquierda", text: "Arrastre la ventana al borde izquierdo para fijarla exactamente en la mitad de la pantalla.", hint: "Empuje la ventana bien contra el extremo izquierdo.", ok: "¡Ventana fija en la mitad izquierda!" },
            { id: 18, mod: "Módulo 2: Ventanas", title: "Ejercicio 18: Trabajar con dos ventanas", text: "Elija un segundo programa para ocupar la mitad derecha que quedó libre.", hint: "Haga clic en el programa secundario para dividir la pantalla.", ok: "¡Dos programas abiertos lado a lado!" },
            { id: 19, mod: "Módulo 2: Ventanas", title: "Ejercicio 19: Cuatro ventanas juntas", text: "Lleve una ventana hacia una de las esquinas superiores para organizar cuatro trabajos a la vez.", hint: "Arrastre directo hacia la esquina superior derecha o izquierda.", ok: "¡Pantalla organizada en 4 partes!" },
            { id: 20, mod: "Módulo 2: Ventanas", title: "Ejercicio 20: Salto rápido de programa", text: "Presione la combinación de teclas Alt + Tab para cambiar de ventana al instante.", hint: "Mantenga Alt y toque una vez la tecla Tabulador.", ok: "¡Salto de programa completado!" },
            { id: 21, mod: "Módulo 2: Ventanas", title: "Ejercicio 21: Sacudir para despejar", text: "Tome la barra superior de la ventana activa y sacúdala suavemente para ocultar las demás.", hint: "Mantenga presionado el título arriba y mueva el ratón a los lados.", ok: "¡Fondo despejado sin distracciones!" },
            { id: 22, mod: "Módulo 2: Ventanas", title: "Ejercicio 22: Apilar como cartas", text: "Ordene las ventanas abiertas en modo <strong>Cascada</strong> para ver sus títulos escalonados.", hint: "Haga clic derecho en la barra negra de abajo y elija 'Cascada'.", ok: "¡Documentos apilados prolijamente!" },
            { id: 23, mod: "Módulo 2: Ventanas", title: "Ejercicio 23: Repartir en bloques", text: "Organice sus documentos en forma de mosaico para comparar datos fácilmente.", hint: "Seleccione 'Mostrar ventanas en paralelo'.", ok: "¡Mosaico de pantallas configurado!" },
            { id: 24, mod: "Módulo 2: Ventanas", title: "Ejercicio 24: Dejar atajo abajo", text: "Fije el icono del <strong>Correo</strong> en la <strong>Barra de Tareas</strong> <span class='clarification'>(franja negra)</span>.", hint: "Toque con el botón derecho sobre el icono y elija 'Anclar'.", ok: "¡Atajo listo para usar siempre abajo!" },
            { id: 25, mod: "Módulo 2: Ventanas", title: "Ejercicio 25: Cerrar programa con la cruz", text: "Toque la cruz roja <strong>[X]</strong> ubicada arriba a la derecha para cerrar el trabajo.", hint: "Está en la esquina superior derecha absoluta.", ok: "¡Programa cerrado correctamente!" },
            { id: 26, mod: "Módulo 2: Ventanas", title: "Ejercicio 26: Reordenar la barra inferior", text: "Mueva el icono de un programa hacia la izquierda dentro de la franja negra inferior.", hint: "Arrastre el gráfico horizontalmente sin soltar.", ok: "¡Icono reubicado a su gusto!" },
            { id: 27, mod: "Módulo 2: Ventanas", title: "Ejercicio 27: Rincón de limpieza", text: "Toque el último rincón derecho de la barra negra para ocultar todo de golpe.", hint: "Apunte al extremo inferior derecho junto a la hora.", ok: "¡Escritorio despejado completamente!" },

            // MÓDULO 3: ARCHIVOS Y CARPETAS (28-41)
            { id: 28, mod: "Módulo 3: Archivos", title: "Ejercicio 28: Abrir explorador de carpetas", text: "Haga doble clic en el icono <strong>Este equipo</strong> para ver sus documentos almacenados.", hint: "El icono está en la parte izquierda del escritorio.", ok: "¡Carpeta principal abierta con éxito!" },
            { id: 29, mod: "Módulo 3: Archivos", title: "Ejercicio 29: Crear una carpeta nueva", text: "Cree un cajón digital nuevo <span class='clarification'>(Carpeta)</span> para organizar sus fotos familiares.", hint: "Haga clic derecho en un lugar vacío y elija Nuevo -> Carpeta.", ok: "¡Carpeta nueva creada prolijamente!" },
            { id: 30, mod: "Módulo 3: Archivos", title: "Ejercicio 30: Cambiar nombre a carpeta", text: "Renombre la carpeta creada poniéndole como título <strong>Mis Recetas</strong>.", hint: "Haga clic derecho sobre la carpeta y seleccione 'Cambiar nombre'.", ok: "¡Nombre actualizado correctamente!" },
            { id: 31, mod: "Módulo 3: Archivos", title: "Ejercicio 31: Mover archivo a una carpeta", text: "Arrastre un documento guardado dentro de la carpeta <strong>Mis Recetas</strong>.", hint: "Presione sobre el archivo y llévelo encima de la carpeta.", ok: "¡Archivo guardado en su lugar!" },
            { id: 32, mod: "Módulo 3: Archivos", title: "Ejercicio 32: Duplicar una foto (Copiar)", text: "Haga una copia de una foto para guardarla en otra carpeta sin borrar la original.", hint: "Use la opción Copiar y luego Pegar en la carpeta nueva.", ok: "¡Foto duplicada con éxito!" },
            { id: 33, mod: "Módulo 3: Archivos", title: "Ejercicio 33: Seleccionar varios archivos", text: "Marque tres documentos a la vez trazando un recuadro con el ratón.", hint: "Haga clic en un espacio blanco y arrastre abarcando los tres archivos.", ok: "¡Tres archivos marcados juntos!" },
            { id: 34, mod: "Módulo 3: Archivos", title: "Ejercicio 34: Tirar archivo no deseado", text: "Envíe un borrador viejo a la <strong>Papelera de Reciclaje</strong> <span class='clarification'>(el tacho de basura)</span>.", hint: "Haga clic derecho sobre el archivo y elija 'Eliminar'.", ok: "¡Documento enviado a la papelera!" },
            { id: 35, mod: "Módulo 3: Archivos", title: "Ejercicio 35: Abrir la Papelera", text: "Abra la <strong>Papelera de Reciclaje</strong> para revisar los elementos tirados.", hint: "Busque el icono del tacho de basura en el escritorio.", ok: "¡Papelera abierta correctamente!" },
            { id: 36, mod: "Módulo 3: Archivos", title: "Ejercicio 36: Recuperar archivo borrado", text: "Restaure un documento borrado por error para devolverlo a su lugar de origen.", hint: "Haga clic derecho en el archivo dentro de la papelera y elija 'Restaurar'.", ok: "¡Archivo rescatado y devuelto a su lugar!" },
            { id: 37, mod: "Módulo 3: Archivos", title: "Ejercicio 37: Vaciar la papelera", text: "Limpie definitivamente el tacho de basura para recuperar espacio en el equipo.", hint: "Haga clic derecho sobre el tacho y elija 'Vaciar papelera'.", ok: "¡Papelera vaciada completamente!" },
            { id: 38, mod: "Módulo 3: Archivos", title: "Ejercicio 38: Buscar un documento perdido", text: "Escriba 'Carta' en la casilla de búsqueda para encontrar un escrito rápidamente.", hint: "Use la lupa del explorador arriba a la derecha.", ok: "¡Documento encontrado al instante!" },
            { id: 39, mod: "Módulo 3: Archivos", title: "Ejercicio 39: Ordenar archivos por fecha", text: "Ordene sus fotos para ver primero las que guardó recientemente.", hint: "Haga clic en el encabezado 'Fecha de modificación'.", ok: "¡Archivos ordenados cronológicamente!" },
            { id: 40, mod: "Módulo 3: Archivos", title: "Ejercicio 40: Cambiar a vista de fotos grandes", text: "Cambie la vista para ver sus fotos en miniaturas grandes y claras.", hint: "Vaya al menú 'Vista' y elija 'Iconos muy grandes'.", ok: "¡Miniaturas ampliadas para ver bien!" },
            { id: 41, mod: "Módulo 3: Archivos", title: "Ejercicio 41: Copiar archivos a pendrive", text: "Envíe una copia de sus documentos hacia la memoria externa <span class='clarification'>(Pendrive USB)</span>.", hint: "Haga clic derecho -> Enviar a -> Unidad USB.", ok: "¡Copia enviada al pendrive!" },

            // MÓDULO 4: WORDPAD / ESCRITURA (42-54)
            { id: 42, mod: "Módulo 4: WordPad", title: "Ejercicio 42: Abrir hoja de texto", text: "Abra el programa <strong>WordPad</strong> para comenzar una hoja de escritura limpia.", hint: "Toque el icono azul con la letra W en el escritorio.", ok: "¡Hoja blanca lista para escribir!" },
            { id: 43, mod: "Módulo 4: WordPad", title: "Ejercicio 43: Escribir en mayúsculas", text: "Escriba el título 'MEMORIAS DE VIDA' completamente en letras mayúsculas.", hint: "Active la tecla Bloq Mayús antes de escribir.", ok: "¡Título ingresado en mayúsculas!" },
            { id: 44, mod: "Módulo 4: WordPad", title: "Ejercicio 44: Cambiar modelo de letra", text: "Seleccione el texto y cambie el tipo de letra a <strong>Arial</strong> para leer con más claridad.", hint: "Use el menú desplegable de fuentes arriba a la izquierda.", ok: "¡Tipo de letra cambiado a Arial!" },
            { id: 45, mod: "Módulo 4: WordPad", title: "Ejercicio 45: Agrandar el tamaño del texto", text: "Aumente el tamaño de la letra a número 18 para verla más grande.", hint: "Seleccione el número de tamaño junto al modelo de letra.", ok: "¡Tamaño de letra agrandado a 18!" },
            { id: 46, mod: "Módulo 4: WordPad", title: "Ejercicio 46: Resaltar en Negrita", text: "Aplique el estilo <strong>Negrita [N]</strong> al título para darle mayor fuerza visual.", hint: "Presione la letra N ubicada en la barra de herramientas.", ok: "¡Texto destacado en negrita!" },
            { id: 47, mod: "Módulo 4: WordPad", title: "Ejercicio 47: Subrayar palabra importante", text: "Subraye la fecha principal de su escrito utilizando la opción <strong>[S]</strong>.", hint: "Seleccione la fecha y toque el botón con la S subrayada.", ok: "¡Palabra subrayada correctamente!" },
            { id: 48, mod: "Módulo 4: WordPad", title: "Ejercicio 48: Cambiar el color de la letra", text: "Pinte el texto con color azul oscuro.", hint: "Toque el botón con la letra A que tiene una barra de color debajo.", ok: "¡Color de texto aplicado!" },
            { id: 49, mod: "Módulo 4: WordPad", title: "Ejercicio 49: Centrar un título", text: "Alinee el título justo en el centro del ancho de la hoja.", hint: "Presione el botón de alineación central con rayitas en el medio.", ok: "¡Título centrado en la hoja!" },
            { id: 50, mod: "Módulo 4: WordPad", title: "Ejercicio 50: Guardar el escrito en el equipo", text: "Guarde su carta en la computadora poniéndole de nombre 'Carta Personal'.", hint: "Haga clic en el disco azul o en Archivo -> Guardar como.", ok: "¡Documento guardado a salvo!" },
            { id: 51, mod: "Módulo 4: WordPad", title: "Ejercicio 51: Abrir carta guardada", text: "Abra desde la memoria del equipo su archivo 'Carta Personal' para continuar escribiendo.", hint: "Menú Archivo -> Abrir -> Buscar Carta Personal.", ok: "¡Carta abierta para seguir trabajando!" },
            { id: 52, mod: "Módulo 4: WordPad", title: "Ejercicio 52: Insertar una imagen", text: "Agregue una fotografía ilustrativa debajo del texto de su escrito.", hint: "Toque el botón 'Insertar imagen' en la barra superior.", ok: "¡Foto insertada dentro del documento!" },
            { id: 53, mod: "Módulo 4: WordPad", title: "Ejercicio 53: Mandar a imprimir", text: "Configure la vista previa para imprimir su escrito en papel.", hint: "Menú Archivo -> Imprimir -> Vista previa.", ok: "¡Documento enviado a la impresora!" },
            { id: 54, mod: "Módulo 4: WordPad", title: "Ejercicio 54: Cerrar guardando cambios", text: "Cierre el programa de escritura asegurándose de guardar los últimos retoque.", hint: "Toque la cruz y elija 'Guardar' si el sistema le consulta.", ok: "¡Cambios guardados y programa cerrado!" },

            // MÓDULO 5: FACTURADOR / PLANILLAS (55-69)
            { id: 55, mod: "Módulo 5: Facturador", title: "Ejercicio 55: Abrir planilla de cuentas", text: "Abra el programa <strong>Facturador</strong> <span class='clarification'>(icono verde de gastos)</span>.", hint: "Haga doble clic en el icono verde con el signo $.", ok: "¡Planilla de cuentas abierta!" },
            { id: 56, mod: "Módulo 5: Facturador", title: "Ejercicio 56: Marcar un casillero", text: "Haga clic en el primer casillero de la tabla <span class='clarification'>(Celda)</span> para empezar.", hint: "Toque con el ratón el recuadro superior izquierdo.", ok: "¡Casillero marcado correctamente!" },
            { id: 57, mod: "Módulo 5: Facturador", title: "Ejercicio 57: Anotar un gasto", text: "Escriba la palabra 'Luz' en el casillero de concepto de gastos.", hint: "Escriba con el teclado directo en el casillero seleccionado.", ok: "¡Concepto ingresado correctamente!" },
            { id: 58, mod: "Módulo 5: Facturador", title: "Ejercicio 58: Anotar importe numérico", text: "Ingrese el valor numérico correspondiente al importe de la factura.", hint: "Use el teclado numérico a la derecha del teclado.", ok: "¡Importe registrado en la planilla!" },
            { id: 59, mod: "Módulo 5: Facturador", title: "Ejercicio 59: Suma automática", text: "Sume dos gastos anotados presionando el botón de <strong>Autosuma [Σ]</strong>.", hint: "Busque el icono que parece una letra E mayúscula elegante.", ok: "¡Cálculo de suma realizado al instante!" },
            { id: 60, mod: "Módulo 5: Facturador", title: "Ejercicio 60: Copiar fórmula de suma", text: "Estire la fórmula de la suma para que calcule el total de todo el mes.", hint: "Arrastre el cuadradito verde en la esquina de la celda.", ok: "¡Fórmula copiada a las demás filas!" },
            { id: 61, mod: "Módulo 5: Facturador", title: "Ejercicio 61: Formato signo pesos ($)", text: "Agregue el signo pesos ($) y los centavos a sus números anotados.", hint: "Seleccione los números y toque el icono con el billete o $.", ok: "¡Números formateados en moneda!" },
            { id: 62, mod: "Módulo 5: Facturador", title: "Ejercicio 62: Borrar valor equivocado", text: "Limpie el contenido de un casillero que contiene un error sin borrar el recuadro.", hint: "Toque la celda y presione la tecla Suprimir (Supr).", ok: "¡Casillero limpiado para corregir!" },
            { id: 63, mod: "Módulo 5: Facturador", title: "Ejercicio 63: Insertar renglón nuevo", text: "Agregue un renglón nuevo entre dos gastos para anotar un servicio olvidado.", hint: "Clic derecho en el número de fila -> Insertar.", ok: "¡Renglón nuevo agregado en la tabla!" },
            { id: 64, mod: "Módulo 5: Facturador", title: "Ejercicio 64: Anchar columna", text: "Agrande el ancho de la columna para que el texto largo entre sin cortarse.", hint: "Arrastre la línea que separa las letras de las columnas arriba.", ok: "¡Ancho de columna adaptado!" },
            { id: 65, mod: "Módulo 5: Facturador", title: "Ejercicio 65: Pintar celda de color", text: "Pinte de color amarillo el casillero del total final para distinguirlo bien.", hint: "Use el icono del balde de pintura en la barra de herramientas.", ok: "¡Casillero destacado con color!" },
            { id: 66, mod: "Módulo 5: Facturador", title: "Ejercicio 66: Poner bordes a la tabla", text: "Dibuje líneas negras alrededor de todos sus casilleros para armar una planilla prolija.", hint: "Seleccione la tabla y elija 'Todos los bordes'.", ok: "¡Líneas de tabla marcadas con claridad!" },
            { id: 67, mod: "Módulo 5: Facturador", title: "Ejercicio 67: Ordenar gastos de mayor a menor", text: "Reordene la lista para ver arriba de todo el gasto más caro del mes.", hint: "Menú Datos -> Ordenar de Z a A (Mayor a Menor).", ok: "¡Gastos ordenados según importe!" },
            { id: 68, mod: "Módulo 5: Facturador", title: "Ejercicio 68: Guardar la planilla de gastos", text: "Guarde la planilla en la computadora con el nombre 'Gastos Mensuales'.", hint: "Archivo -> Guardar como -> Gastos Mensuales.", ok: "¡Planilla guardada a salvo!" },
            { id: 69, mod: "Módulo 5: Facturador", title: "Ejercicio 69: Imprimir resumen de gastos", text: "Prepare e imprima su resumen de cuentas para tenerlo guardado en papel.", hint: "Seleccione área de impresión y toque Imprimir.", ok: "¡Resumen enviado a la impresora!" },

            // MÓDULO 6: CORREO ELECTRÓNICO (70-81)
            { id: 70, mod: "Módulo 6: Correo", title: "Ejercicio 70: Abrir el correo electrónico", text: "Toque el icono naranja <strong>Correo</strong> <span class='clarification'>(el sobrecito)</span> para ver sus mensajes.", hint: "Haga clic en el acceso directo del correo en la izquierda.", ok: "¡Bandeja de entrada abierta!" },
            { id: 71, mod: "Módulo 6: Correo", title: "Ejercicio 71: Leer mensaje nuevo", text: "Haga clic sobre un correo sin abrir para leer su contenido completo en pantalla.", hint: "Toque el mensaje en la lista de la izquierda.", ok: "¡Mensaje abierto y listo para leer!" },
            { id: 72, mod: "Módulo 6: Correo", title: "Ejercicio 72: Redactar mensaje nuevo", text: "Toque el botón <strong>Correo nuevo [+]</strong> para escribir una carta a un familiar.", hint: "Es el botón azul en la parte superior izquierda.", ok: "¡Hoja de correo nuevo desplegada!" },
            { id: 73, mod: "Módulo 6: Correo", title: "Ejercicio 73: Escribir destinatario", text: "Ingrese la casilla de destino en el campo <strong>Para:</strong>.", hint: "Escriba la dirección de correo asegurándose de incluir el @.", ok: "¡Dirección de destino anotada!" },
            { id: 74, mod: "Módulo 6: Correo", title: "Ejercicio 74: Anotar el Asunto", text: "Escriba 'Saludos y Fotos' en la casilla <strong>Asunto</strong> para que sepan de qué trata.", hint: "El asunto es el título breve del correo.", ok: "¡Asunto anotado correctamente!" },
            { id: 75, mod: "Módulo 6: Correo", title: "Ejercicio 75: Adjuntar una foto", text: "Toque el ganchito clip <strong>[Adjuntar]</strong> para agregar una foto al mensaje.", hint: "Busque el icono del ganchito de abrochar papeles.", ok: "¡Fotografía enganchada al correo!" },

            { id: 77, mod: "Módulo 6: Correo", title: "Ejercicio 77: Responder un mensaje", text: "Toque la flecha de <strong>Responder</strong> para contestar un correo recibido.", hint: "La flechita apuntando a la izquierda sirve para responder.", ok: "¡Respuesta iniciada correctamente!" },
            { id: 78, mod: "Módulo 6: Correo", title: "Ejercicio 78: Reenviar a otra persona", text: "Pase un correo interesante que recibió a otra persona utilizando <strong>Reenviar</strong>.", hint: "Toque la flechita que apunta hacia la derecha.", ok: "¡Correo listo para compartir!" },
            { id: 79, mod: "Módulo 6: Correo", title: "Ejercicio 79: Borrar mensaje no deseado", text: "Elimine una publicidad no deseada enviándola al tacho de basura del correo.", hint: "Toque el icono del tachito de basura junto al correo.", ok: "¡Correo molesto eliminado!" },
            { id: 80, mod: "Módulo 6: Correo", title: "Ejercicio 80: Buscar un correo viejo", text: "Busque un correo antiguo escribiendo el nombre del remitente en la lupa.", hint: "Escriba el nombre en la barra de búsqueda arriba.", ok: "¡Correo antiguo ubicado en la lista!" },
            { id: 81, mod: "Módulo 6: Correo", title: "Ejercicio 81: Organizar en carpetas", text: "Cree una carpeta llamada <strong>Familia</strong> para archivar allí sus mensajes guardados.", hint: "Opciones de carpetas -> Crear carpeta nueva.", ok: "¡Mensaje archivado en su carpeta!" },

            // MÓDULO 7: CONFIGURACIÓN Y SISTEMA (82-97)
            { id: 82, mod: "Módulo 7: Sistema", title: "Ejercicio 82: Abrir el Menú Inicio", text: "Toque la ventanita blanca ubicada en la esquina inferior izquierda <span class='clarification'>(Botón de Inicio)</span>.", hint: "Está en el primer rincón de la franja negra abajo.", ok: "¡Menú Inicio abierto con todas sus opciones!" },
            { id: 83, mod: "Módulo 7: Sistema", title: "Ejercicio 83: Subir o bajar el sonido", text: "Ajuste el nivel del volumen tocando el altavoz junto a la hora abajo a la derecha.", hint: "Haga clic en el parlante y mueva la barra deslizante.", ok: "¡Volumen ajustado correctamente!" },
            { id: 84, mod: "Módulo 7: Sistema", title: "Ejercicio 84: Conectarse a Wi-Fi", text: "Abra las conexiones de internet inalámbrico <span class='clarification'>(Wi-Fi)</span> para revisar la señal.", hint: "Toque el icono con forma de ondas de radio abajo a la derecha.", ok: "¡Red Wi-Fi revisada y conectada!" },
            { id: 85, mod: "Módulo 7: Sistema", title: "Ejercicio 85: Regular brillo de pantalla", text: "Suba o baje la claridad de la pantalla para descansar la vista.", hint: "Ajuste la barra de brillo dentro del panel de avisos.", ok: "¡Brillo de pantalla ajustado a su gusto!" },
            { id: 86, mod: "Módulo 7: Sistema", title: "Ejercicio 86: Cambiar fondo de pantalla", text: "Elija una imagen nueva para decorar la pantalla principal del equipo.", hint: "Clic derecho en el escritorio -> Personalizar -> Fondo.", ok: "¡Fondo de pantalla renovado!" },
            { id: 87, mod: "Módulo 7: Sistema", title: "Ejercicio 87: Consultar el calendario", text: "Toque la fecha y hora en el rincón inferior derecho para ver el almanaque completo.", hint: "Haga clic directo donde muestra la hora.", ok: "¡Almanaque desplegado en pantalla!" },
            { id: 88, mod: "Módulo 7: Sistema", title: "Ejercicio 88: Ver carga de batería", text: "Revise cuánta carga le queda a la batería de la computadora portátil.", hint: "Pase el puntero sobre la pilita en la franja negra abajo.", ok: "¡Carga de batería verificada!" },
            { id: 89, mod: "Módulo 7: Sistema", title: "Ejercicio 89: Revisar espacio disponible", text: "Compruebe cuánto espacio libre le queda al disco para seguir guardando fotos.", hint: "Abra 'Este equipo' para consultar la barra de espacio.", ok: "¡Espacio de almacenamiento verificado!" },
            { id: 90, mod: "Módulo 7: Sistema", title: "Ejercicio 90: Cambiar idioma de teclado", text: "Asegúrese de que el idioma del teclado esté configurado en <strong>ESP (Español)</strong>.", hint: "Verifique las tres letras ESP junto a la hora.", ok: "¡Teclado configurado en Español!" },
            { id: 91, mod: "Módulo 7: Sistema", title: "Ejercicio 91: Activar Luz Nocturna", text: "Encienda la luz cálida para leer en entornos oscuros sin cansar los ojos.", hint: "Toque el botón 'Luz nocturna' en los avisos.", ok: "¡Luz nocturna suave activada!" },
            { id: 92, mod: "Módulo 7: Sistema", title: "Ejercicio 92: Buscar actualizaciones", text: "Revise si el sistema tiene mejoras de seguridad pendientes <span class='clarification'>(Windows Update)</span>.", hint: "Configuración -> Actualización y seguridad.", ok: "¡Sistema actualizado y protegido!" },
            { id: 93, mod: "Módulo 7: Sistema", title: "Ejercicio 93: Conectar auriculares Bluetooth", text: "Abra la lista de dispositivos inalámbricos para conectar sus auriculares sin cables.", hint: "Configuración -> Dispositivos -> Bluetooth.", ok: "¡Auriculares vinculados por Bluetooth!" },
            { id: 94, mod: "Módulo 7: Sistema", title: "Ejercicio 94: Revisar la seguridad del equipo", text: "Compruebe que el escudo de protección <span class='clarification'>(Antivirus)</span> esté activo y verde.", hint: "Busque el escudito blanco en el rincón inferior derecho.", ok: "¡Seguridad del equipo bajo control!" },
            { id: 95, mod: "Módulo 7: Sistema", title: "Ejercicio 95: Agrandar las letras del sistema", text: "Aumente el porcentaje de tamaño de las letras generales de la computadora.", hint: "Configuración -> Accesibilidad -> Tamaño de texto.", ok: "¡Letras generales del equipo agrandadas!" },
            { id: 96, mod: "Módulo 7: Sistema", title: "Ejercicio 96: Bloquear pantalla por seguridad", text: "Bloquee la sesión al levantarse de la mesa presionando la tecla Windows + L.", hint: "Mantenga la tecla con la ventanita y toque la L.", ok: "¡Pantalla bloqueada a salvo de miradas!" },
            { id: 97, mod: "Módulo 7: Sistema", title: "Ejercicio 97: Apagar la computadora", text: "Seleccione la opción correcta para apagar la máquina prolijamente sin desenchufar.", hint: "Inicio -> Apagar/Encender -> Apagar.", ok: "¡Procedimiento de apagado iniciado correctamente!" },

            // MÓDULO 8: INTEGRACIÓN Y REPASO FINAL (98-100)
            { id: 98, mod: "Módulo 8: Integración", title: "Ejercicio 98: Repaso 1 - Carta completa", text: "Abra WordPad, escriba una nota, agrande el texto, póngalo en azul y guárdelo en su carpeta.", hint: "Combine los pasos de los Módulos 3 y 4 aprendidos.", ok: "¡Repaso 1 completado con destreza!" },
            { id: 99, mod: "Módulo 8: Integración", title: "Ejercicio 99: Repaso 2 - Enviar trabajo", text: "Abra el Correo, adjunte el escrito recién guardado y envíelo a un familiar.", hint: "Combine la función de adjuntar con la bandeja de salida del Módulo 6.", ok: "¡Repaso 2 logrado con éxito total!" },
            { id: 100, mod: "Módulo 8: Integración", title: "Ejercicio 100: Graduación Digital", text: "Organice sus dos ventanas abiertas lado a lado, limpie el escritorio y prepare el apagado.", hint: "¡Demuestre todo el dominio adquirido en este curso de 100 pasos!", ok: "¡FELICITACIONES! Ha completado los 100 ejercicios de Capacitación Digital." }
        ];

        let currentExId = 1;

        function initDropdown() {
            const select = document.getElementById('exercise-select');
            select.innerHTML = '';
            exercises.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex.id;
                opt.innerText = `Ej. ${ex.id}: ${ex.title.replace(`Ejercicio ${ex.id}: `, '')} (${ex.mod.split(':')[0]})`;
                select.appendChild(opt);
            });
            loadExercise(1);
        }

        function loadExercise(id) {
            currentExId = parseInt(id);
            const ex = exercises.find(e => e.id === currentExId);

            document.getElementById('exercise-select').value = currentExId;
            document.getElementById('card-counter').innerText = `Ej. ${ex.id} de 100`;
            document.getElementById('ex-title').innerText = ex.title;
            document.getElementById('ex-instruction').innerHTML = ex.text;

            document.getElementById('hint-box').style.display = 'none';
            document.getElementById('hint-box').innerText = ex.hint;
            document.getElementById('success-box').style.display = 'none';
        }

        function toggleHint() {
            const box = document.getElementById('hint-box');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function resetCurrent() {
            loadExercise(currentExId);
        }

        function verifyCurrent() {
            const ex = exercises.find(e => e.id === currentExId);
            const successBox = document.getElementById('success-box');
            successBox.innerText = `✔ ${ex.ok}`;
            successBox.style.display = 'block';
        }

        function triggerIcon(name) {
            alert(`Ha hecho clic en el acceso directo de: ${name}`);
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString();
            document.getElementById('clock-display').innerHTML = `<div>${timeStr}</div><div style="font-size:11px;">${dateStr}</div>`;
        }

        setInterval(updateClock, 1000);
        updateClock();
        initDropdown();
    </script>
</body>
</html>
