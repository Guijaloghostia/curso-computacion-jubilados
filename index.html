<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitación Digital - 100 Ejercicios para Jubilados</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Panel Izquierdo */
    .sidebar {
      width: 400px;
      background-color: #0b132b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
      z-index: 20;
    }

    .sidebar-header h2 {
      font-size: 1.25rem;
      color: #00b4d8;
      margin-bottom: 10px;
      text-align: center;
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-label {
      font-size: 0.78rem;
      color: #8d99ae;
      margin-bottom: 3px;
      display: block;
      font-weight: 600;
    }

    .module-select, .exercise-dropdown-select {
      width: 100%;
      padding: 8px;
      background: #1c2541;
      color: #fff;
      border: 1px solid #3a506b;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .badge-module {
      display: inline-block;
      background-color: #0077b6;
      color: #fff;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .exercise-title {
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .instruction-card {
      background-color: #1c2541;
      border-left: 4px solid #00b4d8;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 0.78rem;
    }

    .instruction-text {
      font-size: 0.85rem;
      line-height: 1.35;
      margin-bottom: 8px;
      color: #e0e1dd;
      max-height: 110px;
      overflow-y: auto;
    }

    .hint-btn {
      width: 100%;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid #ffb703;
      color: #ffb703;
      padding: 7px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 0.8rem;
      margin-bottom: 5px;
    }

    .hint-box {
      display: none;
      background: rgba(255, 183, 3, 0.1);
      border: 1px dashed #ffb703;
      padding: 7px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #ffb703;
      margin-bottom: 8px;
      max-height: 95px;
      overflow-y: auto;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-nav {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background-color: #00b4d8;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .btn-nav:disabled {
      background-color: #3a506b;
      color: #8d99ae;
      cursor: not-allowed;
    }

    /* Panel Derecho: Escritorio */
    .desktop-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    }

    .desktop-workspace {
      flex: 1;
      position: relative;
      padding: 15px;
    }

    .desktop-icons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #ffffff;
      font-size: 0.75rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .desktop-icon:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .desktop-icon.selected {
      background-color: rgba(0, 180, 216, 0.3);
      border: 1px solid #00b4d8;
    }

    .desktop-icon svg, .desktop-icon img {
      width: 38px;
      height: 38px;
      margin-bottom: 4px;
    }

    /* Ventanas */
    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 540px;
      height: 380px;
      background-color: #f8f9fa;
      color: #333333;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: none;
      z-index: 10;
      flex-direction: column;
    }

    .window-header {
      background-color: #e9ecef;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ced4da;
    }

    .window-title {
      font-size: 0.85rem;
      color: #212529;
      font-weight: 600;
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .btn-close:hover {
      background-color: #dc3545;
      color: #ffffff;
    }

    .window-body {
      padding: 15px;
      font-size: 0.85rem;
      flex: 1;
      overflow-y: auto;
      background-color: #ffffff;
      color: #212529;
    }

    .app-form-group {
      margin-bottom: 10px;
    }
    .app-form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .app-form-control {
      width: 100%;
      padding: 6px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .app-btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .app-btn:hover {
      background: #0096c7;
    }

    /* Menú Inicio */
    .start-menu {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 260px;
      background-color: rgba(15, 23, 42, 0.96);
      border-top-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: none;
      z-index: 15;
    }

    .start-item {
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .start-item:hover {
      background-color: #00b4d8;
      color: #000;
    }

    /* Barra de tareas */
    .taskbar {
      height: 45px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .start-btn {
      background: transparent;
      border: none;
      color: #00b4d8;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .start-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .taskbar-clock {
      font-size: 0.75rem;
      text-align: right;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <h2>Computación Fácil (Jubilados)</h2>
        </div>

        <div class="control-group">
          <label class="control-label">Módulo de Aprendizaje:</label>
          <select id="module-select" class="module-select" onchange="changeModuleFilter(this.value)">
            <option value="all">Ver todos los 100 ejercicios</option>
            <option value="1">Módulo 1: Manejo del Mouse (01-14)</option>
            <option value="2">Módulo 2: Escritorio y Ventanas (15-27)</option>
            <option value="3">Módulo 3: Explorador de Archivos (28-41)</option>
            <option value="4">Módulo 4: Redacción en WordPad (42-54)</option>
            <option value="5">Módulo 5: Facturador Digital (55-69)</option>
            <option value="6">Módulo 6: Correo Electrónico (70-81)</option>
            <option value="7">Módulo 7: Primeros Auxilios de la PC (82-97)</option>
            <option value="8">Módulo 8: Examen Integrador Final (98-100)</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Seleccionar Ejercicio:</label>
          <select id="exercise-dropdown-select" class="exercise-dropdown-select" onchange="selectExercise(this.value)"></select>
        </div>

        <span id="badge-module" class="badge-module">Módulo 1</span>
        <h3 id="exercise-title" class="exercise-title">Ejercicio 1</h3>
        
        <div class="instruction-card">
          📌 <span id="location-text">Pantalla Principal</span>
        </div>
        
        <p id="instruction-text" class="instruction-text">Cargando...</p>
        
        <button class="hint-btn" onclick="toggleHint()">💡 Ayuda paso a paso</button>
        <div id="hint-box" class="hint-box"></div>
      </div>

      <div class="nav-buttons">
        <button id="btn-prev" class="btn-nav" onclick="navigate(-1)">Anterior</button>
        <button id="btn-next" class="btn-nav" onclick="navigate(1)">Siguiente</button>
      </div>
    </aside>

    <main class="desktop-container" onclick="handleDesktopClick(event)">
      <div class="desktop-workspace">
        
        <div class="desktop-icons">
          <div class="desktop-icon" id="icon-este-equipo" onclick="handleIconClick(event, 'este-equipo')" ondblclick="handleIconDblClick('este-equipo')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#0078d7" d="M40 8H8a4 4 0 00-4 4v20a4 4 0 004 4h14l-2 4h-4v2h16v-2h-4l-2-4h14a4 4 0 004-4V12a4 4 0 00-4-4zm0 22H8V12h32z"/></svg>
            <span>Este Equipo</span>
          </div>

          <div class="desktop-icon" id="icon-wordpad" onclick="handleIconClick(event, 'wordpad')" ondblclick="handleIconDblClick('wordpad')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#2b579a" d="M6 6h28l8 8v28H6z"/><path fill="#fff" d="M14 18h20v2H14zm0 6h20v2H14zm0 6h14v2H14z"/><path fill="#19325c" d="M34 6v8h8z"/></svg>
            <span>WordPad</span>
          </div>

          <div class="desktop-icon" id="icon-facturador" onclick="handleIconClick(event, 'facturador')" ondblclick="handleIconDblClick('facturador')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#107c41" d="M8 4h24l8 8v32H8z"/><path fill="#fff" d="M14 16h20v2H14zm0 6h20v2H14zm0 6h12v2H14z"/><path fill="#0b532c" d="M32 4v10h10z"/></svg>
            <span>Facturador</span>
          </div>

          <div class="desktop-icon" id="icon-correo" onclick="handleIconClick(event, 'correo')" ondblclick="handleIconDblClick('correo')">
            <img src="https://img.icons8.com/color/48/gmail-new.png" alt="Correo">
            <span>Correo</span>
          </div>

          <div class="desktop-icon" id="icon-papelera" onclick="handleIconClick(event, 'papelera')" ondblclick="handleIconDblClick('papelera')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#6c757d" d="M12 12h24v30H12z"/><path fill="#495057" d="M10 8h28v4H10z"/><path fill="#adb5bd" d="M20 4h8v4h-8z"/></svg>
            <span>Papelera</span>
          </div>
        </div>

        <div class="window" id="app-window">
          <div class="window-header">
            <span class="window-title" id="window-title">Ventana</span>
            <button class="btn-close" onclick="closeAppWindow()" title="Cerrar">[X]</button>
          </div>
          <div class="window-body" id="window-body">
            Contenido...
          </div>
        </div>

        <div class="start-menu" id="start-menu">
          <div class="start-item" onclick="handleStartItem('wordpad')">📝 Escribir en WordPad</div>
          <div class="start-item" onclick="handleStartItem('facturador')">🧮 Abrir Facturador</div>
          <div class="start-item" onclick="handleStartItem('correo')">✉️ Revisar Correo</div>
          <div class="start-item" onclick="handleStartItem('este-equipo')">💻 Ver Mis Archivos</div>
          <div class="start-item" onclick="handleStartItem('papelera')">🗑️ Papelera de Reciclaje</div>
        </div>

      </div>

      <footer class="taskbar">
        <div class="taskbar-left">
          <button class="start-btn" id="start-btn" onclick="toggleStartMenu(event)" title="Menú Inicio">
            <svg viewBox="0 0 88 88" width="20" height="20">
              <path fill="#00b4d8" d="M0 12.402l35.687-4.86.016 34.423-35.703.203zm35.687 34.93l.031 34.531-35.718-4.937-.016-29.75zm5.797-40.407L87.89 0l-.016 41.563-42.39.313zm42.422 41.141l.016 42.188-42.438-6.094-.031-36.438z"/>
            </svg>
          </button>
        </div>
        <div class="taskbar-clock">
          <div id="clock-time">12:06</div>
          <div id="clock-date">11/10/2026</div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    // GENERADOR AUTOMÁTICO DE LOS 100 EJERCICIOS CON AUTOEVALUACIONES Y PRÁCTICAS DIVERSAS
    const exercises = [];

    // MÓDULO 1: Manejo del Mouse y Selección (01 al 14)
    for(let i=1; i<=13; i++) {
      let targets = ['click-wordpad', 'click-facturador', 'click-este-equipo', 'click-correo', 'click-start', 'click-desktop'];
      let target = targets[(i-1) % targets.length];
      let titles = [
        "Seleccionar WordPad", "Seleccionar el Facturador", "Seleccionar Este Equipo", 
        "Seleccionar Correo", "Abrir el Menú Inicio", "Limpiar selección en el fondo",
        "Marcar ícono de WordPad", "Marcar Facturador", "Marcar Este Equipo",
        "Marcar Correo", "Verificar Botón Inicio", "Relajar pantalla en escritorio", "Practicar clic simple"
      ];
      exercises.push({
        id: i, module: "1", modName: "Módulo 1: Manejo del Mouse",
        title: `Ej ${i < 10 ? '0'+i : i}: ${titles[i-1]}`,
        context: "📌 Pantalla Principal",
        instruction: `Práctica ${i} de pulso y selección: Realice un clic simple sobre el elemento indicado en pantalla para seleccionarlo con seguridad.`,
        hint: `Paso 1: Localice visualmente el elemento.\nPaso 2: Haga un clic con el botón izquierdo del ratón.`,
        targetAction: target
      });
    }
    exercises.push({
      id: 14, module: "1", modName: "Módulo 1: Manejo del Mouse",
      title: "Ej 14: AUTOEVALUACIÓN M1 - Abrir WordPad",
      context: "📌 Pantalla Principal",
      instruction: "Autoevaluación del Módulo 1: Abra el programa WordPad haciendo doble clic rápido sobre su ícono.",
      hint: "Paso 1: Coloque el cursor sobre WordPad.\nPaso 2: Haga dos clics seguidos rápidamente para abrir la aplicación.",
      targetAction: "dblclick-wordpad"
    });

    // MÓDULO 2: Escritorio y Ventanas (15 al 27)
    for(let i=15; i<=26; i++) {
      let targets = ['close-window', 'dblclick-facturador', 'dblclick-correo', 'click-start', 'start-facturador'];
      let target = targets[(i-15) % targets.length];
      exercises.push({
        id: i, module: "2", modName: "Módulo 2: Escritorio y Ventanas",
        title: `Ej ${i}: Gestión y control de ventanas ${i}`,
        context: "📌 Entorno de Ventanas",
        instruction: `Práctica ${i} de ventanas: Aprenda a manipular y cerrar correctamente las aplicaciones abiertas en la pantalla.`,
        hint: `Paso 1: Observe el estado de la ventana.\nPaso 2: Ejecute la acción requerida (cerrar con [X] o abrir con doble clic).`,
        targetAction: target
      });
    }
    exercises.push({
      id: 27, module: "2", modName: "Módulo 2: Escritorio y Ventanas",
      title: "Ej 27: AUTOEVALUACIÓN M2 - Cierre limpio",
      context: "📌 Ventana Activa",
      instruction: "Autoevaluación del Módulo 2: Cierre la ventana actual pulsando el botón con la cruz [X] superior.",
      hint: "Paso 1: Busque la cruz [X] arriba a la derecha.\nPaso 2: Haga clic para cerrar la ventana.",
      targetAction: "close-window"
    });

    // MÓDULO 3: Explorador de Archivos (28 al 41)
    for(let i=28; i<=40; i++) {
      let targets = ['dblclick-este-equipo', 'close-window', 'start-este-equipo', 'click-este-equipo'];
      let target = targets[(i-28) % targets.length];
      exercises.push({
        id: i, module: "3", modName: "Módulo 3: Explorador de Archivos",
        title: `Ej ${i}: Exploración de directorios ${i}`,
        context: "📌 Mis Archivos",
        instruction: `Práctica ${i} de archivos: Navegue por el sistema de almacenamiento para ubicar carpetas y unidades de la PC.`,
        hint: `Paso 1: Acceda a 'Este Equipo'.\nPaso 2: Explore las opciones disponibles.`,
        targetAction: target
      });
    }
    exercises.push({
      id: 41, module: "3", modName: "Módulo 3: Explorador de Archivos",
      title: "Ej 41: AUTOEVALUACIÓN M3 - Abrir Papelera",
      context: "📌 Pantalla Principal",
      instruction: "Autoevaluación del Módulo 3: Abra la Papelera de Reciclaje haciendo doble clic en su ícono.",
      hint: "Paso 1: Vaya al ícono de la Papelera.\nPaso 2: Haga doble clic para verificar su contenido.",
      targetAction: "dblclick-papelera"
    });

    // MÓDULO 4: Redacción en WordPad (42 al 54)
    for(let i=42; i<=53; i++) {
      let targets = ['start-wordpad', 'close-window', 'dblclick-wordpad', 'click-wordpad'];
      let target = targets[(i-42) % targets.length];
      exercises.push({
        id: i, module: "4", modName: "Módulo 4: Redacción en WordPad",
        title: `Ej ${i}: Práctica de notas y textos ${i}`,
        context: "📌 WordPad",
        instruction: `Práctica ${i} de redacción: Utilice el editor de texto para crear cartas y notas personales de forma sencilla.`,
        hint: `Paso 1: Abra WordPad.\nPaso 2: Escriba su texto y gestione el archivo.`,
        targetAction: target
      });
    }
    exercises.push({
      id: 54, module: "4", modName: "Módulo 4: Redacción en WordPad",
      title: "Ej 54: AUTOEVALUACIÓN M4 - Cierre de WordPad",
      context: "📌 Ventana de WordPad",
      instruction: "Autoevaluación del Módulo 4: Cierre la aplicación WordPad pulsando el botón [X].",
      hint: "Paso 1: Haga clic en la cruz [X] superior de la ventana.",
      targetAction: "close-window"
    });

    // MÓDULO 5: Facturador Digital (55 al 69)
    for(let i=55; i<=68; i++) {
      let targets = ['dblclick-facturador', 'emitir-factura', 'close-window', 'click-facturador'];
      let target = targets[(i-55) % targets.length];
      exercises.push({
        id: i, module: "5", modName: "Módulo 5: Facturador Digital",
        title: `Ej ${i}: Gestión de trámites y comprobantes ${i}`,
        context: "📌 Facturador",
        instruction: `Práctica ${i} de facturación: Cargue datos fiscales y emita comprobantes que se guardan automáticamente en la PC[span_14](start_span)[span_14](end_span).`,
        hint: `Paso 1: Abra el Facturador.\nPaso 2: Complete los campos y emita el comprobante[span_15](start_span)[span_15](end_span).`,
        targetAction: target
      });
    }
    exercises.push({
      id: 69, module: "5", modName: "Módulo 5: Facturador Digital",
      title: "Ej 69: AUTOEVALUACIÓN M5 - Cierre de caja",
      context: "📌 Ventana del Facturador",
      instruction: "Autoevaluación del Módulo 5: Cierre la ventana del Facturador con la cruz [X].",
      hint: "Paso 1: Haga clic en el botón [X].",
      targetAction: "close-window"
    });

    // MÓDULO 6: Correo Electrónico (70 al 81)
    for(let i=70; i<=80; i++) {
      let targets = ['dblclick-correo', 'enviar-correo', 'close-window', 'click-correo'];
      let target = targets[(i-70) % targets.length];
      exercises.push({
        id: i, module: "6", modName: "Módulo 6: Correo Electrónico",
        title: `Ej ${i}: Comunicación y mensajes ${i}`,
        context: "📌 Correo",
        instruction: `Práctica ${i} de correo: Redacte mensajes claros, escriba destinatarios y adjunte archivos guardados[span_16](start_span)[span_16](end_span).`,
        hint: `Paso 1: Abra el Correo.\nPaso 2: Envíe su mensaje de prueba[span_17](start_span)[span_17](end_span).`,
        targetAction: target
      });
    }
    exercises.push({
      id: 81, module: "6", modName: "Módulo 6: Correo Electrónico",
      title: "Ej 81: AUTOEVALUACIÓN M6 - Salir del Correo",
      context: "📌 Ventana de Correo",
      instruction: "Autoevaluación del Módulo 6: Cierre la ventana de Correo con [X].",
      hint: "Paso 1: Haga clic en la cruz [X].",
      targetAction: "close-window"
    });

    // MÓDULO 7: Primeros Auxilios de la PC (82 al 97)
    for(let i=82; i<=96; i++) {
      let targets = ['click-desktop', 'click-este-equipo', 'click-start', 'dblclick-facturador'];
      let target = targets[(i-82) % targets.length];
      exercises.push({
        id: i, module: "7", modName: "Módulo 7: Primeros Auxilios",
        title: `Ej ${i}: Verificación y mantenimiento ${i}`,
        context: "📌 Sistema",
        instruction: `Práctica ${i} de mantenimiento: Compruebe el estado del reloj, la barra de tareas y la estabilidad del equipo.`,
        hint: `Paso 1: Revise la interfaz de la PC.\nPaso 2: Ejecute la validación solicitada.`,
        targetAction: target
      });
    }
    exercises.push({
      id: 97, module: "7", modName: "Módulo 7: Primeros Auxilios",
      title: "Ej 97: AUTOEVALUACIÓN M7 - Estabilidad final",
      context: "📌 Pantalla Principal",
      instruction: "Autoevaluación del Módulo 7: Haga clic en el fondo libre para asegurar el sistema.",
      hint: "Paso 1: Haga clic en un espacio vacío de la pantalla.",
      targetAction: "click-desktop"
    });

    // MÓDULO 8: Examen Integrador Final (98 al 100)
    exercises.push({
      id: 98, module: "8", modName: "Módulo 8: Examen Integrador Final",
      title: "Ej 98: EXAMEN FINAL - Emitir factura y enviarla por mail",
      context: "📌 Pantalla Principal",
      instruction: "Examen Integrador de Autonomía: 1) Abra el Facturador y emita la factura (se guarda sola en Descargas)[span_18](start_span)[span_18](end_span). 2) Búsquela en 'Este Equipo' > Descargas. 3) Adjúntela y envíela por Correo[span_19](start_span)[span_19](end_span).",
      hint: "Paso 1: Haga doble clic en el ícono del Facturador para iniciar la prueba final de punta a punta.",
      targetAction: "dblclick-facturador"
    });
    exercises.push({
      id: 99, module: "8", modName: "Módulo 8: Examen Integrador Final",
      title: "Ej 99: EXAMEN FINAL - Auditoría de archivos",
      context: "📌 Ventana Activa",
      instruction: "Examen Integrador: Cierre la ventana del Facturador para aprobar el control operativo de archivos.",
      hint: "Paso 1: Haga clic en la cruz [X] de la ventana.",
      targetAction: "close-window"
    });
    exercises.push({
      id: 100, module: "8", modName: "Módulo 8: Examen Integrador Final",
      title: "Ej 100: EXAMEN FINAL - Certificación y Cierre",
      context: "📌 Pantalla Principal",
      instruction: "Examen Integrador: Cierre la última ventana abierta tocando [X] para completar con éxito los 100 ejercicios y obtener su certificación.",
      hint: "Paso 1: Cierre cualquier ventana activa tocando [X] para finalizar el curso integral.",
      targetAction: "close-window"
    });

    let currentIdx = 0;
    let facturaGuardada = false;

    const moduleSelectElem = document.getElementById('module-select');
    const exerciseDropdownElem = document.getElementById('exercise-dropdown-select');
    const badgeElem = document.getElementById('badge-module');
    const titleElem = document.getElementById('exercise-title');
    const contextElem = document.getElementById('location-text');
    const instructionElem = document.getElementById('instruction-text');
    const hintBox = document.getElementById('hint-box');
    const appWindow = document.getElementById('app-window');
    const windowTitle = document.getElementById('window-title');
    const windowBody = document.getElementById('window-body');
    const startMenu = document.getElementById('start-menu');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    function init() {
      populateExerciseDropdown();
      loadExercise(0);
    }

    function populateExerciseDropdown() {
      const selectedModule = moduleSelectElem.value;
      exerciseDropdownElem.innerHTML = '';

      exercises.forEach((ex, idx) => {
        if (selectedModule === 'all' || ex.module === selectedModule) {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = ex.title;
          exerciseDropdownElem.appendChild(opt);
        }
      });
    }

    function changeModuleFilter(modVal) {
      populateExerciseDropdown();
      const firstOpt = exerciseDropdownElem.options[0];
      if (firstOpt) {
        loadExercise(parseInt(firstOpt.value, 10));
      }
    }

    function loadExercise(idx) {
      currentIdx = idx;
      const ex = exercises[currentIdx];

      exerciseDropdownElem.value = currentIdx;

      badgeElem.textContent = ex.modName;
      titleElem.textContent = ex.title;
      contextElem.textContent = ex.context;
      instructionElem.innerHTML = ex.instruction;
      hintBox.innerHTML = ex.hint;
      hintBox.style.display = 'none';

      clearSelections();
      startMenu.style.display = 'none';
      appWindow.style.display = 'none';

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === exercises.length - 1;
    }

    function selectExercise(val) {
      loadExercise(parseInt(val, 10));
    }

    function navigate(dir) {
      const next = currentIdx + dir;
      if (next >= 0 && next < exercises.length) {
        const targetEx = exercises[next];
        if (moduleSelectElem.value !== 'all' && targetEx.module !== moduleSelectElem.value) {
          moduleSelectElem.value = targetEx.module;
          populateExerciseDropdown();
        }
        loadExercise(next);
      }
    }

    function toggleHint() {
      hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    function clearSelections() {
      document.querySelectorAll('.desktop-icon').forEach(icon => icon.classList.remove('selected'));
    }

    function validateAction(actionName) {
      const currentEx = exercises[currentIdx];
      if (currentEx.targetAction === actionName) {
        if (currentIdx === 97) { // Ejercicio 98: Examen Final
          if (actionName === 'dblclick-facturador') {
            openFacturadorApp();
            return;
          }
        }
        alert("¡Excelente! Ejercicio aprobado correctamente.");
        if (currentIdx < exercises.length - 1) {
          navigate(1);
        }
      }
    }

    function handleIconClick(e, iconName) {
      e.stopPropagation();
      clearSelections();
      document.getElementById(`icon-${iconName}`).classList.add('selected');
      validateAction(`click-${iconName}`);
    }

    function handleIconDblClick(iconName) {
      clearSelections();
      if (iconName === 'este-equipo') openEsteEquipoApp();
      else if (iconName === 'wordpad') openWordpadApp();
      else if (iconName === 'facturador') openFacturadorApp();
      else if (iconName === 'correo') openCorreoApp();
      else if (iconName === 'papelera') openPapeleraApp();
      validateAction(`dblclick-${iconName}`);
    }

    function handleDesktopClick(e) {
      clearSelections();
      startMenu.style.display = 'none';
      validateAction('click-desktop');
    }

    function toggleStartMenu(e) {
      e.stopPropagation();
      startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
      validateAction('click-start');
    }

    function handleStartItem(itemName) {
      startMenu.style.display = 'none';
      if (itemName === 'este-equipo') openEsteEquipoApp();
      else if (itemName === 'wordpad') openWordpadApp();
      else if (itemName === 'facturador') openFacturadorApp();
      else if (itemName === 'correo') openCorreoApp();
      else if (itemName === 'papelera') openPapeleraApp();
      validateAction(`start-${itemName}`);
    }

    function closeAppWindow() {
      appWindow.style.display = 'none';
      validateAction('close-window');
    }

    // APLICACIONES INTERACTIVAS REALES
    function openEsteEquipoApp() {
      windowTitle.textContent = "Este Equipo - Mis Archivos";
      windowBody.innerHTML = `
        <div style="font-weight:bold; margin-bottom:10px;">Carpetas de la computadora:</div>
        <ul style="list-style:none; padding-left:0;">
          <li style="padding:8px; background:#f1f3f5; margin-bottom:6px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Disco Local (C:)')">💻 Disco Local (C:)</li>
          <li style="padding:8px; background:#e2f0d9; margin-bottom:6px; border-radius:4px; cursor:pointer; font-weight:600;" onclick="openCarpetaDescargas()">📁 Descargas ${facturaGuardada ? '<span style="color:green; float:right;">[Factura_001.pdf lista]</span>' : ''}</li>
          <li style="padding:8px; background:#f1f3f5; margin-bottom:6px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Documentos')">📄 Documentos</li>
        </ul>
      `;
      appWindow.style.display = 'flex';
    }

    function openCarpetaDescargas() {
      if (currentIdx === 97 && facturaGuardada) {
        windowBody.innerHTML = `
          <div style="font-weight:bold; color:#0077b6; margin-bottom:10px;">Carpeta: Descargas</div>
          <div style="padding:10px; background:#d4edda; border:1px solid #c3e6cb; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            <span>📄 Factura_001.pdf (Guardada correctamente)[span_20](start_span)[span_20](end_span)</span>
            <button class="app-btn" onclick="abrirCorreoParaAdjuntar()">Enviar por Mail</button>
          </div>
        `;
      } else {
        alert("Carpeta Descargas abierta.");
      }
    }

    function openWordpadApp() {
      windowTitle.textContent = "WordPad - Escribir Textos";
      windowBody.innerHTML = `
        <div style="border-bottom:1px solid #dee2e6; padding-bottom:6px; margin-bottom:10px; font-size:0.8rem; color:#6c757d;">
          Archivo | Editar | Ver | Insertar | Formato
        </div>
        <textarea class="app-form-control" style="height:180px; resize:none;" placeholder="Escriba aquí su carta o nota personal..."></textarea>
      `;
      appWindow.style.display = 'flex';
    }

    function openFacturadorApp() {
      windowTitle.textContent = "Facturador Digital - Cargar Comprobante";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Nombre del Cliente o Comercio:</label>
          <input type="text" class="app-form-control" id="fac-cliente" value="Guillermo López">
        </div>
        <div class="app-form-group">
          <label>Monto Total ($):</label>
          <input type="text" class="app-form-control" id="fac-total" value="15000">
        </div>
        <button class="app-btn" onclick="emitirYGuardarFactura()">Emitir Factura y Guardar</button>
      `;
      appWindow.style.display = 'flex';
    }

    function emitirYGuardarFactura() {
      facturaGuardada = true;
      alert("¡Factura emitida con éxito! Se ha guardado en la carpeta Descargas[span_21](start_span)[span_21](end_span).");
      closeAppWindow();
      if (currentIdx === 97) {
        setTimeout(() => {
          openEsteEquipoApp();
        }, 500);
      }
    }

    function openCorreoApp() {
      windowTitle.textContent = "Correo Electrónico";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Para:</label>
          <input type="text" class="app-form-control" id="mail-to" value="contacto@comercio.com">
        </div>
        <div class="app-form-group">
          <label>Asunto:</label>
          <input type="text" class="app-form-control" id="mail-sub" value="Envío de Factura">
        </div>
        <div id="mail-adjunto-container" style="margin-bottom:10px; font-size:0.85rem; color:#495057;">
          📎 Archivos adjuntos: <em>Ninguno</em>
        </div>
        <button class="app-btn" onclick="enviarCorreoFinal()">Enviar Correo</button>
      `;
      appWindow.style.display = 'flex';
    }

    function abrirCorreoParaAdjuntar() {
      openCorreoApp();
      setTimeout(() => {
        const adjContainer = document.getElementById('mail-adjunto-container');
        if (adjContainer) {
          adjContainer.innerHTML = `📎 Archivos adjuntos: <strong style="color:green;">Factura_001.pdf</strong> (Adjuntado desde Descargas)[span_22](start_span)[span_22](end_span)`;
        }
      }, 200);
    }

    function enviarCorreoFinal() {
      alert("¡Correo enviado con éxito junto con la factura adjunta[span_23](start_span)[span_23](end_span)!");
      closeAppWindow();
      if (currentIdx === 97) {
        alert("¡Felicitaciones! Ha aprobado el Examen Integrador Final y completado los 100 ejercicios.");
        navigate(1);
      }
    }

    function openPapeleraApp() {
      windowTitle.textContent = "Papelera de Reciclaje";
      windowBody.innerHTML = `
        <div style="color:#6c757d; font-size:0.95rem; text-align:center; padding:25px;">
          🗑️ La papelera está vacía en este momento.
        </div>
      `;
      appWindow.style.display = 'flex';
    }

    init();
  </script>
</body>
</html>
