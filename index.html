<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitación Digital - Simulador Educativo Windows 10</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Panel Izquierdo: Capacitación Digital */
    .sidebar {
      width: 380px;
      background-color: #0b132b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
      z-index: 20;
    }

    .sidebar-header h2 {
      font-size: 1.3rem;
      color: #00b4d8;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Controles de Módulos y Ejercicios Flotantes */
    .control-group {
      margin-bottom: 12px;
    }

    .control-label {
      font-size: 0.78rem;
      color: #8d99ae;
      margin-bottom: 4px;
      display: block;
      font-weight: 600;
    }

    .module-select, .exercise-dropdown-select {
      width: 100%;
      padding: 9px;
      background: #1c2541;
      color: #fff;
      border: 1px solid #3a506b;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .badge-module {
      display: inline-block;
      background-color: #0077b6;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .exercise-title {
      font-size: 1rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .instruction-card {
      background-color: #1c2541;
      border-left: 4px solid #00b4d8;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .instruction-text {
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 10px;
      color: #e0e1dd;
      max-height: 130px;
      overflow-y: auto;
    }

    .hint-btn {
      width: 100%;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid #ffb703;
      color: #ffb703;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }

    .hint-box {
      display: none;
      background: rgba(255, 183, 3, 0.1);
      border: 1px dashed #ffb703;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #ffb703;
      margin-bottom: 10px;
      max-height: 110px;
      overflow-y: auto;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background-color: #00b4d8;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-nav:disabled {
      background-color: #3a506b;
      color: #8d99ae;
      cursor: not-allowed;
    }

    /* Panel Derecho: Escritorio de Windows */
    .desktop-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    }

    .desktop-workspace {
      flex: 1;
      position: relative;
      padding: 15px;
    }

    /* Iconos del Escritorio */
    .desktop-icons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #ffffff;
      font-size: 0.75rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .desktop-icon:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .desktop-icon.selected {
      background-color: rgba(0, 180, 216, 0.3);
      border: 1px solid #00b4d8;
    }

    .desktop-icon svg, .desktop-icon img {
      width: 38px;
      height: 38px;
      margin-bottom: 4px;
    }

    /* Ventanas Simuladas */
    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 360px;
      background-color: #f8f9fa;
      color: #333333;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: none;
      z-index: 10;
      flex-direction: column;
    }

    .window-header {
      background-color: #e9ecef;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ced4da;
    }

    .window-title {
      font-size: 0.85rem;
      color: #212529;
      font-weight: 600;
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .btn-close:hover {
      background-color: #dc3545;
      color: #ffffff;
    }

    .window-body {
      padding: 15px;
      font-size: 0.85rem;
      flex: 1;
      overflow-y: auto;
      background-color: #ffffff;
      color: #212529;
    }

    /* Contenido Específico de Apps */
    .app-form-group {
      margin-bottom: 10px;
    }
    .app-form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .app-form-control {
      width: 100%;
      padding: 6px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .app-btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .app-btn:hover {
      background: #0096c7;
    }

    /* Menú Inicio */
    .start-menu {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 260px;
      background-color: rgba(15, 23, 42, 0.96);
      border-top-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: none;
      z-index: 15;
    }

    .start-item {
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .start-item:hover {
      background-color: #00b4d8;
      color: #000;
    }

    /* Barra de Tareas */
    .taskbar {
      height: 45px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .start-btn {
      background: transparent;
      border: none;
      color: #00b4d8;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .start-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .taskbar-clock {
      font-size: 0.75rem;
      text-align: right;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Panel Izquierdo: Capacitación Digital con Menús Flotantes -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <h2>Capacitación Digital</h2>
        </div>

        <!-- Selector de Módulo -->
        <div class="control-group">
          <label class="control-label">Módulo actual:</label>
          <select id="module-select" class="module-select" onchange="changeModuleFilter(this.value)">
            <option value="all">Todos los módulos</option>
            <option value="1">Módulo 1: Panel Táctil y Gestos</option>
            <option value="2">Módulo 2: Gestión de Ventanas</option>
            <option value="3">Módulo 3: Explorador de Archivos</option>
            <option value="4">Módulo 4: Edición WordPad</option>
            <option value="5">Módulo 5: Facturador Digital</option>
            <option value="6">Módulo 6: Clientes de Correo</option>
            <option value="7">Módulo 7: Herramientas de Sistema</option>
            <option value="8">Módulo 8: Integración Operativa</option>
          </select>
        </div>

        <!-- Menú flotante de ejercicios correspondientes al módulo -->
        <div class="control-group">
          <label class="control-label">Seleccionar Ejercicio:</label>
          <select id="exercise-dropdown-select" class="exercise-dropdown-select" onchange="selectExercise(this.value)"></select>
        </div>

        <span id="badge-module" class="badge-module">Módulo 1</span>
        <h3 id="exercise-title" class="exercise-title">Ejercicio 1</h3>
        
        <div class="instruction-card">
          📌 <span id="location-text">Ubicación inicial: Escritorio principal</span>
        </div>
        
        <p id="instruction-text" class="instruction-text">Cargando consigna...</p>
        
        <button class="hint-btn" onclick="toggleHint()">💡 Pista: Ver paso a paso</button>
        <div id="hint-box" class="hint-box"></div>
      </div>

      <div class="nav-buttons">
        <button id="btn-prev" class="btn-nav" onclick="navigate(-1)">Anterior</button>
        <button id="btn-next" class="btn-nav" onclick="navigate(1)">Siguiente</button>
      </div>
    </aside>

    <!-- Panel Derecho: Escritorio de Windows con Íconos Oficiales -->
    <main class="desktop-container" onclick="handleDesktopClick(event)">
      <div class="desktop-workspace">
        
        <div class="desktop-icons">
          <!-- Este Equipo (Icono original Win10: PC con soporte) -->
          <div class="desktop-icon" id="icon-este-equipo" onclick="handleIconClick(event, 'este-equipo')" ondblclick="handleIconDblClick('este-equipo')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#0078d7" d="M40 8H8a4 4 0 00-4 4v20a4 4 0 004 4h14l-2 4h-4v2h16v-2h-4l-2-4h14a4 4 0 004-4V12a4 4 0 00-4-4zm0 22H8V12h32z"/></svg>
            <span>Este Equipo</span>
          </div>

          <!-- WordPad (Icono Bloc de notas / Cuaderno clásico Win10) -->
          <div class="desktop-icon" id="icon-wordpad" onclick="handleIconClick(event, 'wordpad')" ondblclick="handleIconDblClick('wordpad')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#2b579a" d="M6 6h28l8 8v28H6z"/><path fill="#fff" d="M14 18h20v2H14zm0 6h20v2H14zm0 6h14v2H14z"/><path fill="#19325c" d="M34 6v8h8z"/></svg>
            <span>WordPad</span>
          </div>

          <!-- Facturador (Icono Documento Fiscal / Factura) -->
          <div class="desktop-icon" id="icon-facturador" onclick="handleIconClick(event, 'facturador')" ondblclick="handleIconDblClick('facturador')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#107c41" d="M8 4h24l8 8v32H8z"/><path fill="#fff" d="M14 16h20v2H14zm0 6h20v2H14zm0 6h12v2H14z"/><path fill="#0b532c" d="M32 4v10h10z"/></svg>
            <span>Facturador</span>
          </div>

          <!-- Correo -->
          <div class="desktop-icon" id="icon-correo" onclick="handleIconClick(event, 'correo')" ondblclick="handleIconDblClick('correo')">
            <img src="https://img.icons8.com/color/48/gmail-new.png" alt="Correo">
            <span>Correo</span>
          </div>

          <!-- Papelera de Reciclaje -->
          <div class="desktop-icon" id="icon-papelera" onclick="handleIconClick(event, 'papelera')" ondblclick="handleIconDblClick('papelera')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#6c757d" d="M12 12h24v30H12z"/><path fill="#495057" d="M10 8h28v4H10z"/><path fill="#adb5bd" d="M20 4h8v4h-8z"/></svg>
            <span>Papelera</span>
          </div>
        </div>

        <div class="window" id="app-window">
          <div class="window-header">
            <span class="window-title" id="window-title">Ventana</span>
            <button class="btn-close" onclick="closeAppWindow()" title="Cerrar">[X]</button>
          </div>
          <div class="window-body" id="window-body">
            Contenido de la aplicación...
          </div>
        </div>

        <div class="start-menu" id="start-menu">
          <div class="start-item" onclick="handleStartItem('wordpad')">📝 WordPad</div>
          <div class="start-item" onclick="handleStartItem('facturador')">🧮 Facturador Digital</div>
          <div class="start-item" onclick="handleStartItem('correo')">✉️ Correo</div>
          <div class="start-item" onclick="handleStartItem('este-equipo')">💻 Este Equipo</div>
          <div class="start-item" onclick="handleStartItem('papelera')">🗑️ Papelera de Reciclaje</div>
        </div>

      </div>

      <!-- Barra de tareas con logotipo oficial Windows 10 -->
      <footer class="taskbar">
        <div class="taskbar-left">
          <button class="start-btn" id="start-btn" onclick="toggleStartMenu(event)" title="Inicio">
            <svg viewBox="0 0 88 88" width="20" height="20">
              <path fill="#00b4d8" d="M0 12.402l35.687-4.86.016 34.423-35.703.203zm35.687 34.93l.031 34.531-35.718-4.937-.016-29.75zm5.797-40.407L87.89 0l-.016 41.563-42.39.313zm42.422 41.141l.016 42.188-42.438-6.094-.031-36.438z"/>
            </svg>
          </button>
        </div>
        <div class="taskbar-clock">
          <div id="clock-time">23:18</div>
          <div id="clock-date">17/08/2026</div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    // MATRIZ COMPLETA DE LOS 100 EJERCICIOS (CON ENUNCIADOS COLOQUIALES Y PISTAS PASO A PASO DETALLADAS)
    const exercises = [
      // Módulo 1: Panel Táctil y Gestos (01 al 14)
      { id: 1, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 01 – Tocar con precisión", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Para seleccionar un programa en la computadora, necesitamos tocarlo una vez suavemente con el dedo o el mouse.", hint: "Paso 1: Ubique el ícono de WordPad en el escritorio.\nPaso 2: Haga un clic simple sobre el ícono para seleccionarlo.", targetAction: "click-wordpad" },
      { id: 2, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 02 – Abrir con doble toque", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Para abrir un programa y empezar a usarlo, necesitamos hacer dos toques rápidos seguidos sobre su ícono.", hint: "Paso 1: Coloque el cursor sobre el ícono de WordPad.\nPaso 2: Haga doble clic rápido seguido para abrir la aplicación.", targetAction: "dblclick-wordpad" },
      { id: 3, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 03 – Abrir menú auxiliar", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Si queremos ver opciones adicionales de la pantalla, podemos hacer clic en un espacio libre del fondo.", hint: "Paso 1: Busque un espacio vacío en el fondo de pantalla donde no haya íconos.\nPaso 2: Haga un clic simple para activar el área de trabajo.", targetAction: "click-desktop" },
      { id: 4, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 14 – Tocar ícono del Facturador", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Vamos a preparar el acceso al sistema de facturación tocando su ícono en el escritorio.", hint: "Paso 1: Localice el ícono del Facturador.\nPaso 2: Haga un clic simple sobre él.", targetAction: "click-facturador" },
      { id: 5, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 05 – Enfocar pantalla", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Haga clic en el fondo de la pantalla para asegurarse de que el sistema está listo.", hint: "Paso 1: Apunte con el cursor a un espacio libre del fondo.\nPaso 2: Haga clic izquierdo.", targetAction: "click-desktop" },
      { id: 6, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 06 – Seleccionar Este Equipo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Seleccione el ícono 'Este Equipo' para explorar los discos y carpetas de la computadora.", hint: "Paso 1: Localice el ícono 'Este Equipo' arriba a la izquierda.\nPaso 2: Haga un clic simple.", targetAction: "click-este-equipo" },
      { id: 7, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 07 – Seleccionar Correo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Toque el ícono de Correo para seleccionarlo.", hint: "Paso 1: Busque el ícono de Correo.\nPaso 2: Haga un clic sobre él.", targetAction: "click-correo" },
      { id: 8, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 08 – Abrir Menú Inicio", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Para ver todas las aplicaciones instaladas, abriremos el Menú Inicio desde la barra inferior.", hint: "Paso 1: Dirija el cursor al botón con el logotipo de Windows abajo a la izquierda.\nPaso 2: Haga clic para desplegar el menú.", targetAction: "click-start" },
      { id: 9, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 09 – Abrir Menú Inicio secundario", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Abra nuevamente el Menú Inicio para practicar el acceso rápido.", hint: "Paso 1: Haga clic en el botón de Windows de la barra inferior.", targetAction: "click-start" },
      { id: 10, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 10 – Volver al Escritorio", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Haga clic en el fondo del escritorio para limpiar la selección actual.", hint: "Paso 1: Haga clic en cualquier zona vacía del fondo de pantalla.", targetAction: "click-desktop" },
      { id: 11, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 11 – Abrir WordPad rápidamente", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Abra la aplicación WordPad mediante doble clic en su acceso directo.", hint: "Paso 1: Posiciónese sobre WordPad.\nPaso 2: Haga doble clic rápido para abrirlo.", targetAction: "dblclick-wordpad" },
      { id: 12, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 12 – Enfoque de escritorio", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Haga clic en el fondo de la pantalla para enfocar el escritorio.", hint: "Paso 1: Haga clic en un espacio libre del fondo.", targetAction: "click-desktop" },
      { id: 13, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 13 – Menú de inicio rápido", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Despliegue el Menú Inicio para ver las opciones disponibles.", hint: "Paso 1: Haga clic en el botón de inicio de Windows en la barra de tareas.", targetAction: "click-start" },
      { id: 14, module: "1", modName: "Módulo 1: Panel Táctil y Gestos", title: "Ejercicio 14 – Menú Inicio y ajustes", context: "📌 Ubicación inicial: Menú Inicio", instruction: "Abra el Menú Inicio para repasar el acceso a herramientas.", hint: "Paso 1: Haga clic en el botón de Windows abajo a la izquierda.", targetAction: "click-start" },

      // Módulo 2: Gestión de Ventanas (15 al 27)
      { id: 15, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 15 – Cerrar ventana activa", context: "📌 Ubicación inicial: Ventana de Aplicación", instruction: "Para cerrar una ventana que ya no necesitamos, podemos pulsar el botón con la cruz (X) arriba a la derecha.", hint: "Paso 1: Localice la cruz roja [X] en la esquina superior derecha de la ventana.\nPaso 2: Haga clic sobre ella para cerrarla.", targetAction: "close-window" },
      { id: 16, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 16 – Cerrar ventana actual", context: "📌 Ubicación inicial: Ventana de Aplicación", instruction: "Cierre la ventana activa usando el botón de salida.", hint: "Paso 1: Haga clic en la cruz [X] de la ventana.", targetAction: "close-window" },
      { id: 17, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ejercicio 17 – Cerrar ventana abierta", context: "📌 Ubicación inicial: Ventana de Aplicación", instruction: "Cierre la ventana actual para continuar con el ejercicio.", hint: "Paso 1: Haga clic en el botón [X] de cierre.", targetAction: "close-window" },

      { id: 87, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 87 – Seleccionar Correo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Haga un clic simple sobre el ícono de Correo.", hint: "Paso 1: Haga clic en Correo.", targetAction: "click-correo" },
      { id: 88, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 88 – Abrir Correo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Abra el Correo con doble clic para ver procesos.", hint: "Paso 1: Haga doble clic en Correo.", targetAction: "dblclick-correo" },
      { id: 89, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 89 – Cerrar Correo", context: "📌 Ubicación inicial: Ventana de Correo", instruction: "Cierre la ventana de Correo con [X].", hint: "Paso 1: Haga clic en la cruz [X].", targetAction: "close-window" },
      { id: 90, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 90 – Enfocar escritorio", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Haga clic en un espacio vacío del fondo.", hint: "Paso 1: Haga clic en el fondo de pantalla.", targetAction: "click-desktop" },
      { id: 91, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 91 – Seleccionar Este Equipo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Haga clic simple en 'Este Equipo'.", hint: "Paso 1: Haga clic en 'Este Equipo'.", targetAction: "click-este-equipo" },
      { id: 92, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 92 – Abrir Este Equipo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Abra 'Este Equipo' con doble clic.", hint: "Paso 1: Haga doble clic en 'Este Equipo'.", targetAction: "dblclick-este-equipo" },
      { id: 93, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 93 – Cerrar ventana", context: "📌 Ubicación inicial: Ventana de Este Equipo", instruction: "Cierre la ventana abierta con [X].", hint: "Paso 1: Haga clic en la cruz [X].", targetAction: "close-window" },
      { id: 94, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 94 – Abrir Menú Inicio", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Despliegue el Menú Inicio.", hint: "Paso 1: Haga clic en el botón de Windows.", targetAction: "click-start" },
      { id: 95, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 95 – Iniciar Facturador desde menú", context: "📌 Ubicación inicial: Menú Inicio", instruction: "Abra el Facturador desde el Menú Inicio.", hint: "Paso 1: Abra el Menú Inicio.\nPaso 2: Haga clic en 'Facturador Digital'.", targetAction: "start-facturador" },
      { id: 96, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 96 – Cerrar Facturador", context: "📌 Ubicación inicial: Ventana de Facturador", instruction: "Cierre la ventana del Facturador con [X].", hint: "Paso 1: Haga clic en el botón [X].", targetAction: "close-window" },
      { id: 97, module: "7", modName: "Módulo 7: Herramientas de Sistema", title: "Ejercicio 97 – Limpiar pantalla", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Haga clic en un espacio vacío del fondo.", hint: "Paso 1: Haga clic en el fondo del escritorio.", targetAction: "click-desktop" },

      // Módulo 8: Integración Operativa (98 al 100)
      { id: 98, module: "8", modName: "Módulo 8: Integración Operativa", title: "Ejercicio 98 – Flujo transaccional completo", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Para completar este ejercicio integrador: Primero abra el Facturador, emita la factura (se guardará en Descargas), luego búsquela en el explorador 'Este Equipo' y envíela por Correo.", hint: "Paso 1: Haga doble clic en el ícono del Facturador para comenzar la emisión.", targetAction: "dblclick-facturador" },
      { id: 99, module: "8", modName: "Módulo 8: Integración Operativa", title: "Ejercicio 99 – Resolución de incidencias", context: "📌 Ubicación inicial: Ventana de Facturador", instruction: "Cierre la ventana activa del Facturador para finalizar el diagnóstico de archivos.", hint: "Paso 1: Haga clic en la cruz [X] de la ventana.", targetAction: "close-window" },
      { id: 100, module: "8", modName: "Módulo 8: Integración Operativa", title: "Ejercicio 100 – Evaluación de autonomía", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Cierre la última ventana abierta haciendo clic en la cruz [X] para completar con éxito el ciclo de capacitación.", hint: "Paso 1: Cierre cualquier ventana activa pulsando [X] para finalizar.", targetAction: "close-window" }
    ];

    let currentIdx = 0;
    let facturaGuardada = false;

    const moduleSelectElem = document.getElementById('module-select');
    const exerciseDropdownElem = document.getElementById('exercise-dropdown-select');
    const badgeElem = document.getElementById('badge-module');
    const titleElem = document.getElementById('exercise-title');
    const contextElem = document.getElementById('location-text');
    const instructionElem = document.getElementById('instruction-text');
    const hintBox = document.getElementById('hint-box');
    const appWindow = document.getElementById('app-window');
    const windowTitle = document.getElementById('window-title');
    const windowBody = document.getElementById('window-body');
    const startMenu = document.getElementById('start-menu');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    function init() {
      populateExerciseDropdown();
      loadExercise(0);
    }

    function populateExerciseDropdown() {
      const selectedModule = moduleSelectElem.value;
      exerciseDropdownElem.innerHTML = '';

      exercises.forEach((ex, idx) => {
        if (selectedModule === 'all' || ex.module === selectedModule) {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = ex.title;
          exerciseDropdownElem.appendChild(opt);
        }
      });
    }

    function changeModuleFilter(modVal) {
      populateExerciseDropdown();
      // Seleccionar el primer ejercicio disponible del módulo filtrado
      const firstOpt = exerciseDropdownElem.options[0];
      if (firstOpt) {
        loadExercise(parseInt(firstOpt.value, 10));
      }
    }

    function loadExercise(idx) {
      currentIdx = idx;
      const ex = exercises[currentIdx];

      // Sincronizar el select flotante de ejercicios
      exerciseDropdownElem.value = currentIdx;

      badgeElem.textContent = ex.modName;
      titleElem.textContent = ex.title;
      contextElem.textContent = ex.context;
      instructionElem.innerHTML = ex.instruction;
      hintBox.innerHTML = ex.hint;
      hintBox.style.display = 'none';

      clearSelections();
      startMenu.style.display = 'none';
      appWindow.style.display = 'none';

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === exercises.length - 1;
    }

    function selectExercise(val) {
      loadExercise(parseInt(val, 10));
    }

    function navigate(dir) {
      const next = currentIdx + dir;
      if (next >= 0 && next < exercises.length) {
        // Verificar si el ejercicio pertenece al filtro actual, si no, ajustar el módulo
        const targetEx = exercises[next];
        if (moduleSelectElem.value !== 'all' && targetEx.module !== moduleSelectElem.value) {
          moduleSelectElem.value = targetEx.module;
          populateExerciseDropdown();
        }
        loadExercise(next);
      }
    }

    function toggleHint() {
      hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    function clearSelections() {
      document.querySelectorAll('.desktop-icon').forEach(icon => icon.classList.remove('selected'));
    }

    function validateAction(actionName) {
      const currentEx = exercises[currentIdx];
      if (currentEx.targetAction === actionName) {
        if (currentIdx === 97) { // Ejercicio 98: Flujo Transaccional
          if (actionName === 'dblclick-facturador') {
            openFacturadorApp();
            return;
          }
        }
        alert("¡Excelente! Ejercicio completado correctamente.");
        if (currentIdx < exercises.length - 1) {
          navigate(1);
        }
      }
    }

    function handleIconClick(e, iconName) {
      e.stopPropagation();
      clearSelections();
      document.getElementById(`icon-${iconName}`).classList.add('selected');
      validateAction(`click-${iconName}`);
    }

    function handleIconDblClick(iconName) {
      clearSelections();
      if (iconName === 'este-equipo') openEsteEquipoApp();
      else if (iconName === 'wordpad') openWordpadApp();
      else if (iconName === 'facturador') openFacturadorApp();
      else if (iconName === 'correo') openCorreoApp();
      else if (iconName === 'papelera') openPapeleraApp();
      validateAction(`dblclick-${iconName}`);
    }

    function handleDesktopClick(e) {
      clearSelections();
      startMenu.style.display = 'none';
      validateAction('click-desktop');
    }

    function toggleStartMenu(e) {
      e.stopPropagation();
      startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
      validateAction('click-start');
    }

    function handleStartItem(itemName) {
      startMenu.style.display = 'none';
      if (itemName === 'este-equipo') openEsteEquipoApp();
      else if (itemName === 'wordpad') openWordpadApp();
      else if (itemName === 'facturador') openFacturadorApp();
      else if (itemName === 'correo') openCorreoApp();
      else if (itemName === 'papelera') openPapeleraApp();
      validateAction(`start-${itemName}`);
    }

    function closeAppWindow() {
      appWindow.style.display = 'none';
      validateAction('close-window');
    }

    // APLICACIONES INTERACTIVAS REALES
    function openEsteEquipoApp() {
      windowTitle.textContent = "Este Equipo - Explorador de Archivos";
      windowBody.innerHTML = `
        <div style="font-weight:bold; margin-bottom:10px;">Carpetas y Unidades del Sistema:</div>
        <ul style="list-style:none; padding-left:0;">
          <li style="padding:6px; background:#f1f3f5; margin-bottom:4px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Disco Local (C:)')">💻 Disco Local (C:)</li>
          <li style="padding:6px; background:#e2f0d9; margin-bottom:4px; border-radius:4px; cursor:pointer; font-weight:600;" onclick="openCarpetaDescargas()">📁 Descargas ${facturaGuardada ? '<span style="color:green; float:right;">[Factura_001.pdf disponible]</span>' : ''}</li>
          <li style="padding:6px; background:#f1f3f5; margin-bottom:4px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Documentos')">📄 Documentos</li>
        </ul>
      `;
      appWindow.style.display = 'flex';
    }

    function openCarpetaDescargas() {
      if (currentIdx === 97 && facturaGuardada) {
        windowBody.innerHTML = `
          <div style="font-weight:bold; color:#0077b6; margin-bottom:10px;">Carpeta: Descargas</div>
          <div style="padding:8px; background:#d4edda; border:1px solid #c3e6cb; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            <span>📄 Factura_001.pdf (Generada y guardada correctamente)</span>
            <button class="app-btn" onclick="abrirCorreoParaAdjuntar()">Adjuntar al Correo</button>
          </div>
        `;
      } else {
        alert("Carpeta Descargas abierta.");
      }
    }

    function openWordpadApp() {
      windowTitle.textContent = "WordPad - Editor de Texto";
      windowBody.innerHTML = `
        <div style="border-bottom:1px solid #dee2e6; padding-bottom:6px; margin-bottom:10px; font-size:0.75rem; color:#6c757d;">
          Archivo | Edición | Ver | Insertar | Formato
        </div>
        <textarea class="app-form-control" style="height:180px; resize:none;" placeholder="Escriba su texto aquí..."></textarea>
      `;
      appWindow.style.display = 'flex';
    }

    function openFacturadorApp() {
      windowTitle.textContent = "Facturador Digital - Emisión de Comprobantes";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Cliente / Razón Social:</label>
          <input type="text" class="app-form-control" id="fac-cliente" value="Guillermo López">
        </div>
        <div class="app-form-group">
          <label>Total de la Factura ($):</label>
          <input type="text" class="app-form-control" id="fac-total" value="15000">
        </div>
        <button class="app-btn" onclick="emitirYGuardarFactura()">Emitir y Guardar en Descargas</button>
      `;
      appWindow.style.display = 'flex';
    }

    function emitirYGuardarFactura() {
      facturaGuardada = true;
      alert("¡Factura emitida con éxito! El comprobante PDF se ha guardado automáticamente en la carpeta Descargas.");
      closeAppWindow();
      if (currentIdx === 97) {
        setTimeout(() => {
          openEsteEquipoApp();
        }, 500);
      }
    }

    function openCorreoApp() {
      windowTitle.textContent = "Correo - Cliente de Mail";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Para:</label>
          <input type="text" class="app-form-control" id="mail-to" value="cliente@empresa.com">
        </div>
        <div class="app-form-group">
          <label>Asunto:</label>
          <input type="text" class="app-form-control" id="mail-sub" value="Envío de Factura Digital">
        </div>
        <div id="mail-adjunto-container" style="margin-bottom:10px; font-size:0.8rem; color:#495057;">
          📎 Archivos adjuntos: <em>Ninguno</em>
        </div>
        <button class="app-btn" onclick="enviarCorreoFinal()">Enviar Correo</button>
      `;
      appWindow.style.display = 'flex';
    }

    function abrirCorreoParaAdjuntar() {
      openCorreoApp();
      setTimeout(() => {
        const adjContainer = document.getElementById('mail-adjunto-container');
        if (adjContainer) {
          adjContainer.innerHTML = `📎 Archivos adjuntos: <strong style="color:green;">Factura_001.pdf</strong> (Adjuntado desde Descargas)`;
        }
      }, 200);
    }

    function enviarCorreoFinal() {
      alert("¡Correo enviado exitosamente con la factura adjunta!");
      closeAppWindow();
      if (currentIdx === 97) {
        alert("¡Ejercicio 98 completado con éxito! Flujo transaccional finalizado.");
        navigate(1);
      }
    }

    function openPapeleraApp() {
      windowTitle.textContent = "Papelera de Reciclaje";
      windowBody.innerHTML = `
        <div style="color:#6c757d; font-size:0.9rem; text-align:center; padding:20px;">
          🗑️ La papelera está actualmente vacía.
        </div>
      `;
      appWindow.style.display = 'flex';
    }

    init();
  </script>
</body>
