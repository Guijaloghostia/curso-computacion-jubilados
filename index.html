<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Windows 10 - Eterna Juventud (100 Ejercicios Interactivos)</title>
    <style>
        :root {
            --win-bg: #0063b1;
            --taskbar-bg: #1f1f1f;
            --panel-bg: #2b2b2b;
            --accent: #0078d7;
            --success: #107c41;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* PANEL LATERAL DE EJERCICIOS */
        #exercisePanel {
            width: 400px;
            background-color: var(--panel-bg);
            border-right: 2px solid #3f3f3f;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .panel-header h1 {
            font-size: 1.2rem;
            color: #00a4ef;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #3f3f3f;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .exercise-card {
            background: #1f1f1f;
            border-radius: 6px;
            padding: 15px;
            border-left: 4px solid var(--accent);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .badge-module {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #3a3a3a;
            padding: 3px 8px;
            border-radius: 3px;
            width: fit-content;
            color: #aaa;
        }

        .exercise-title {
            font-size: 1.1rem;
            color: #fff;
        }

        .exercise-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #ddd;
        }

        .clarification {
            color: #9cdcfcfe;
            font-style: italic;
        }

        .hint-box {
            background: #2d2d00;
            border: 1px solid #808000;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #ffff80;
        }

        .ok-box {
            background: var(--success);
            color: white;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        .hidden { display: none !important; }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* ENTORNO SIMULADOR WINDOWS 10 */
        #simulator {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--win-bg) url('https://picsum.photos/id/1018/1200/800') center/cover no-repeat;
        }

        #desktop {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
            position: relative;
        }

        .desktop-icon {
            width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 5px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .desktop-icon img {
            width: 40px;
            height: 40px;
            pointer-events: none;
        }

        .desktop-icon span {
            font-size: 0.8rem;
            text-shadow: 1px 1px 2px #000;
        }

        /* VENTANAS SIMULADAS */
        .window {
            position: absolute;
            width: 480px;
            height: 320px;
            background: #ffffff;
            color: #000;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            top: 80px;
            left: 80px;
            overflow: hidden;
            border: 1px solid #777;
        }

        .window-header {
            background: #eee;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            cursor: move;
        }

        .window-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #333;
        }

        .window-controls {
            display: flex;
            gap: 5px;
        }

        .win-btn {
            width: 25px;
            height: 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
        }

        .win-btn-close:hover {
            background: #e81123;
            color: white;
        }

        .window-toolbar {
            display: flex;
            gap: 5px;
            padding: 5px;
            background: #f4f4f4;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
        }

        .tool-btn {
            padding: 3px 8px;
            font-size: 0.75rem;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }

        .window-body {
            flex-grow: 1;
            padding: 10px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .window-body textarea, .window-body input {
            width: 100%;
            border: 1px solid #ccc;
            padding: 8px;
            outline: none;
        }

        .window-body textarea {
            flex-grow: 1;
            resize: none;
        }

        /* BARRA DE TAREAS */
        #taskbar {
            height: 40px;
            background: var(--taskbar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 10;
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .start-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .start-btn:hover { background: rgba(255,255,255,0.1); }

        .system-tray {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            align-items: center;
        }

        /* MENÚ CONTEXTUAL */
        .context-menu {
            position: absolute;
            background: #2b2b2b;
            border: 1px solid #444;
            width: 180px;
            border-radius: 4px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            z-index: 200;
        }

        .context-menu-item {
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .context-menu-item:hover { background: var(--accent); }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- PANEL DE CONTROL Y GUÍA DE EJERCICIOS -->
    <div id="exercisePanel">
        <div class="panel-header">
            <h1>Capacitación Digital</h1>
            <p style="font-size: 0.8rem; color: #aaa;">Plataforma Eterna Juventud</p>
        </div>

        <select id="exerciseSelector"></select>

        <div class="exercise-card">
            <span id="exerciseModule" class="badge-module">Módulo 1</span>
            <h2 id="exerciseTitle" class="exercise-title">Título del ejercicio</h2>
            <p id="exerciseText" class="exercise-text">Consigna...</p>
            <div id="exerciseHint" class="hint-box">Pista...</div>
            <div id="exerciseOk" class="ok-box hidden">¡Excelente!</div>
        </div>

        <div class="nav-buttons">
            <button id="prevBtn" class="btn" onclick="prevExercise()">Anterior</button>
            <button id="nextBtn" class="btn" onclick="nextExercise()">Siguiente</button>
        </div>
    </div>

    <!-- ENTORNO SIMULADO WINDOWS 10 -->
    <div id="simulator">
        <div id="desktop" onmousedown="triggerAction('drag', 'desktop')">
            <div id="icon-wordpad" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'desktop-icon')">
                <img src="https://img.icons8.com/color/48/wordpad.png" alt="WordPad">
                <span>WordPad</span>
            </div>
            <div id="icon-facturador" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'desktop-icon')">
                <img src="https://img.icons8.com/color/48/ms-excel.png" alt="Facturador">
                <span>Facturador</span>
            </div>
            <div id="icon-computer" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'desktop-icon')">
                <img src="https://img.icons8.com/color/48/display.png" alt="Este equipo">
                <span>Este equipo</span>
            </div>
            <div id="icon-trash" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'icon-trash')">
                <img src="https://img.icons8.com/color/48/full-trash.png" alt="Papelera">
                <span>Papelera</span>
            </div>
            <div id="icon-folder" class="desktop-icon hidden" id="createdFolder">
                <img src="https://img.icons8.com/color/48/folder-invoices.png" alt="Mis Recetas">
                <span id="folder-name">Mis Recetas</span>
            </div>
        </div>

        <!-- VENTANA SIMULADA GENERAL -->
        <div id="appWindow" class="window hidden">
            <div id="window-header" class="window-header" onmousedown="triggerAction('drag', 'window-header')">
                <span id="winTitle" class="window-title">Programa</span>
                <div class="window-controls">
                    <button id="btn-minimize" class="win-btn win-btn-minimize" onclick="triggerAction('click', 'btn-minimize')">–</button>
                    <button id="btn-close" class="win-btn win-btn-close" onclick="closeWindow()">X</button>
                </div>
            </div>
            <div id="window-toolbar" class="window-toolbar">
                <button id="btn-font" class="tool-btn" onclick="triggerAction('click', 'btn-font')">Fuente: Arial</button>
                <button id="btn-size" class="tool-btn" onclick="triggerAction('click', 'btn-size')">Tamaño: 18</button>
                <button id="btn-bold" class="tool-btn" onclick="triggerAction('click', 'btn-bold')"><b>N</b></button>
                <button id="btn-underline" class="tool-btn" onclick="triggerAction('click', 'btn-underline')"><u>S</u></button>
                <button id="btn-color" class="tool-btn" onclick="triggerAction('click', 'btn-color')">Color Azul</button>
                <button id="btn-center" class="tool-btn" onclick="triggerAction('click', 'btn-center')">Centrar</button>
                <button id="btn-save" class="tool-btn" onclick="triggerAction('click', 'btn-save')">Guardar</button>
                <button id="btn-open" class="tool-btn" onclick="triggerAction('click', 'btn-open')">Abrir</button>
                <button id="btn-img" class="tool-btn" onclick="triggerAction('click', 'btn-img')">Imagen</button>
                <button id="btn-print" class="tool-btn" onclick="triggerAction('click', 'btn-print')">Imprimir</button>
                <button id="btn-sum" class="tool-btn" onclick="triggerAction('click', 'btn-sum')">Σ Suma</button>
                <button id="btn-currency" class="tool-btn" onclick="triggerAction('click', 'btn-currency')">$ Moneda</button>
                <button id="btn-colorfill" class="tool-btn" onclick="triggerAction('click', 'btn-colorfill')">🎨 Color</button>
                <button id="btn-borders" class="tool-btn" onclick="triggerAction('click', 'btn-borders')">🔲 Bordes</button>
                <button id="btn-restore" class="tool-btn" onclick="triggerAction('click', 'btn-restore')">Restaurar</button>
            </div>
            <div class="window-body">
                <input type="text" id="search-input" placeholder="Buscar documento..." oninput="triggerAction('input', 'search-input')" class="hidden">
                <textarea id="winEditor" placeholder="Escriba aquí su documento..." oninput="triggerAction('input', 'winEditor')"></textarea>
                <div id="facturadorGrid" class="hidden" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <input type="text" id="cell-1" placeholder="Concepto (ej. Luz)" oninput="triggerAction('input', 'cell-1')" onclick="triggerAction('click', 'cell-1')">
                    <input type="text" id="cell-2" placeholder="Importe ($)" oninput="triggerAction('input', 'cell-2')">
                </div>
            </div>
        </div>

        <!-- BARRA DE TAREAS -->
        <div id="taskbar" oncontextmenu="e.preventDefault(); triggerAction('contextmenu', 'taskbar')">
            <div class="taskbar-left">
                <button id="btn-start-menu" class="start-btn" onclick="triggerAction('click', 'btn-start-menu')">🪟</button>
                <div id="icon-mail" class="desktop-icon" style="flex-direction:row; width:auto; padding:3px 8px;" onclick="triggerAction('click', 'icon-mail')" oncontextmenu="e.preventDefault(); triggerAction('contextmenu', 'icon-mail')">
                    <img src="https://img.icons8.com/color/24/gmail-new.png" alt="Correo">
                    <span style="font-size:0.75rem">Correo</span>
                </div>
            </div>
            <div id="system-tray" class="system-tray" onmousemove="triggerAction('mousemove', 'system-tray')" onclick="triggerAction('click', 'system-tray')">
                <span id="btn-lang" style="cursor:pointer;" onclick="triggerAction('click', 'btn-lang')">ESP</span>
                <span id="btn-volume" style="cursor:pointer;" onclick="triggerAction('click', 'btn-volume')">🔊</span>
                <span id="btn-wifi" style="cursor:pointer;" onclick="triggerAction('click', 'btn-wifi')">📶</span>
                <span id="clock" style="cursor:pointer;" onclick="triggerAction('click', 'clock')">12:00</span>
                <span id="btn-showdesktop" style="border-left:1px solid #555; padding-left:5px; cursor:pointer;" onclick="triggerAction('click', 'btn-showdesktop')">|</span>
            </div>
        </div>

        <!-- MENÚ CONTEXTUAL -->
        <div id="contextMenu" class="context-menu hidden">
            <div class="context-menu-item" onclick="triggerAction('click', 'menu-view')">Ver (Iconos grandes)</div>
            <div class="context-menu-item" onclick="triggerAction('click', 'menu-sort')">Ordenar por fecha</div>
            <div class="context-menu-item" onclick="createNewFolder(); triggerAction('create-folder', 'desktop');">Nueva Carpeta</div>
            <div class="context-menu-item" onclick="triggerAction('contextmenu', 'icon-trash')">Vaciar papelera</div>
            <div class="context-menu-item" onclick="triggerAction('contextmenu', 'taskbar')">Cascada / Paralelo</div>
        </div>
    </div>

    <script>
        // BASE DE DATOS COMPLETA CON LOS 100 EJERCICIOS INDIVIDUALES LINKED WITH INTERACTIVE TRIGGERS
        const exercises = [
            // MÓDULO 1: PANEL TÁCTIL (1-14)
            { id: 1, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 1: Reconocimiento del puntero", text: "1. Mueva el dedo suavemente por la superficie del panel táctil.<br>2. Observe cómo se desplaza la flecha <span class='clarification'>(puntero)</span> libremente por la pantalla.", hint: "Desplace el dedo sin hacer fuerza sobre la superficie táctil.", ok: "¡Excelente! Puntero reconocido correctamente.", trigger: { type: "mousemove", target: "desktop" } },
            { id: 2, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 2: Doble toque para abrir", text: "1. Lleve la flecha sobre el icono <strong>WordPad</strong> <span class='clarification'>(el programa de escribir)</span>.<br>2. Dé dos toques rápidos seguidos para abrirlo.", hint: "Haga dos golpecitos rápidos sin mover el dedo del lugar.", ok: "¡Muy bien! Logró abrir el programa con doble toque.", trigger: { type: "dblclick", target: "icon-wordpad" } },
            { id: 3, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 3: Toque largo para opciones", text: "Mantenga apoyado su dedo durante 1 segundo en el centro de la pantalla para desplegar las opciones secundarias <span class='clarification'>(Menú contextual)</span>.", hint: "Deje el dedo fijo sin deslizarlo hasta que aparezca la lista.", ok: "¡Perfecto! Menú de opciones desplegado.", trigger: { type: "contextmenu", target: "desktop" } },
            { id: 4, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 4: Arrastrar elementos", text: "Mantenga presionado un icono y arrástrelo a otra posición dentro del <strong>Escritorio</strong> <span class='clarification'>(la pantalla principal morada)</span>.", hint: "Presione y deslice el dedo al mismo tiempo.", ok: "¡Estupendo! Elemento reubicado en pantalla.", trigger: { type: "drag", target: "desktop-icon" } },
            { id: 5, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 5: Subir y bajar página", text: "Use dos dedos juntos sobre la superficie para deslizar el texto hacia abajo.", hint: "Apoye dos dedos paralelos y muévalos en forma vertical.", ok: "¡Correcto! Desplazamiento vertical logrado.", trigger: { type: "wheel", target: "desktop" } },
            { id: 6, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 6: Desplazamiento horizontal", text: "Deslice dos dedos hacia la derecha para pasar a la siguiente imagen de la galería.", hint: "Mueva dos dedos juntos hacia el costado.", ok: "¡Muy bien! Pasó a la siguiente foto.", trigger: { type: "mousemove", target: "desktop" } },
            { id: 7, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 7: Achicar imagen (Zoom Out)", text: "Junte dos dedos sobre la pantalla <span class='clarification'>(haciendo un pellizquito suave)</span> para achicar el tamaño de la foto.", hint: "Acerque la yema de sus dos dedos entre sí.", ok: "¡Imagen reducida correctamente!", trigger: { type: "wheel", target: "desktop" } },
            { id: 8, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 8: Agrandar imagen (Zoom In)", text: "Separe dos dedos sobre la pantalla para ampliar la vista de un detalle.", hint: "Aleje la yema de sus dos dedos entre sí.", ok: "¡Imagen ampliada con éxito!", trigger: { type: "wheel", target: "desktop" } },
            { id: 9, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 9: Ver programas abiertos", text: "Deslice tres dedos hacia arriba para activar la <strong>Vista de Tareas</strong> <span class='clarification'>(pantalla que muestra todo lo que está abierto)</span>.", hint: "Apoye tres dedos y deslícelos hacia la parte superior.", ok: "¡Excelente! Ahora ve todas sus ventanas.", trigger: { type: "keydown", target: "alttab" } },
            { id: 10, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 10: Limpiar la pantalla", text: "Deslice tres dedos hacia abajo para ocultar las ventanas y ver el <strong>Escritorio</strong>.", hint: "Movimiento rápido con tres dedos hacia la parte inferior.", ok: "¡Pantalla despejada al instante!", trigger: { type: "click", target: "btn-minimize" } },
            { id: 11, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 11: Cambiar de aplicación", text: "Deslice tres dedos hacia los costados para saltar de un programa a otro.", hint: "Deslice tres dedos en sentido horizontal.", ok: "¡Cambió de programa con fluidez!", trigger: { type: "click", target: "icon-mail" } },
            { id: 12, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 12: Cambiar de mesa de trabajo", text: "Deslice cuatro dedos a la derecha para pasar a su segundo <strong>Escritorio Virtual</strong>.", hint: "Movimiento suave utilizando cuatro dedos.", ok: "¡Pasó al segundo escritorio limpio!", trigger: { type: "contextmenu", target: "desktop" } },
            { id: 13, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 13: Centro de avisos", text: "Deslice un dedo desde el borde derecho hacia adentro para abrir las notificaciones.", hint: "Inicie el movimiento desde afuera del borde derecho.", ok: "¡Avisos del sistema desplegados!", trigger: { type: "click", target: "clock" } },
            { id: 14, mod: "Módulo 1: Panel Táctil", title: "Ejercicio 14: Regular velocidad del ratón", text: "Ajuste en la configuración la velocidad de la flecha para moverla a un ritmo más cómodo.", hint: "Seleccione una velocidad pausada y adecuada para su mano.", ok: "¡Velocidad adaptada a su comodidad!", trigger: { type: "click", target: "btn-start-menu" } },

            // MÓDULO 2: VENTANAS (15-27)
            { id: 15, mod: "Módulo 2: Ventanas", title: "Ejercicio 15: Guardar ventana abajo", text: "Toque la rayita <strong>[–]</strong> arriba a la derecha para ocultar la ventana en la <strong>Barra de Tareas</strong> <span class='clarification'>(franja negra de abajo)</span>.", hint: "Es el primer botón a la izquierda de la cruz roja.", ok: "¡Ventana guardada en la barra inferior!", trigger: { type: "click", target: "btn-minimize" } },
            { id: 16, mod: "Módulo 2: Ventanas", title: "Ejercicio 16: Estirar borde de pantalla", text: "Lleve la flecha al borde de la ventana hasta ver la doble flecha y arrastre para agrandarla.", hint: "Busque el límite exacto del borde lateral.", ok: "¡Tamaño de pantalla ajustado!", trigger: { type: "drag", target: "window-header" } },
            { id: 17, mod: "Módulo 2: Ventanas", title: "Ejercicio 17: Acomodar a la izquierda", text: "Arrastre la ventana al borde izquierdo para fijarla exactamente en la mitad de la pantalla.", hint: "Empuje la ventana bien contra el extremo izquierdo.", ok: "¡Ventana fija en la mitad izquierda!", trigger: { type: "drag", target: "window-header" } },
            { id: 18, mod: "Módulo 2: Ventanas", title: "Ejercicio 18: Trabajar con dos ventanas", text: "Elija un segundo programa para ocupar la mitad derecha que quedó libre.", hint: "Haga clic en el programa secundario para dividir la pantalla.", ok: "¡Dos programas abiertos lado a lado!", trigger: { type: "dblclick", target: "icon-facturador" } },
            { id: 19, mod: "Módulo 2: Ventanas", title: "Ejercicio 19: Cuatro ventanas juntas", text: "Lleve una ventana hacia una de las esquinas superiores para organizar cuatro trabajos a la vez.", hint: "Arrastre directo hacia la esquina superior derecha o izquierda.", ok: "¡Pantalla organizada en 4 partes!", trigger: { type: "drag", target: "window-header" } },
            { id: 20, mod: "Módulo 2: Ventanas", title: "Ejercicio 20: Salto rápido de programa", text: "Presione la combinación de teclas Alt + Tab para cambiar de ventana al instante.", hint: "Mantenga Alt y toque una vez la tecla Tabulador.", ok: "¡Salto de programa completado!", trigger: { type: "keydown", target: "alttab" } },
            { id: 21, mod: "Módulo 2: Ventanas", title: "Ejercicio 21: Sacudir para despejar", text: "Tome la barra superior de la ventana activa y sacúdala suavemente para ocultar las demás.", hint: "Mantenga presionado el título arriba y mueva el ratón a los lados.", ok: "¡Fondo despejado sin distracciones!", trigger: { type: "drag", target: "window-header" } },
            { id: 22, mod: "Módulo 2: Ventanas", title: "Ejercicio 22: Apilar como cartas", text: "Ordene las ventanas abiertas en modo <strong>Cascada</strong> para ver sus títulos escalonados.", hint: "Haga clic derecho en la barra negra de abajo y elija 'Cascada'.", ok: "¡Documentos apilados prolijamente!", trigger: { type: "contextmenu", target: "taskbar" } },
            { id: 23, mod: "Módulo 2: Ventanas", title: "Ejercicio 23: Repartir en bloques", text: "Organice sus documentos en forma de mosaico para comparar datos fácilmente.", hint: "Seleccione 'Mostrar ventanas en paralelo'.", ok: "¡Mosaico de pantallas configurado!", trigger: { type: "contextmenu", target: "taskbar" } },
            { id: 24, mod: "Módulo 2: Ventanas", title: "Ejercicio 24: Dejar atajo abajo", text: "Fije el icono del <strong>Correo</strong> en la <strong>Barra de Tareas</strong> <span class='clarification'>(franja negra)</span>.", hint: "Toque con el botón derecho sobre el icono y elija 'Anclar'.", ok: "¡Atajo listo para usar siempre abajo!", trigger: { type: "contextmenu", target: "icon-mail" } },
            { id: 25, mod: "Módulo 2: Ventanas", title: "Ejercicio 25: Cerrar programa con la cruz", text: "Toque la cruz roja <strong>[X]</strong> ubicada arriba a la derecha para cerrar el trabajo.", hint: "Está en la esquina superior derecha absoluta.", ok: "¡Programa cerrado correctamente!", trigger: { type: "click", target: "btn-close" } },
            { id: 26, mod: "Módulo 2: Ventanas", title: "Ejercicio 26: Reordenar la barra inferior", text: "Mueva el icono de un programa hacia la izquierda dentro de la franja negra inferior.", hint: "Arrastre el gráfico horizontalmente sin soltar.", ok: "¡Icono reubicado a su gusto!", trigger: { type: "drag", target: "taskbar" } },
            { id: 27, mod: "Módulo 2: Ventanas", title: "Ejercicio 27: Rincón de limpieza", text: "Toque el último rincón derecho de la barra negra para ocultar todo de golpe.", hint: "Apunte al extremo inferior derecho junto a la hora.", ok: "¡Escritorio despejado completamente!", trigger: { type: "click", target: "btn-showdesktop" } },

            // MÓDULO 3: ARCHIVOS Y CARPETAS (28-41)
            { id: 28, mod: "Módulo 3: Archivos", title: "Ejercicio 28: Abrir explorador de carpetas", text: "Haga doble clic en el icono <strong>Este equipo</strong> para ver sus documentos almacenados.", hint: "El icono está en la parte izquierda del escritorio.", ok: "¡Carpeta principal abierta con éxito!", trigger: { type: "dblclick", target: "icon-computer" } },
            { id: 29, mod: "Módulo 3: Archivos", title: "Ejercicio 29: Crear una carpeta nueva", text: "Cree un cajón digital nuevo <span class='clarification'>(Carpeta)</span> para organizar sus fotos familiares.", hint: "Haga clic derecho en un lugar vacío y elija Nuevo -> Carpeta.", ok: "¡Carpeta nueva creada prolijamente!", trigger: { type: "create-folder", target: "desktop" } },
            { id: 30, mod: "Módulo 3: Archivos", title: "Ejercicio 30: Cambiar nombre a carpeta", text: "Renombre la carpeta creada poniéndole como título <strong>Mis Recetas</strong>.", hint: "Haga clic derecho sobre la carpeta y seleccione 'Cambiar nombre'.", ok: "¡Nombre actualizado correctamente!", trigger: { type: "input", target: "winEditor" } },
            { id: 31, mod: "Módulo 3: Archivos", title: "Ejercicio 31: Mover archivo a una carpeta", text: "Arrastre un documento guardado dentro de la carpeta <strong>Mis Recetas</strong>.", hint: "Presione sobre el archivo y llévelo encima de la carpeta.", ok: "¡Archivo guardado en su lugar!", trigger: { type: "drag", target: "desktop-icon" } },
            { id: 32, mod: "Módulo 3: Archivos", title: "Ejercicio 32: Duplicar una foto (Copiar)", text: "Haga una copia de una foto para guardarla en otra carpeta sin borrar la original.", hint: "Use la opción Copiar y luego Pegar en la carpeta nueva.", ok: "¡Foto duplicada con éxito!", trigger: { type: "contextmenu", target: "desktop" } },
            { id: 33, mod: "Módulo 3: Archivos", title: "Ejercicio 33: Seleccionar varios archivos", text: "Marque tres documentos a la vez trazando un recuadro con el ratón.", hint: "Haga clic en un espacio blanco y arrastre abarcando los tres archivos.", ok: "¡Tres archivos marcados juntos!", trigger: { type: "drag", target: "desktop" } },
            { id: 34, mod: "Módulo 3: Archivos", title: "Ejercicio 34: Tirar archivo no deseado", text: "Envíe un borrador viejo a la <strong>Papelera de Reciclaje</strong> <span class='clarification'>(el tacho de basura)</span>.", hint: "Haga clic derecho sobre el archivo y elija 'Eliminar'.", ok: "¡Documento enviado a la papelera!", trigger: { type: "drag", target: "icon-trash" } },
            { id: 35, mod: "Módulo 3: Archivos", title: "Ejercicio 35: Abrir la Papelera", text: "Abra la <strong>Papelera de Reciclaje</strong> para revisar los elementos tirados.", hint: "Busque el icono del tacho de basura en el escritorio.", ok: "¡Papelera abierta correctamente!", trigger: { type: "dblclick", target: "icon-trash" } },
            { id: 36, mod: "Módulo 3: Archivos", title: "Ejercicio 36: Recuperar archivo borrado", text: "Restaure un documento borrado por error para devolverlo a su lugar de origen.", hint: "Haga clic derecho en el archivo dentro de la papelera y elija 'Restaurar'.", ok: "¡Archivo rescatado y devuelto a su lugar!", trigger: { type: "click", target: "btn-restore" } },
            { id: 37, mod: "Módulo 3: Archivos", title: "Ejercicio 37: Vaciar la papelera", text: "Limpie definitivamente el tacho de basura para recuperar espacio en el equipo.", hint: "Haga clic derecho sobre el tacho y elija 'Vaciar papelera'.", ok: "¡Papelera vaciada completamente!", trigger: { type: "contextmenu", target: "icon-trash" } },
            { id: 38, mod: "Módulo 3: Archivos", title: "Ejercicio 38: Buscar un documento perdido", text: "Escriba 'Carta' en la casilla de búsqueda para encontrar un escrito rápidamente.", hint: "Use la lupa del explorador arriba a la derecha.", ok: "¡Documento encontrado al instante!", trigger: { type: "input", target: "search-input" } },
            { id: 39, mod: "Módulo 3: Archivos", title: "Ejercicio 39: Ordenar archivos por fecha", text: "Ordene sus fotos para ver primero las que guardó recientemente.", hint: "Haga clic en el encabezado 'Fecha de modificación'.", ok: "¡Archivos ordenados cronológicamente!", trigger: { type: "click", target: "menu-sort" } },
            { id: 40, mod: "Módulo 3: Archivos", title: "Ejercicio 40: Cambiar a vista de fotos grandes", text: "Cambie la vista para ver sus fotos en miniaturas grandes y claras.", hint: "Vaya al menú 'Vista' y elija 'Iconos muy grandes'.", ok: "¡Miniaturas ampliadas para ver bien!", trigger: { type: "click", target: "menu-view" } },
            { id: 41, mod: "Módulo 3: Archivos", title: "Ejercicio 41: Copiar archivos a pendrive", text: "Envíe una copia de sus documentos hacia la memoria externa <span class='clarification'>(Pendrive USB)</span>.", hint: "Haga clic derecho -> Enviar a -> Unidad USB.", ok: "¡Copia enviada al pendrive!", trigger: { type: "contextmenu", target: "desktop" } },

            // MÓDULO 4: WORDPAD / ESCRITURA (42-54)
            { id: 42, mod: "Módulo 4: WordPad", title: "Ejercicio 42: Abrir hoja de texto", text: "Abra el programa <strong>WordPad</strong> para comenzar una hoja de escritura limpia.", hint: "Toque el icono azul con la letra W en el escritorio.", ok: "¡Hoja blanca lista para escribir!", trigger: { type: "dblclick", target: "icon-wordpad" } },
            { id: 43, mod: "Módulo 4: WordPad", title: "Ejercicio 43: Escribir en mayúsculas", text: "Escriba el título 'MEMORIAS DE VIDA' completamente en letras mayúsculas.", hint: "Active la tecla Bloq Mayús antes de escribir.", ok: "¡Título ingresado en mayúsculas!", trigger: { type: "input", target: "winEditor" } },
            { id: 44, mod: "Módulo 4: WordPad", title: "Ejercicio 44: Cambiar modelo de letra", text: "Seleccione el texto y cambie el tipo de letra a <strong>Arial</strong> para leer con más claridad.", hint: "Use el menú desplegable de fuentes arriba a la izquierda.", ok: "¡Tipo de letra cambiado a Arial!", trigger: { type: "click", target: "btn-font" } },
            { id: 45, mod: "Módulo 4: WordPad", title: "Ejercicio 45: Agrandar el tamaño del texto", text: "Aumente el tamaño de la letra a número 18 para verla más grande.", hint: "Seleccione el número de tamaño junto al modelo de letra.", ok: "¡Tamaño de letra agrandado a 18!", trigger: { type: "click", target: "btn-size" } },
            { id: 46, mod: "Módulo 4: WordPad", title: "Ejercicio 46: Resaltar en Negrita", text: "Aplique el estilo <strong>Negrita [N]</strong> al título para darle mayor fuerza visual.", hint: "Presione la letra N ubicada en la barra de herramientas.", ok: "¡Texto destacado en negrita!", trigger: { type: "click", target: "btn-bold" } },
            { id: 47, mod: "Módulo 4: WordPad", title: "Ejercicio 47: Subrayar palabra importante", text: "Subraye la fecha principal de su escrito utilizando la opción <strong>[S]</strong>.", hint: "Seleccione la fecha y toque el botón con la S subrayada.", ok: "¡Palabra subrayada correctamente!", trigger: { type: "click", target: "btn-underline" } },
            { id: 48, mod: "Módulo 4: WordPad", title: "Ejercicio 48: Cambiar el color de la letra", text: "Pinte el texto con color azul oscuro.", hint: "Toque el botón con la letra A que tiene una barra de color debajo.", ok: "¡Color de texto aplicado!", trigger: { type: "click", target: "btn-color" } },
            { id: 49, mod: "Módulo 4: WordPad", title: "Ejercicio 49: Centrar un título", text: "Alinee el título justo en el centro del ancho de la hoja.", hint: "Presione el botón de alineación central con rayitas en el medio.", ok: "¡Título centrado en la hoja!", trigger: { type: "click", target: "btn-center" } },
            { id: 50, mod: "Módulo 4: WordPad", title: "Ejercicio 50: Guardar el escrito en el equipo", text: "Guarde su carta en la computadora poniéndole de nombre 'Carta Personal'.", hint: "Haga clic en el disco azul o en Archivo -> Guardar como.", ok: "¡Documento guardado a salvo!", trigger: { type: "click", target: "btn-save" } },
            { id: 51, mod: "Módulo 4: WordPad", title: "Ejercicio 51: Abrir carta guardada", text: "Abra desde la memoria del equipo su archivo 'Carta Personal' para continuar escribiendo.", hint: "Menú Archivo -> Abrir -> Buscar Carta Personal.", ok: "¡Carta abierta para seguir trabajando!", trigger: { type: "click", target: "btn-open" } },
            { id: 52, mod: "Módulo 4: WordPad", title: "Ejercicio 52: Insertar una imagen", text: "Agregue una fotografía ilustrativa debajo del texto de su escrito.", hint: "Toque el botón 'Insertar imagen' en la barra superior.", ok: "¡Foto insertada dentro del documento!", trigger: { type: "click", target: "btn-img" } },
            { id: 53, mod: "Módulo 4: WordPad", title: "Ejercicio 53: Mandar a imprimir", text: "Configure la vista previa para imprimir su escrito en papel.", hint: "Menú Archivo -> Imprimir -> Vista previa.", ok: "¡Documento enviado a la impresora!", trigger: { type: "click", target: "btn-print" } },
            { id: 54, mod: "Módulo 4: WordPad", title: "Ejercicio 54: Cerrar guardando cambios", text: "Cierre el programa de escritura asegurándose de guardar los últimos retoque.", hint: "Toque la cruz y elija 'Guardar' si el sistema le consulta.", ok: "¡Cambios guardados y programa cerrado!", trigger: { type: "click", target: "btn-close" } },

            // MÓDULO 5: FACTURADOR / PLANILLAS (55-69)
            { id: 55, mod: "Módulo 5: Facturador", title: "Ejercicio 55: Abrir planilla de cuentas", text: "Abra el programa <strong>Facturador</strong> <span class='clarification'>(icono verde de gastos)</span>.", hint: "Haga doble clic en el icono verde con el signo $.", ok: "¡Planilla de cuentas abierta!", trigger: { type: "dblclick", target: "icon-facturador" } },
            { id: 56, mod: "Módulo 5: Facturador", title: "Ejercicio 56: Marcar un casillero", text: "Haga clic en el primer casillero de la tabla <span class='clarification'>(Celda)</span> para empezar.", hint: "Toque con el ratón el recuadro superior izquierdo.", ok: "¡Casillero marcado correctamente!", trigger: { type: "click", target: "cell-1" } },
            { id: 57, mod: "Módulo 5: Facturador", title: "Ejercicio 57: Anotar un gasto", text: "Escriba la palabra 'Luz' en el casillero de concepto de gastos.", hint: "Escriba con el teclado directo en el casillero seleccionado.", ok: "¡Concepto ingresado correctamente!", trigger: { type: "input", target: "cell-1" } },
            { id: 58, mod: "Módulo 5: Facturador", title: "Ejercicio 58: Anotar importe numérico", text: "Ingrese el valor numérico correspondiente al importe de la factura.", hint: "Use el teclado numérico a la derecha del teclado.", ok: "¡Importe registrado en la planilla!", trigger: { type: "input", target: "cell-2" } },
            { id: 59, mod: "Módulo 5: Facturador", title: "Ejercicio 59: Suma automática", text: "Sume dos gastos anotados presionando el botón de <strong>Autosuma [Σ]</strong>.", hint: "Busque el icono que parece una letra E mayúscula elegante.", ok: "¡Cálculo de suma realizado al instante!", trigger: { type: "click", target: "btn-sum" } },
            { id: 60, mod: "Módulo 5: Facturador", title: "Ejercicio 60: Copiar fórmula de suma", text: "Estire la fórmula de la suma para que calcule el total de todo el mes.", hint: "Arrastre el cuadradito verde en la esquina de la celda.", ok: "¡Fórmula copiada a las demás filas!", trigger: { type: "click", target: "btn-sum" } },
            { id: 61, mod: "Módulo 5: Facturador", title: "Ejercicio 61: Formato signo pesos ($)", text: "Agregue el signo pesos ($) y los centavos a sus números anotados.", hint: "Seleccione los números y toque el icono con el billete o $.", ok: "¡Números formateados en moneda!", trigger: { type: "click", target: "btn-currency" } },
            { id: 62, mod: "Módulo 5: Facturador", title: "Ejercicio 62: Borrar valor equivocado", text: "Limpie el contenido de un casillero que contiene un error sin borrar el recuadro.", hint: "Toque la celda y presione la tecla Suprimir (Supr).", ok: "¡Casillero limpiado para corregir!", trigger: { type: "keydown", target: "delete" } },
            { id: 63, mod: "Módulo 5: Facturador", title: "Ejercicio 63: Insertar renglón nuevo", text: "Agregue un renglón nuevo entre dos gastos para anotar un servicio olvidado.", hint: "Clic derecho en el número de fila -> Insertar.", ok: "¡Renglón nuevo agregado en la tabla!", trigger: { type: "contextmenu", target: "desktop" } },
            { id: 64, mod: "Módulo 5: Facturador", title: "Ejercicio 64: Anchar columna", text: "Agrande el ancho de la columna para que el texto largo entre sin cortarse.", hint: "Arrastre la línea que separa las letras de las columnas arriba.", ok: "¡Ancho de columna adaptado!", trigger: { type: "drag", target: "window-header" } },
            { id: 65, mod: "Módulo 5: Facturador", title: "Ejercicio 65: Pintar celda de color", text: "Pinte de color amarillo el casillero del total final para distinguirlo bien.", hint: "Use el icono del balde de pintura en la barra de herramientas.", ok: "¡Casillero destacado con color!", trigger: { type: "click", target: "btn-colorfill" } },
            { id: 66, mod: "Módulo 5: Facturador", title: "Ejercicio 66: Poner bordes a la tabla", text: "Dibuje líneas negras alrededor de todos sus casilleros para armar una planilla prolija.", hint: "Seleccione la tabla y elija 'Todos los bordes'.", ok: "¡Líneas de tabla marcadas con claridad!", trigger: { type: "click", target: "btn-borders" } },
            { id: 67, mod: "Módulo 5: Facturador", title: "Ejercicio 67: Ordenar gastos de mayor a menor", text: "Reordene la lista para ver arriba de todo el gasto más caro del mes.", hint: "Menú Datos -> Ordenar de Z a A (Mayor a Menor).", ok: "¡Gastos ordenados según importe!", trigger: { type: "click", target: "menu-sort" } },
            { id: 68, mod: "Módulo 5: Facturador", title: "Ejercicio 68: Guardar la planilla de gastos", text: "Guarde la planilla en la computadora con el nombre 'Gastos Mensuales'.", hint: "Archivo -> Guardar como -> Gastos Mensuales.", ok: "¡Planilla guardada a salvo!", trigger: { type: "click", target: "btn-save" } },
            { id: 69, mod: "Módulo 5: Facturador", title: "Ejercicio 69: Imprimir resumen de gastos", text: "Prepare e imprima su resumen de cuentas para tenerlo guardado en papel.", hint: "Seleccione área de impresión y toque Imprimir.", ok: "¡Resumen enviado a la impresora!", trigger: { type: "click", target: "btn-print" } },

            // MÓDULO 6: CORREO ELECTRÓNICO (70-81)
            { id: 70, mod: "Módulo 6: Correo", title: "Ejercicio 70: Abrir el correo electrónico", text: "Toque el icono naranja <strong>Correo</strong> <span class='clarification'>(el sobrecito)</span> para ver sus mensajes.", hint: "Haga clic en el acceso directo del correo en la izquierda.", ok: "¡Bandeja de entrada abierta!", trigger: { type: "click", target: "icon-mail" } },
            { id: 71, mod: "Módulo 6: Correo", title: "Ejercicio 71: Leer mensaje nuevo", text: "Haga clic sobre un correo sin abrir para leer su contenido completo en pantalla.", hint: "Toque el mensaje en la lista de la izquierda.", ok: "¡Mensaje abierto y listo para leer!", trigger: { type: "click", target: "icon-mail" } },
            { id: 72, mod: "Módulo 6: Correo", title: "Ejercicio 72: Redactar mensaje nuevo", text: "Toque el botón <strong>Correo nuevo [+]</strong> para escribir una carta a un familiar.", hint: "Es el botón azul en la parte superior izquierda.", ok: "¡Hoja de correo nuevo desplegada!", trigger: { type: "click", target: "btn-open" } },
            { id: 73, mod: "Módulo 6: Correo", title: "Ejercicio 73: Escribir destinatario", text: "Ingrese la casilla de destino en el campo <strong>Para:</strong>.", hint: "Escriba la dirección de correo asegurándose de incluir el @.", ok: "¡Dirección de destino anotada!", trigger: { type: "input", target: "winEditor" } },
            { id: 74, mod: "Módulo 6: Correo", title: "Ejercicio 74: Anotar el Asunto", text: "Escriba 'Saludos y Fotos' en la casilla <strong>Asunto</strong> para que sepan de qué trata.", hint: "El asunto es el título breve del correo.", ok: "¡Asunto anotado correctamente!", trigger: { type: "input", target: "winEditor" } },
            { id: 75, mod: "Módulo 6: Correo", title: "Ejercicio 75: Adjuntar una foto", text: "Toque el ganchito clip <strong>[Adjuntar]</strong> para agregar una foto al mensaje.", hint: "Busque el icono del ganchito de abrochar papeles.", ok: "¡Fotografía enganchada al correo!", trigger: { type: "click", target: "btn-img" } },
            { id: 76, mod: "Módulo 6: Correo", title: "Ejercicio 76: Enviar el correo", text: "Presione el botón azul <strong>Enviar</strong> para despachar su mensaje por internet.", hint: "Toque el botón con la forma de un avioncito de papel o 'Enviar'.", ok: "¡Correo enviado con éxito!", trigger: { type: "click", target: "btn-save" } },
            { id: 77, mod: "Módulo 6: Correo", title: "Ejercicio 77: Responder un mensaje", text: "Toque la flecha de <strong>Responder</strong> para contestar un correo recibido.", hint: "La flechita apuntando a la izquierda sirve para responder.", ok: "¡Respuesta iniciada correctamente!", trigger: { type: "click", target: "btn-open" } },
            { id: 78, mod: "Módulo 6: Correo", title: "Ejercicio 78: Reenviar a otra persona", text: "Pase un correo interesante que recibió a otra persona utilizando <strong>Reenviar</strong>.", hint: "Toque la flechita que apunta hacia la derecha.", ok: "¡Correo listo para compartir!", trigger: { type: "click", target: "btn-open" } },
            { id: 79, mod: "Módulo 6: Correo", title: "Ejercicio 79: Borrar mensaje no deseado", text: "Elimine una publicidad no deseada enviándola al tacho de basura del correo.", hint: "Toque el icono del tachito de basura junto al correo.", ok: "¡Correo molesto eliminado!", trigger: { type: "drag", target: "icon-trash" } },
            { id: 80, mod: "Módulo 6: Correo", title: "Ejercicio 80: Buscar un correo viejo", text: "Busque un correo antiguo escribiendo el nombre del remitente en la lupa.", hint: "Escriba el nombre en la barra de búsqueda arriba.", ok: "¡Correo antiguo ubicado en la lista!", trigger: { type: "input", target: "search-input" } },
            { id: 81, mod: "Módulo 6: Correo", title: "Ejercicio 81: Organizar en carpetas", text: "Cree una carpeta llamada <strong>Familia</strong> para archivar allí sus mensajes guardados.", hint: "Opciones de carpetas -> Crear carpeta nueva.", ok: "¡Mensaje archivado en su carpeta!", trigger: { type: "create-folder", target: "desktop" } },

            // MÓDULO 7: CONFIGURACIÓN Y SISTEMA (82-97)
            { id: 82, mod: "Módulo 7: Sistema", title: "Ejercicio 82: Abrir el Menú Inicio", text: "Toque la ventanita blanca ubicada en la esquina inferior izquierda <span class='clarification'>(Botón de Inicio)</span>.", hint: "Está en el primer rincón de la franja negra abajo.", ok: "¡Menú Inicio abierto con todas sus opciones!", trigger: { type: "click", target: "btn-start-menu" } },
            { id: 83, mod: "Módulo 7: Sistema", title: "Ejercicio 83: Subir o bajar el sonido", text: "Ajuste el nivel del volumen tocando el altavoz junto a la hora abajo a la derecha.", hint: "Haga clic en el parlante y mueva la barra deslizante.", ok: "¡Volumen ajustado correctamente!", trigger: { type: "click", target: "btn-volume" } },
            { id: 84, mod: "Módulo 7: Sistema", title: "Ejercicio 84: Conectarse a Wi-Fi", text: "Abra las conexiones de internet inalámbrico <span class='clarification'>(Wi-Fi)</span> para revisar la señal.", hint: "Toque el icono con forma de ondas de radio abajo a la derecha.", ok: "¡Red Wi-Fi revisada y conectada!", trigger: { type: "click", target: "btn-wifi" } },
            { id: 85, mod: "Módulo 7: Sistema", title: "Ejercicio 85: Regular brillo de pantalla", text: "Suba o baje la claridad de la pantalla para descansar la vista.", hint: "Ajuste la barra de brillo dentro del panel de avisos.", ok: "¡Brillo de pantalla ajustado a su gusto!", trigger: { type: "click", target: "clock" } },
            { id: 86, mod: "Módulo 7: Sistema", title: "Ejercicio 86: Cambiar fondo de pantalla", text: "Elija una imagen nueva para decorar la pantalla principal del equipo.", hint: "Clic derecho en el escritorio -> Personalizar -> Fondo.", ok: "¡Fondo de pantalla renovado!", trigger: { type: "contextmenu", target: "desktop" } },
            { id: 87, mod: "Módulo 7: Sistema", title: "Ejercicio 87: Consultar el calendario", text: "Toque la fecha y hora en el rincón inferior derecho para ver el almanaque completo.", hint: "Haga clic directo donde muestra la hora.", ok: "¡Almanaque desplegado en pantalla!", trigger: { type: "click", target: "clock" } },
            { id: 88, mod: "Módulo 7: Sistema", title: "Ejercicio 88: Ver carga de batería", text: "Revise cuánta carga le queda a la batería de la computadora portátil.", hint: "Pase el puntero sobre la pilita en la franja negra abajo.", ok: "¡Carga de batería verificada!", trigger: { type: "mousemove", target: "system-tray" } },
            { id: 89, mod: "Módulo 7: Sistema", title: "Ejercicio 89: Revisar espacio disponible", text: "Compruebe cuánto espacio libre le queda al disco para seguir guardando fotos.", hint: "Abra 'Este equipo' para consultar la barra de espacio.", ok: "¡Espacio de almacenamiento verificado!", trigger: { type: "dblclick", target: "icon-computer" } },
            { id: 90, mod: "Módulo 7: Sistema", title: "Ejercicio 90: Cambiar idioma de teclado", text: "Asegúrese de que el idioma del teclado esté configurado en <strong>ESP (Español)</strong>.", hint: "Verifique las tres letras ESP junto a la hora.", ok: "¡Teclado configurado en Español!", trigger: { type: "click", target: "btn-lang" } },
            { id: 91, mod: "Módulo 7: Sistema", title: "Ejercicio 91: Activar Luz Nocturna", text: "Encienda la luz cálida para leer en entornos oscuros sin cansar los ojos.", hint: "Toque el botón 'Luz nocturna' en los avisos.", ok: "¡Luz nocturna suave activada!", trigger: { type: "click", target: "clock" } },
            { id: 92, mod: "Módulo 7: Sistema", title: "Ejercicio 92: Buscar actualizaciones", text: "Revise si el sistema tiene mejoras de seguridad pendientes <span class='clarification'>(Windows Update)</span>.", hint: "Configuración -> Actualización y seguridad.", ok: "¡Sistema actualizado y protegido!", trigger: { type: "click", target: "btn-start-menu" } },
            { id: 93, mod: "Módulo 7: Sistema", title: "Ejercicio 93: Conectar auriculares Bluetooth", text: "Abra la lista de dispositivos inalámbricos para conectar sus auriculares sin cables.", hint: "Configuración -> Dispositivos -> Bluetooth.", ok: "¡Auriculares vinculados por Bluetooth!", trigger: { type: "click", target: "btn-start-menu" } },
            { id: 94, mod: "Módulo 7: Sistema", title: "Ejercicio 94: Revisar la seguridad del equipo", text: "Compruebe que el escudo de protección <span class='clarification'>(Antivirus)</span> esté activo y verde.", hint: "Busque el escudito blanco en el rincón inferior derecho.", ok: "¡Seguridad del equipo bajo control!", trigger: { type: "click", target: "system-tray" } },
            { id: 95, mod: "Módulo 7: Sistema", title: "Ejercicio 95: Agrandar las letras del sistema", text: "Aumente el porcentaje de tamaño de las letras generales de la computadora.", hint: "Configuración -> Accesibilidad -> Tamaño de texto.", ok: "¡Letras generales del equipo agrandadas!", trigger: { type: "click", target: "btn-start-menu" } },
            { id: 96, mod: "Módulo 7: Sistema", title: "Ejercicio 96: Bloquear pantalla por seguridad", text: "Bloquee la sesión al levantarse de la mesa presionando la tecla Windows + L.", hint: "Mantenga la tecla con la ventanita y toque la L.", ok: "¡Pantalla bloqueada a salvo de miradas!", trigger: { type: "keydown", target: "winl" } },
            { id: 97, mod: "Módulo 7: Sistema", title: "Ejercicio 97: Apagar la computadora", text: "Seleccione la opción correcta para apagar la máquina prolijamente sin desenchufar.", hint: "Inicio -> Apagar/Encender -> Apagar.", ok: "¡Procedimiento de apagado iniciado correctamente!", trigger: { type: "click", target: "btn-start-menu" } },

            // MÓDULO 8: INTEGRACIÓN Y REPASO FINAL (98-100)
            { id: 98, mod: "Módulo 8: Integración", title: "Ejercicio 98: Repaso 1 - Carta completa", text: "Abra WordPad, escriba una nota, agrande el texto, póngalo en azul y guárdelo en su carpeta.", hint: "Combine los pasos de los Módulos 3 y 4 aprendidos.", ok: "¡Repaso 1 completado con destreza!", trigger: { type: "dblclick", target: "icon-wordpad" } },
            { id: 99, mod: "Módulo 8: Integración", title: "Ejercicio 99: Repaso 2 - Enviar trabajo", text: "Abra el Correo, adjunte el escrito recién guardado y envíelo a un familiar.", hint: "Combine la función de adjuntar con la bandeja de salida del Módulo 6.", ok: "¡Repaso 2 logrado con éxito total!", trigger: { type: "click", target: "icon-mail" } },
            { id: 100, mod: "Módulo 8: Integración", title: "Ejercicio 100: Graduación Digital", text: "Organice sus dos ventanas abiertas lado a lado, limpie el escritorio y prepare el apagado.", hint: "¡Demuestre todo el dominio adquirido en este curso de 100 pasos!", ok: "¡FELICITACIONES! Ha completado los 100 ejercicios de Capacitación Digital.", trigger: { type: "click", target: "btn-close" } }
        ];

        let currentExId = 1;

        // INICIALIZACIÓN Y NAVEGACIÓN
        function initDropdown() {
            const selector = document.getElementById("exerciseSelector");
            selector.innerHTML = "";
            exercises.forEach((ex) => {
                const option = document.createElement("option");
                option.value = ex.id;
                option.textContent = `${ex.id}. ${ex.title}`;
                selector.appendChild(option);
            });

            selector.addEventListener("change", (e) => {
                loadExercise(parseInt(e.target.value, 10));
            });

            loadExercise(currentExId);
        }

        function loadExercise(id) {
            const exercise = exercises.find((ex) => ex.id === id) || exercises[0];
            currentExId = exercise.id;

            document.getElementById("exerciseSelector").value = currentExId;
            document.getElementById("exerciseModule").innerText = exercise.mod;
            document.getElementById("exerciseTitle").innerText = exercise.title;
            document.getElementById("exerciseText").innerHTML = exercise.text;
            document.getElementById("exerciseHint").innerText = "💡 Pista: " + exercise.hint;
            
            const okEl = document.getElementById("exerciseOk");
            okEl.innerText = exercise.ok;
            okEl.classList.add("hidden");

            document.getElementById("prevBtn").disabled = (currentExId === 1);
            document.getElementById("nextBtn").disabled = (currentExId === exercises[exercises.length - 1].id);

            // Ajuste visual según la app requerida por el ejercicio
            if (exercise.mod.includes("Facturador")) {
                document.getElementById('winEditor').classList.add('hidden');
                document.getElementById('facturadorGrid').classList.remove('hidden');
                document.getElementById('search-input').classList.add('hidden');
            } else if (exercise.id === 38 || exercise.id === 80) {
                document.getElementById('search-input').classList.remove('hidden');
                document.getElementById('winEditor').classList.add('hidden');
                document.getElementById('facturadorGrid').classList.add('hidden');
            } else {
                document.getElementById('winEditor').classList.remove('hidden');
                document.getElementById('facturadorGrid').classList.add('hidden');
                document.getElementById('search-input').classList.add('hidden');
            }
        }

        function nextExercise() {
            const currentIndex = exercises.findIndex(ex => ex.id === currentExId);
            if (currentIndex < exercises.length - 1) {
                loadExercise(exercises[currentIndex + 1].id);
            }
        }

        function prevExercise() {
            const currentIndex = exercises.findIndex(ex => ex.id === currentExId);
            if (currentIndex > 0) {
                loadExercise(exercises[currentIndex - 1].id);
            }
        }

        function completeExercise() {
            const okEl = document.getElementById("exerciseOk");
            if (okEl) okEl.classList.remove("hidden");
        }

        // MOTOR GENERAL DE ACCIONES INTERACTIVAS
        function triggerAction(type, targetId) {
            const currentEx = exercises.find(ex => ex.id === currentExId);
            
            if (type === 'click' && targetId !== 'desktop') {
                document.getElementById('contextMenu').classList.add('hidden');
            }

            if (currentEx && currentEx.trigger) {
                const matchType = (currentEx.trigger.type === type);
                const matchTarget = (currentEx.trigger.target === targetId || currentEx.trigger.target === 'desktop');
                
                if (matchType && matchTarget) {
                    completeExercise();
                }
            }
        }

        function openWindow(title) {
            const win = document.getElementById('appWindow');
            document.getElementById('winTitle').innerText = title;
            win.classList.remove('hidden');
        }

        function closeWindow() {
            document.getElementById('appWindow').classList.add('hidden');
            triggerAction('click', 'btn-close');
        }

        function createNewFolder() {
            const folder = document.getElementById('createdFolder');
            if (folder) folder.classList.remove('hidden');
        }

        // CONTROL DE EVENTOS EN EL ENTORNO
        document.addEventListener('DOMContentLoaded', () => {
            initDropdown();

            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }, 1000);

            // Iconos del escritorio
            document.getElementById('icon-wordpad').addEventListener('dblclick', () => {
                openWindow('WordPad');
                triggerAction('dblclick', 'icon-wordpad');
            });

            document.getElementById('icon-facturador').addEventListener('dblclick', () => {
                openWindow('Facturador');
                triggerAction('dblclick', 'icon-facturador');
            });

            document.getElementById('icon-computer').addEventListener('dblclick', () => {
                openWindow('Este Equipo');
                triggerAction('dblclick', 'icon-computer');
            });

            document.getElementById('icon-trash').addEventListener('dblclick', () => {
                openWindow('Papelera de Reciclaje');
                triggerAction('dblclick', 'icon-trash');
            });

            // Menú contextual en el escritorio
            const desktop = document.getElementById('desktop');
            desktop.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const cm = document.getElementById('contextMenu');
                cm.style.top = `${e.clientY}px`;
                cm.style.left = `${e.clientX}px`;
                cm.classList.remove('hidden');
                triggerAction('contextmenu', 'desktop');
            });

            desktop.addEventListener('mousemove', () => {
                triggerAction('mousemove', 'desktop');
            });

            desktop.addEventListener('wheel', () => {
                triggerAction('wheel', 'desktop');
            });

            // Captura de combinaciones de teclado
            document.addEventListener('keydown', (e) => {
                if (e.altKey && e.key === 'Tab') {
                    triggerAction('keydown', 'alttab');
                }
                if (e.key === 'Delete') {
                    triggerAction('keydown', 'delete');
                }
                if (e.key === 'l' || e.key === 'L') {
                    triggerAction('keydown', 'winl');
                }
            });
        });
    </script>
