<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Pedagógico Completo de Windows 10 - La Eterna Juventud</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0078d7 linear-gradient(135deg, #1e5799 0%, #2989d8 50%, #207cca 51%, #7db9e8 100%);
            display: flex;
            flex-direction: column;
        }

        #desktop {
            flex: 1;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .win-window {
            width: 1100px;
            max-width: 98%;
            height: 680px;
            max-height: 95vh;
            background-color: #f0f0f0;
            border: 1px solid #005a9e;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            border-radius: 4px 4px 0 0;
        }

        .win-header {
            background-color: #ffffff;
            height: 42px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 15px;
            border-bottom: 1px solid #cccccc;
        }

        .win-title {
            font-size: 15px;
            font-weight: 600;
            color: #333333;
        }

        .win-controls {
            display: flex;
            height: 100%;
        }

        .win-btn {
            width: 45px;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-btn:hover { background-color: #e5e5e5; }
        .win-btn.close:hover { background-color: #e81123; color: white; }

        .win-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Menú de Módulos (Izquierda) */
        .sidebar {
            width: 290px;
            background-color: #e6e6e6;
            border-right: 1px solid #cccccc;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-title {
            padding: 12px 15px;
            font-size: 14px;
            font-weight: bold;
            color: #005a9e;
            background-color: #dcdcdc;
            border-bottom: 1px solid #cccccc;
        }

        .module-btn {
            padding: 12px 15px;
            border: none;
            border-bottom: 1px solid #d0d0d0;
            background: transparent;
            text-align: left;
            font-size: 14px;
            color: #222222;
            cursor: pointer;
            line-height: 1.3;
        }

        .module-btn:hover { background-color: #d5e4f1; }
        .module-btn.active { background-color: #0078d7; color: white; font-weight: bold; }

        /* Submenú de Ejercicios del Módulo (Centro) */
        .exercise-selector {
            width: 260px;
            background-color: #f7f7f7;
            border-right: 1px solid #cccccc;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .selector-header {
            padding: 12px 15px;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            background-color: #ebebeb;
            border-bottom: 1px solid #cccccc;
        }

        .item-btn {
            padding: 10px 12px;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            background: transparent;
            text-align: left;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            line-height: 1.3;
        }

        .item-btn:hover { background-color: #e3f2fd; }
        .item-btn.active { background-color: #2196f3; color: white; font-weight: bold; }

        /* Área Principal de Ejecución de Ejercicios (Derecha) */
        .content-area {
            flex: 1;
            padding: 25px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .exercise-header {
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #0078d7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-title {
            font-size: 18px;
            color: #005a9e;
        }

        .badge-counter {
            background-color: #0078d7;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .guide-text {
            font-size: 16px;
            line-height: 1.6;
            color: #222222;
            background-color: #f8f9fa;
            padding: 15px;
            border-left: 5px solid #0078d7;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
        }

        .clarification {
            color: #555555;
            font-style: italic;
            font-weight: 600;
        }

        .interaction-box {
            flex: 1;
            border: 2px dashed #0078d7;
            background-color: #f4f8fc;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            min-height: 200px;
        }

        .action-btn {
            background-color: #107c41;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .action-btn:hover { background-color: #0b5a2f; }

        /* Barra de Tareas Inferior */
        #taskbar {
            height: 48px;
            background-color: #101010;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .start-btn {
            height: 100%;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
        }

        .start-btn:hover { background-color: #333333; }
        
        .start-icon {
            width: 18px;
            height: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }

        .start-square { background-color: white; }

        .system-tray {
            color: white;
            padding: 0 15px;
            font-size: 13px;
            text-align: right;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="win-window">
            <div class="win-header">
                <span class="win-title">Sistema de Aprendizaje Windows 10 - La Eterna Juventud (100 Ejercicios Interactivos)</span>
                <div class="win-controls">
                    <button class="win-btn" title="Minimizar (Guardar abajo)">&#8211;</button>
                    <button class="win-btn" title="Maximizar (Agrandar pantalla)">&#9633;</button>
                    <button class="win-btn close" title="Cerrar ventana">&#10005;</button>
                </div>
            </div>

            <div class="win-body">
                <!-- Columna 1: Módulos del Sistema -->
                <div class="sidebar">
                    <div class="sidebar-title">Módulos (8 Unidades)</div>
                    <button class="module-btn active" onclick="selectModule(1)">Módulo 01: Panel Táctil (14)</button>
                    <button class="module-btn" onclick="selectModule(2)">Módulo 02: Ventanas (13)</button>
                    <button class="module-btn" onclick="selectModule(3)">Módulo 03: Archivos (14)</button>
                    <button class="module-btn" onclick="selectModule(4)">Módulo 04: WordPad (13)</button>
                    <button class="module-btn" onclick="selectModule(5)">Módulo 05: Facturador (15)</button>
                    <button class="module-btn" onclick="selectModule(6)">Módulo 06: Correo (12)</button>
                    <button class="module-btn" onclick="selectModule(7)">Módulo 07: Sistema (16)</button>
                    <button class="module-btn" onclick="selectModule(8)">Módulo 08: Integración (3)</button>
                </div>

                <!-- Columna 2: Lista de los 100 Ejercicios -->
                <div class="exercise-selector">
                    <div class="selector-header" id="list-header">Lista de Ejercicios</div>
                    <div id="exercise-list">
                        <!-- Generado por JavaScript -->
                    </div>
                </div>

                <!-- Columna 3: Contenido y Ejecución del Ejercicio -->
                <div class="content-area">
                    <div class="exercise-header">
                        <h2 class="exercise-title" id="ex-title">Seleccione un ejercicio</h2>
                        <span class="badge-counter" id="ex-badge">Ejercicio 1 / 100</span>
                    </div>

                    <div class="guide-text" id="ex-guide">
                        Cargando consigna...
                    </div>

                    <div class="interaction-box" id="ex-canvas">
                        <!-- Área práctica -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de tareas -->
    <div id="taskbar" title="Barra de tareas (franja negra inferior)">
        <button class="start-btn" title="Botón de Inicio (ventanita blanca en la esquina inferior izquierda)">
            <div class="start-icon">
                <div class="start-square"></div>
                <div class="start-square"></div>
                <div class="start-square"></div>
                <div class="start-square"></div>
            </div>
        </button>
        <div class="system-tray" id="clock-display">
            <!-- Hora actualizada -->
        </div>
    </div>

    <script>
        // BASE DE DATOS COMPLETA DE LOS 100 EJERCICIOS INDIVIDUALES
        const allExercises = [
            // MÓDULO 01 (1 al 14)
            { id: 1, mod: 1, name: "01. Tap y Selección Única", title: "Ejercicio 01: Selección de un Elemento", guide: "Mueva el <strong>puntero</strong> <span class='clarification'>(la flechita blanca que sigue a su mano)</span> y toque una sola vez la opción para seleccionar un archivo.", btn: "Seleccionar Archivo de Texto", ok: "¡Muy bien! Ha seleccionado el elemento correctamente." },
            { id: 2, mod: 1, name: "02. Doble Tap Táctil", title: "Ejercicio 02: Abrir con Doble Toque", guide: "Haga dos toques rápidos continuos sobre el icono para abrir la <strong>carpeta</strong> <span class='clarification'>(el dibujito de un folio amarillo)</span>.", btn: "Hacer Doble Clic para Abrir", ok: "¡Excelente! La carpeta se abrió con éxito." },

            { id: 4, mod: 1, name: "04. Arrastre de Elementos", title: "Ejercicio 04: Mover Cosas en Pantalla", guide: "Presione y desplace su dedo para arrastrar la foto desde el <strong>Escritorio</strong> <span class='clarification'>(la pantalla principal azul)</span> hacia la caja verde.", btn: "Arrastrar y Soltar Archivo", ok: "¡Muy bien! El archivo ha sido reubicado." },
            { id: 5, mod: 1, name: "05. Desplazamiento Vertical", title: "Ejercicio 05: Subir y Bajar en una Página", guide: "Use dos dedos juntos para deslizar hacia abajo en la pantalla y recorrer un documento largo.", btn: "Deslizar Página Hacia Abajo", ok: "¡Correcto! Se ha desplazado por el texto." },
            { id: 6, mod: 1, name: "06. Desplazamiento Horizontal", title: "Ejercicio 06: Recorrer Fotos de Costado", guide: "Deslice dos dedos hacia la derecha para pasar a la siguiente fotografía de su álbum.", btn: "Pasar a la Siguiente Foto", ok: "¡Estupendo! Ha avanzado a la siguiente foto." },
            { id: 7, mod: 1, name: "07. Zoom Out (Pellizco)", title: "Ejercicio 07: Achicar una Fotografía", guide: "Junte dos dedos sobre la pantalla <span class='clarification'>(como dando un pellizquito suave)</span> para alejar la vista del plano.", btn: "Achicar Imagen (Zoom Out)", ok: "¡Excelente! La imagen se redujo de tamaño." },
            { id: 8, mod: 1, name: "08. Zoom In (Ampliación)", title: "Ejercicio 08: Agrandar una Letra o Foto", guide: "Separe dos dedos sobre la imagen para hacer zoom y ver en detalle los nombres.", btn: "Agrandar Imagen (Zoom In)", ok: "¡Muy bien! La zona seleccionada se ha ampliado." },
            { id: 9, mod: 1, name: "09. Vista de Tareas", title: "Ejercicio 09: Ver Programas Abiertos", guide: "Deslice tres dedos hacia arriba para activar la <strong>Vista de Tareas</strong> <span class='clarification'>(el modo que muestra todos sus trabajos en miniatura)</span>.", btn: "Mostrar Ventanas Abiertas", ok: "¡Correcto! Ahora puede ver todo lo que tiene abierto." },
            { id: 10, mod: 1, name: "10. Mostrar Escritorio", title: "Ejercicio 10: Limpiar la Pantalla de Golpe", guide: "Deslice tres dedos hacia abajo para ocultar todas las ventanas abiertas y ver el <strong>Escritorio</strong> <span class='clarification'>(la pantalla limpia inicial)</span>.", btn: "Ocultar Todo y Ver Escritorio", ok: "¡Perfecto! Las ventanas se ocultaron abajo." },
            { id: 11, mod: 1, name: "11. Conmutación de Apps", title: "Ejercicio 11: Alternar Entre Programas", guide: "Deslice tres dedos de lado a lado para pasar del programa de lectura al diario digital.", btn: "Cambiar de Aplicación", ok: "¡Estupendo! Ha cambiado de programa con fluidez." },
            { id: 12, mod: 1, name: "12. Escritorios Virtuales", title: "Ejercicio 12: Cambiar de Mesas de Trabajo", guide: "Deslice cuatro dedos a la derecha para cambiar a un segundo <strong>Escritorio Virtual</strong> <span class='clarification'>(otra mesa limpia independiente)</span>.", btn: "Pasar al Escritorio 2", ok: "¡Muy bien! Se encuentra en el segundo espacio." },
            { id: 13, mod: 1, name: "13. Centro de Actividades", title: "Ejercicio 13: Abrir Notificaciones", guide: "Deslice un dedo desde el borde derecho hacia el centro para abrir el <strong>Centro de Actividades</strong> <span class='clarification'>(el panel donde llegan avisos)</span>.", btn: "Abrir Panel de Avisos", ok: "¡Excelente! Desplegó los avisos del sistema." },
            { id: 14, mod: 1, name: "14. Ajuste de Sensibilidad", title: "Ejercicio 14: Regular la Velocidad Táctil", guide: "Entre al menú para adaptar qué tan rápido responde el ratón táctil a su mano.", btn: "Guardar Sensibilidad Confortable", ok: "¡Ajuste guardado! El panel responderá a su ritmo." },

            // MÓDULO 02 (15 al 27)
            { id: 15, mod: 2, name: "15. Control de Ventanas", title: "Ejercicio 15: Achicar y Agrandar Pantallas", guide: "Utilice los botones de la esquina superior derecha para achicar la ventana actual.", btn: "Minimizar Ventana", ok: "¡Muy bien! La ventana se guardó en la barra inferior." },
            { id: 16, mod: 2, name: "16. Redimensionamiento", title: "Ejercicio 16: Cambiar Tamaño Manualmente", guide: "Lleve la flechita al borde de la ventana hasta que se convierta en una doble flecha y estire la esquina.", btn: "Estirar Borde de la Ventana", ok: "¡Logrado! El tamaño de la pantalla ha cambiado." },

            { id: 21, mod: 2, name: "21. Aislamiento Aero Shake", title: "Ejercicio 21: Sacudir para Despejar", guide: "Tome la ventana de arriba y sacúdala suavemente para ocultar las aplicaciones que distraen atrás.", btn: "Sacudir Ventana Principal", ok: "¡Estupendo! Todas las ventanas de atrás se ocultaron." },

            { id: 25, mod: 2, name: "25. Cierre Seguro (Alt+F4)", title: "Ejercicio 25: Cerrar una Aplicación", guide: "Oprima el botón con la cruz roja para cerrar la ventana cuando haya terminado su trabajo.", btn: "Cerrar Aplicación Actual", ok: "¡Programa cerrado de manera segura!" },
            { id: 26, mod: 2, name: "26. Reordenamiento de Barra", title: "Ejercicio 26: Mover Iconos de Abajo", guide: "Arrastre el icono del reloj más a la izquierda dentro de la franja negra inferior.", btn: "Mover Icono a la Izquierda", ok: "¡Ubicación actualizada correctamente!" },
            { id: 27, mod: 2, name: "27. Despeje Completo", title: "Ejercicio 27: Botón Rincón de Limpieza", guide: "Toque el último rincón de la derecha en la barra negra para guardar todo de un toque.", btn: "Tocar Rincón Inferior Derecho", ok: "¡Pantalla despejada al instante!" },

        let currentActiveId = 1;

        function selectModule(modNum) {
            document.querySelectorAll('.module-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.module-btn')[modNum - 1].classList.add('active');

            const filtered = allExercises.filter(ex => ex.mod === modNum);
            const listContainer = document.getElementById('exercise-list');
            listContainer.innerHTML = '';

            document.getElementById('list-header').innerText = `Módulo 0${modNum} (${filtered.length} Ejercicios)`;

            filtered.forEach((ex, idx) => {
                const item = document.createElement('button');
                item.className = `item-btn ${ex.id === currentActiveId ? 'active' : ''}`;
                item.innerText = ex.name;
                item.onclick = () => loadExercise(ex.id);
                listContainer.appendChild(item);
            });

            if (filtered.length > 0) {
                loadExercise(filtered[0].id);
            }
        }

        function loadExercise(exId) {
            currentActiveId = exId;
            const ex = allExercises.find(e => e.id === exId);

            document.querySelectorAll('.item-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(ex.name)) {
                    btn.classList.add('active');
                }
            });

            document.getElementById('ex-title').innerText = ex.title;
            document.getElementById('ex-badge').innerText = `Ejercicio ${ex.id} / 100`;
            document.getElementById('ex-guide').innerHTML = ex.guide;

            document.getElementById('ex-canvas').innerHTML = `
                <button class="action-btn" onclick="completeStep('${ex.ok}')">${ex.btn}</button>
            `;
        }

        function completeStep(okMsg) {
            document.getElementById('ex-canvas').innerHTML = `
                <div style="color: #107c41; font-size: 18px; font-weight: bold; margin-bottom: 12px;">&#10004; ${okMsg}</div>
                <p style="font-size: 14px; color: #555;">¡Paso realizado correctamente! Puede elegir el siguiente ejercicio en la lista del centro.</p>
            `;
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = now.toLocaleDateString();
            document.getElementById('clock-display').innerHTML = `<div>${timeStr}</div><div style="font-size:11px;">${dateStr}</div>`;
        }

        setInterval(updateClock, 1000);
        updateClock();
        selectModule(1);
    </script>
