<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Windows 10 - Eterna Juventud (100 Ejercicios Completo)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* ESCRITORIO CON DEGRADADO MAGENTA */
    #desktop {
      width: 100vw;
      height: calc(100vh - 40px);
      background: radial-gradient(circle at 60% 40%, #80137a 0%, #4a0852 50%, #200028 100%);
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      padding: 16px 20px;
      position: relative;
    }

    /* COLUMNA DE ICONOS EN ORDEN NATIVO */
    .desktop-icons {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100px;
      z-index: 2;
    }

    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
      transition: transform 0.15s, filter 0.15s;
    }

    .icon-item:hover {
      transform: scale(1.06);
      filter: brightness(1.15);
    }

    .icon-box {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .icon-este-equipo { background: linear-gradient(135deg, #00a4ef, #0078d7); }
    .icon-wordpad { background: linear-gradient(135deg, #2b579a, #1b365d); }
    .icon-facturador { background: linear-gradient(135deg, #27ae60, #1e8449); }
    .icon-correo { background: linear-gradient(135deg, #e67e22, #d35400); }

    /* VENTANAS INTERACTIVAS */
    .app-window {
      position: absolute;
      top: 40px;
      left: 140px;
      width: 480px;
      height: 320px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      z-index: 5;
      border: 1px solid #ccc;
    }

    .window-header {
      background: #2c3e50;
      color: white;
      padding: 10px 14px;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-title { font-size: 14px; font-weight: bold; }

    .close-btn {
      background: #e74c3c;
      border: none;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }

    .window-body {
      padding: 18px;
      flex: 1;
      overflow-y: auto;
      color: #333;
      font-size: 14px;
    }

    /* TARJETA EXTENDIDA HASTA LA BARRA DE TAREAS */
    .exercise-card {
      width: 420px;
      height: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #555;
      font-weight: 700;
      border-bottom: 2px solid #ecefe1;
      padding-bottom: 12px;
    }

    .exercise-select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-weight: bold;
      color: #2c3e50;
    }

    .card-body {
      flex: 1;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .exercise-title {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }

    .exercise-instruction {
      font-size: 14px;
      color: #444;
      line-height: 1.45;
    }

    .interactive-area {
      background: #f8f9fa;
      border: 1px solid #dcdcdc;
      border-radius: 8px;
      padding: 14px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .email-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .trash-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .input-sim {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .feedback-message {
      min-height: 26px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 4px;
    }

    .feedback-message.success { color: #27ae60; }
    .feedback-message.error { color: #e74c3c; }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-pista { background: #3498db; color: white; flex: 1; }
    .btn-nav { background: #7f8c8d; color: white; flex: 1; }
    .btn-verificar { background: #00a4ef; color: white; width: 100%; font-size: 15px; }

    /* BARRA DE TAREAS Y MENÚ INICIO */
    #taskbar {
      width: 100vw;
      height: 40px;
      background: #11141a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: white;
      font-size: 12px;
      z-index: 20;
    }

    .start-btn {
      background: #00a4ef;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .start-menu {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 230px;
      background: #2c3e50;
      color: white;
      border-top-right-radius: 8px;
      display: none;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      box-shadow: 2px -2px 12px rgba(0,0,0,0.4);
      z-index: 25;
    }

    .start-menu-item {
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .start-menu-item:hover { background: #34495e; }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      z-index: 30;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 22px;
      border-radius: 10px;
      max-width: 360px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="desktop">
    <!-- Iconos del Escritorio -->
    <div class="desktop-icons">
      <div class="icon-item" onclick="openApp('Este equipo')">
        <div class="icon-box icon-este-equipo">💻</div>
        <span>Este equipo</span>
      </div>
      <div class="icon-item" onclick="openApp('WordPad')">
        <div class="icon-box icon-wordpad">W</div>
        <span>WordPad</span>
      </div>
      <div class="icon-item" onclick="openApp('Facturador')">
        <div class="icon-box icon-facturador">$</div>
        <span>Facturador</span>
      </div>
      <div class="icon-item" onclick="openApp('Correo')">
        <div class="icon-box icon-correo">✉️</div>
        <span>Correo</span>
      </div>
    </div>

    <!-- Ventana de Apps -->
    <div id="appWindow" class="app-window">
      <div class="window-header">
        <span id="windowTitle" class="window-title">Aplicación</span>
        <button class="close-btn" onclick="closeApp()">×</button>
      </div>
      <div id="windowBody" class="window-body">Contenido de la aplicación...</div>
    </div>

    <!-- Tarjeta Lateral de Ejercicios -->
    <div class="exercise-card">
      <div>
        <div class="card-header">
          <span>Eterna Juventud</span>
          <div>
            <span>Ir a: </span>
            <select id="exerciseSelect" class="exercise-select" onchange="jumpToExercise(this.value)"></select>
          </div>
        </div>

        <div class="card-body">
          <div id="exerciseTitle" class="exercise-title">Cargando...</div>
          <div id="exerciseInstruction" class="exercise-instruction">...</div>
          <div id="interactiveArea" class="interactive-area"></div>
          <div id="feedback" class="feedback-message"></div>
        </div>
      </div>

      <div class="card-actions">
        <div class="action-row">
          <button class="btn btn-pista" onclick="showHint()">💡 Pista</button>
          <button class="btn btn-nav" onclick="prevExercise()">Anterior</button>
          <button class="btn btn-nav" onclick="nextExercise()">Siguiente</button>
        </div>
        <button class="btn btn-verificar" onclick="verifyCurrentExercise()">Verificar Ejercicio</button>
      </div>
    </div>
  </div>

  <!-- Menú Inicio -->
  <div id="startMenu" class="start-menu">
    <div class="start-menu-item" onclick="openApp('WordPad')">📝 WordPad</div>
    <div class="start-menu-item" onclick="openApp('Facturador')">💳 Facturador</div>
    <div class="start-menu-item" onclick="openApp('Configuración')">⚙️ Configuración</div>
    <div class="start-menu-item" onclick="alert('Apagando el sistema...')">🔌 Apagar</div>
  </div>

  <!-- Barra de Tareas -->
  <div id="taskbar">
    <div class="start-btn" onclick="toggleStartMenu()">🪟 Inicio</div>
    <span id="liveClock">19:15 | 16/08/2026</span>
  </div>

  <!-- Modal Pista -->
  <div id="hintModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px; color: #2c3e50;">Pista de Ayuda</h3>
      <p id="hintText" style="color: #555; margin-bottom: 18px; font-size: 14px;"></p>
      <button class="btn btn-verificar" onclick="closeHint()">Entendido</button>
    </div>
  </div>

  <script>

    const exercises = [
      // MÓDULO 0 & 1: PRECISIÓN Y VENTANAS (1 - 15)

      { id: 6, title: "Ejercicio 6: Abrir Correo", instruction: "Accede a la aplicación Correo desde los accesos directos.", hint: "Selecciona el icono naranja con el sobre de carta.", type: "open_app", targetApp: "Correo" },
      { id: 7, title: "Ejercicio 7: Desplegar Menú Inicio", instruction: "Toca el botón de Windows en la barra inferior de tareas.", hint: "Presiona el botón azul 'Inicio' abajo a la izquierda.", type: "open_start" },
      { id: 8, title: "Ejercicio 8: Escribir nombre de cliente", instruction: "Escribe el nombre 'Carlos' en el campo interactivo.", hint: "Ingresa 'Carlos' con la primera letra en mayúscula.", type: "input_text", targetText: "Carlos" },
      { id: 9, title: "Ejercicio 9: Confirmar un monto", instruction: "Ingresa el importe '1500' en el casillero de monto.", hint: "Escribe los números 1500 sin puntos ni comas.", type: "input_text", targetText: "1500" },
      { id: 10, title: "Ejercicio 10: Borrar mensaje no deseado", instruction: "Toca la papelera para eliminar el correo no deseado.", hint: "Haz clic en el botón rojo con la papelera 🗑️.", type: "delete_mail" },

      { id: 21, title: "Ejercicio 21: Limpiar bandeja", instruction: "Elimina el mensaje marcado como publicidad.", hint: "Haz clic en el icono de la papelera roja.", type: "delete_mail" },

      { id: 97, title: "Ejercicio 97: Borrar correo borrador", instruction: "Elimina el borrador tocando la papelera.", hint: "Haz clic en 🗑️.", type: "delete_mail" },
      { id: 98, title: "Ejercicio 98: Escribir Nombre Final", instruction: "Escribe 'Capacitación Digital' en el casillero.", hint: "Tipea 'Capacitación Digital'.", type: "input_text", targetText: "Capacitación Digital" },
      { id: 99, title: "Ejercicio 99: Abrir Menú Inicio para Apagar", instruction: "Despliega el menú Inicio de Windows.", hint: "Presiona el botón Inicio abajo a la izquierda.", type: "open_start" },
      { id: 100, title: "Ejercicio 100: Evaluación Final", instruction: "Presiona el botón para finalizar con éxito la simulación de 100 ejercicios.", hint: "Toca 'Finalizar Simulación' en la tarjeta.", type: "click_button" }
    ];

    // INICIALIZAR EN EL EJERCICIO 1 (ÍNDICE 0)
    let currentIndex = 0;

    // Cargar las 100 opciones en el selector desplegable
    const selectElem = document.getElementById('exerciseSelect');
    exercises.forEach((ex, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.innerText = `Ej. ${ex.id}`;
      if (idx === currentIndex) opt.selected = true;
      selectElem.appendChild(opt);
    });

    function loadExercise(index) {
      const ex = exercises[index];
      document.getElementById('exerciseSelect').value = index;
      document.getElementById('exerciseTitle').innerText = ex.title;
      document.getElementById('exerciseInstruction').innerText = ex.instruction;

      const feedback = document.getElementById('feedback');
      feedback.innerText = ex.completed ? "✓ Ejercicio resuelto." : "";
      feedback.className = ex.completed ? "feedback-message success" : "feedback-message";

      const container = document.getElementById('interactiveArea');
      container.innerHTML = "";

      if (ex.type === "delete_mail") {
        container.innerHTML = `
          <div class="email-row" id="emailItem" style="${ex.completed ? 'opacity:0.4; text-decoration:line-through;' : ''}">
            <span>📩 Mensaje No Deseado</span>
            ${!ex.completed ? '<button class="trash-btn" onclick="executeMailDelete()">🗑️</button>' : ''}
          </div>`;
      } else if (ex.type === "click_button") {
        container.innerHTML = `
          <button class="btn btn-verificar" onclick="executeButtonClick()">${ex.id === 100 ? 'Finalizar Simulación' : 'Confirmar presencia'}</button>`;
      } else if (ex.type === "input_text") {
        container.innerHTML = `
          <input type="text" class="input-sim" id="textInput" placeholder="Escribe aquí..." oninput="checkInputText(this.value)">`;
      } else if (ex.type === "open_app") {
        container.innerHTML = `<p style="color:#666; font-size:13px; text-align:center;">Toca el icono <strong>${ex.targetApp}</strong> en el escritorio.</p>`;
      } else if (ex.type === "open_start") {
        container.innerHTML = `<p style="color:#666; font-size:13px; text-align:center;">Presiona el botón <strong>🪟 Inicio</strong> en la barra inferior.</p>`;
      } else if (ex.type === "close_window") {
        container.innerHTML = `<p style="color:#666; font-size:13px; text-align:center;">Cierra la ventana activa usando la <strong>×</strong> superior.</p>`;
      } else {
        container.innerHTML = `
          <button class="btn btn-pista" onclick="markGenericAction()">Completar acción</button>`;
      }
    }

    function executeMailDelete() {
      exercises[currentIndex].completed = true;
      loadExercise(currentIndex);
      const feedback = document.getElementById('feedback');
      feedback.className = "feedback-message success";
      feedback.innerText = "✓ Correo eliminado con éxito";
    }

    function executeButtonClick() {
      exercises[currentIndex].completed = true;
      const feedback = document.getElementById('feedback');
      feedback.className = "feedback-message success";
      feedback.innerText = "✓ Acción confirmada";
    }

    function checkInputText(val) {
      const ex = exercises[currentIndex];
      if (val.trim().toLowerCase() === ex.targetText.toLowerCase()) {
        ex.completed = true;
        const feedback = document.getElementById('feedback');
        feedback.className = "feedback-message success";
        feedback.innerText = "✓ Dato ingresado correctamente";
      }
    }

    function markGenericAction() {
      exercises[currentIndex].completed = true;
      const feedback = document.getElementById('feedback');
      feedback.className = "feedback-message success";
      feedback.innerText = "✓ Acción realizada";
    }

    function openApp(appName) {
      const win = document.getElementById('appWindow');
      document.getElementById('windowTitle').innerText = appName;
      document.getElementById('windowBody').innerHTML = `<p>Aplicación <strong>${appName}</strong> activa.</p>`;
      win.style.display = 'flex';

      const currentEx = exercises[currentIndex];
      if (currentEx.type === "open_app" && currentEx.targetApp.toLowerCase() === appName.toLowerCase()) {
        currentEx.completed = true;
        const feedback = document.getElementById('feedback');
        feedback.className = "feedback-message success";
        feedback.innerText = `✓ ${appName} abierto`;
      }
    }

    function closeApp() {
      document.getElementById('appWindow').style.display = 'none';

      const currentEx = exercises[currentIndex];
      if (currentEx.type === "close_window") {
        currentEx.completed = true;
        const feedback = document.getElementById('feedback');
        feedback.className = "feedback-message success";
        feedback.innerText = "✓ Ventana cerrada correctamente";
      }
    }

    function toggleStartMenu() {
      const menu = document.getElementById('startMenu');
      const isVisible = menu.style.display === 'flex';
      menu.style.display = isVisible ? 'none' : 'flex';

      const currentEx = exercises[currentIndex];
      if (currentEx.type === "open_start" && !isVisible) {
        currentEx.completed = true;
        const feedback = document.getElementById('feedback');
        feedback.className = "feedback-message success";
        feedback.innerText = "✓ Menú Inicio abierto";
      }
    }

    function verifyCurrentExercise() {
      const ex = exercises[currentIndex];
      const feedback = document.getElementById('feedback');

      if (ex.completed) {
        feedback.className = "feedback-message success";
        feedback.innerText = "¡Correcto! Has completado la consigna.";
      } else {
        feedback.className = "feedback-message error";
        feedback.innerText = "❌ Aún falta realizar la acción requerida.";
      }
    }

    function nextExercise() {
      if (currentIndex < exercises.length - 1) {
        currentIndex++;
        loadExercise(currentIndex);
      }
    }

    function prevExercise() {
      if (currentIndex > 0) {
        currentIndex--;
        loadExercise(currentIndex);
      }
    }

    function jumpToExercise(val) {
      currentIndex = parseInt(val);
      loadExercise(currentIndex);
    }

    function showHint() {
      document.getElementById('hintText').innerText = exercises[currentIndex].hint;
      document.getElementById('hintModal').style.display = 'flex';
    }

    function closeHint() {
      document.getElementById('hintModal').style.display = 'none';
    }

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = now.toLocaleDateString();
      document.getElementById('liveClock').innerText = `${timeStr} | ${dateStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Carga inicial del Ejercicio 1
    loadExercise(currentIndex);
  </script>
