<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitación Digital - Simulador Educativo Windows 10</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: flex;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Panel Izquierdo */
    .sidebar {
      width: 380px;
      background-color: #0b132b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
      z-index: 20;
    }
    .sidebar-header h2 {
      font-size: 1.3rem;
      color: #00b4d8;
      margin-bottom: 12px;
      text-align: center;
    }
    .control-group {
      margin-bottom: 12px;
    }
    .control-label {
      font-size: 0.78rem;
      color: #8d99ae;
      margin-bottom: 4px;
      display: block;
      font-weight: 600;
    }
    .module-select, .exercise-dropdown-select {
      width: 100%;
      padding: 9px;
      background: #1c2541;
      color: #fff;
      border: 1px solid #3a506b;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .badge-module {
      display: inline-block;
      background-color: #0077b6;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .exercise-title {
      font-size: 1rem;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .instruction-card {
      background-color: #1c2541;
      border-left: 4px solid #00b4d8;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .instruction-text {
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 10px;
      color: #e0e1dd;
      max-height: 130px;
      overflow-y: auto;
    }
    .hint-btn {
      width: 100%;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid #ffb703;
      color: #ffb703;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }
    .hint-box {
      display: none;
      background: rgba(255, 183, 3, 0.1);
      border: 1px dashed #ffb703;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.78rem;
      color: #ffb703;
      margin-bottom: 10px;
      max-height: 110px;
      overflow-y: auto;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
    }
    .btn-nav {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background-color: #00b4d8;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-nav:disabled {
      background-color: #3a506b;
      color: #8d99ae;
      cursor: not-allowed;
    }

    /* Panel Derecho: Escritorio */
    .desktop-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    }
    .desktop-workspace {
      flex: 1;
      position: relative;
      padding: 15px;
    }
    .desktop-icons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 70px;
    }
    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      cursor: pointer;
      padding: 4px 2px;
      border-radius: 4px;
      border: 1px solid transparent;
    }
    .desktop-icon:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .desktop-icon.selected {
      background-color: rgba(0, 180, 216, 0.3);
      border: 1px solid #00b4d8;
    }
    .desktop-icon svg, .desktop-icon img {
      width: 28px;
      height: 28px;
      margin-bottom: 2px;
    }

    /* Ventanas */
    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 360px;
      background-color: #f8f9fa;
      color: #333333;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: none;
      z-index: 10;
      flex-direction: column;
    }
    .window-header {
      background-color: #e9ecef;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ced4da;
    }
    .window-title {
      font-size: 0.85rem;
      color: #212529;
      font-weight: 600;
    }
    .btn-close {
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
    }
    .btn-close:hover {
      background-color: #dc3545;
      color: #ffffff;
    }
    .window-body {
      padding: 15px;
      font-size: 0.85rem;
      flex: 1;
      overflow-y: auto;
      background-color: #ffffff;
      color: #212529;
    }
    .app-form-group {
      margin-bottom: 10px;
    }
    .app-form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .app-form-control {
      width: 100%;
      padding: 6px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .app-btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .app-btn:hover {
      background: #0096c7;
    }

    /* Menú Inicio */
    .start-menu {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 260px;
      background-color: rgba(15, 23, 42, 0.96);
      border-top-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: none;
      z-index: 15;
    }
    .start-item {
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .start-item:hover {
      background-color: #00b4d8;
      color: #000;
    }

    /* Barra de Tareas */
    .taskbar {
      height: 45px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }
    .start-btn {
      background: transparent;
      border: none;
      color: #00b4d8;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }
    .start-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .taskbar-clock {
      font-size: 0.75rem;
      text-align: right;
      color: #ffffff;
    }

    /* Estilos para drag & drop en evaluación */
    .drop-zone {
      border: 2px dashed #0077b6;
      border-radius: 6px;
      padding: 10px;
      min-height: 80px;
      background: #f1f3f5;
      margin: 10px 0;
    }
    .drop-item {
      background: #0077b6;
      color: white;
      padding: 6px 12px;
      margin: 4px;
      border-radius: 4px;
      cursor: grab;
      display: inline-block;
      user-select: none;
    }
    .drop-item.dragging {
      opacity: 0.5;
    }
    .drop-zone.drag-over {
      background: #cfe2ff;
      border-color: #0d6efd;
    }
  </style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-header"><h2>Capacitación Digital</h2></div>
      <div class="control-group">
        <label class="control-label">Módulo actual:</label>
        <select id="module-select" class="module-select" onchange="changeModuleFilter(this.value)">
          <option value="all">Todos los módulos</option>
          <option value="1">Módulo 1: Panel Táctil y Gestos</option>
          <option value="2">Módulo 2: Gestión de Ventanas</option>
          <option value="3">Módulo 3: Explorador de Archivos</option>
          <option value="4">Módulo 4: Facturador Digital</option>
          <option value="5">Módulo 5: Gestión de Correo</option>
          <option value="6">Módulo 6: Evaluación General</option>
        </select>
      </div>
      <div class="control-group">
        <label class="control-label">Seleccionar Ejercicio:</label>
        <select id="exercise-dropdown-select" class="exercise-dropdown-select" onchange="selectExercise(this.value)"></select>
      </div>
      <span id="badge-module" class="badge-module">Módulo 1</span>
      <h3 id="exercise-title" class="exercise-title">Ejercicio 1</h3>
      <div class="instruction-card">📌 <span id="location-text">Ubicación inicial: Escritorio principal</span></div>
      <p id="instruction-text" class="instruction-text">Cargando consigna...</p>
      <button class="hint-btn" onclick="toggleHint()">💡 Pista: Ver paso a paso</button>
      <div id="hint-box" class="hint-box"></div>
    </div>
    <div class="nav-buttons">
      <button id="btn-prev" class="btn-nav" onclick="navigate(-1)">Anterior</button>
      <button id="btn-next" class="btn-nav" onclick="navigate(1)">Siguiente</button>
    </div>
  </aside>

  <main class="desktop-container" onclick="handleDesktopClick(event)">
    <div class="desktop-workspace">
      <div class="desktop-icons">
        <div class="desktop-icon" id="icon-este-equipo" onclick="handleIconClick(event, 'este-equipo')" ondblclick="handleIconDblClick('este-equipo')">
          <svg viewBox="0 0 48 48"><path fill="#0078d7" d="M40 8H8a4 4 0 00-4 4v20a4 4 0 004 4h14l-2 4h-4v2h16v-2h-4l-2-4h14a4 4 0 004-4V12a4 4 0 00-4-4zm0 22H8V12h32z"/></svg>
          <span>Este Equipo</span>
        </div>
        <div class="desktop-icon" id="icon-wordpad" onclick="handleIconClick(event, 'wordpad')" ondblclick="handleIconDblClick('wordpad')">
          <svg viewBox="0 0 48 48"><path fill="#2b579a" d="M6 6h28l8 8v28H6z"/><path fill="#fff" d="M14 18h20v2H14zm0 6h20v2H14zm0 6h14v2H14z"/><path fill="#19325c" d="M34 6v8h8z"/></svg>
          <span>WordPad</span>
        </div>
        <div class="desktop-icon" id="icon-facturador" onclick="handleIconClick(event, 'facturador')" ondblclick="handleIconDblClick('facturador')">
          <svg viewBox="0 0 48 48"><path fill="#107c41" d="M8 4h24l8 8v32H8z"/><path fill="#fff" d="M14 16h20v2H14zm0 6h20v2H14zm0 6h12v2H14z"/><path fill="#0b532c" d="M32 4v10h10z"/></svg>
          <span>Facturador</span>
        </div>
        <div class="desktop-icon" id="icon-correo" onclick="handleIconClick(event, 'correo')" ondblclick="handleIconDblClick('correo')">
          <img src="https://img.icons8.com/color/48/gmail-new.png" alt="Correo">
          <span>Correo</span>
        </div>
        <div class="desktop-icon" id="icon-papelera" onclick="handleIconClick(event, 'papelera')" ondblclick="handleIconDblClick('papelera')">
          <svg viewBox="0 0 48 48"><path fill="#6c757d" d="M12 12h24v30H12z"/><path fill="#495057" d="M10 8h28v4H10z"/><path fill="#adb5bd" d="M20 4h8v4h-8z"/></svg>
          <span>Papelera</span>
        </div>
      </div>

      <div class="window" id="app-window">
        <div class="window-header">
          <span class="window-title" id="window-title">Ventana</span>
          <button class="btn-close" onclick="closeAppWindow()" title="Cerrar">[X]</button>
        </div>
        <div class="window-body" id="window-body">Contenido de la aplicación...</div>
      </div>

      <div class="start-menu" id="start-menu">
        <div class="start-item" onclick="handleStartItem('wordpad')">📝 WordPad</div>
        <div class="start-item" onclick="handleStartItem('facturador')">🧮 Facturador Digital</div>
        <div class="start-item" onclick="handleStartItem('correo')">✉️ Correo</div>
        <div class="start-item" onclick="handleStartItem('este-equipo')">💻 Este Equipo</div>
        <div class="start-item" onclick="handleStartItem('papelera')">🗑️ Papelera de Reciclaje</div>
      </div>
    </div>

    <footer class="taskbar">
      <div class="taskbar-left">
        <button class="start-btn" id="start-btn" onclick="toggleStartMenu(event)" title="Inicio">
          <svg viewBox="0 0 88 88" width="20" height="20">
            <path fill="#00b4d8" d="M0 12.402l35.687-4.86.016 34.423-35.703.203zm35.687 34.93l.031 34.531-35.718-4.937-.016-29.75zm5.797-40.407L87.89 0l-.016 41.563-42.39.313zm42.422 41.141l.016 42.188-42.438-6.094-.031-36.438z"/>
          </svg>
        </button>
      </div>
      <div class="taskbar-clock">
        <div id="clock-time">23:18</div>
        <div id="clock-date">17/08/2026</div>
      </div>
    </footer>
  </main>
</div>

<script>
// ============================================================
// 1. BANCO DE PREGUNTAS POR MÓDULO (22 por módulo)
// ============================================================
const bank = {
  1: [ // Módulo 1: Táctil
    { type: 'mcq', q: '¿Qué acción abre un programa?', opts: ['Clic simple', 'Doble clic', 'Clic derecho'], answer: 1 },
    { type: 'mcq', q: '¿Qué hace un clic simple?', opts: ['Abrir', 'Seleccionar', 'Cerrar'], answer: 1 },
    { type: 'tf', q: 'El doble clic se usa para abrir archivos.', answer: true },

    { type: 'mcq', q: '¿Cómo se llama el movimiento de deslizar dos dedos?', opts: ['Desplazamiento', 'Zoom', 'Giro'], answer: 0 },
    { type: 'mcq', q: '¿Qué significa "clic"?', opts: ['Presionar y soltar', 'Presionar y mantener', 'Deslizar'], answer: 0 },
    { type: 'tf', q: 'El panel táctil reemplaza al mouse.', answer: true },
    { type: 'tf', q: 'El doble clic debe ser lento para funcionar.', answer: false },
    { type: 'order', q: 'Ordena los pasos para usar el panel táctil:', steps: ['Colocar dedo', 'Deslizar para mover cursor', 'Hacer clic para seleccionar'], correct: [0,1,2] },
    { type: 'mcq', q: '¿Qué acción abre el menú contextual?', opts: ['Clic derecho', 'Clic izquierdo', 'Doble clic'], answer: 0 },

// ============================================================
// 4. FUNCIONES DE INICIALIZACIÓN Y NAVEGACIÓN
// ============================================================
function init() {
  populateExerciseDropdown();
  loadExercise(0);
}

function populateExerciseDropdown() {
  const selectedModule = document.getElementById('module-select').value;
  const dropdown = document.getElementById('exercise-dropdown-select');
  dropdown.innerHTML = '';

  exercises.forEach((ex, idx) => {
    if (selectedModule === 'all' || ex.module === selectedModule) {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = ex.title;
      dropdown.appendChild(opt);
    }
  });
}

function changeModuleFilter(modVal) {
  populateExerciseDropdown();
  const firstOpt = document.getElementById('exercise-dropdown-select').options[0];
  if (firstOpt) loadExercise(parseInt(firstOpt.value, 10));
}

function loadExercise(idx) {
  currentIdx = idx;
  const ex = exercises[currentIdx];
  if (!ex) return;

  document.getElementById('exercise-dropdown-select').value = currentIdx;
  document.getElementById('badge-module').textContent = ex.modName;
  document.getElementById('exercise-title').textContent = ex.title;
  document.getElementById('location-text').textContent = ex.context;
  document.getElementById('instruction-text').innerHTML = ex.instruction;
  document.getElementById('hint-box').innerHTML = ex.hint;
  document.getElementById('hint-box').style.display = 'none';

  // Si es el módulo de evaluación, mostrar el examen
  if (ex.module === '6') {
    mostrarExamen();
  } else {
    document.getElementById('app-window').style.display = 'none';
  }

  clearSelections();
  document.getElementById('start-menu').style.display = 'none';

  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx === exercises.length - 1;
}

function selectExercise(val) {
  loadExercise(parseInt(val, 10));
}

function navigate(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < exercises.length) {
    const targetEx = exercises[next];
    const moduleSelect = document.getElementById('module-select');
    if (moduleSelect.value !== 'all' && targetEx.module !== moduleSelect.value) {
      moduleSelect.value = targetEx.module;
      populateExerciseDropdown();
    }
    loadExercise(next);
  }
}

function toggleHint() {
  const box = document.getElementById('hint-box');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function clearSelections() {
  document.querySelectorAll('.desktop-icon').forEach(icon => icon.classList.remove('selected'));
}

// ============================================================
// 5. VALIDACIÓN DE EJERCICIOS
// ============================================================
function validateAction(actionName) {
  const currentEx = exercises[currentIdx];
  if (!currentEx || currentEx.module === '6') return;
  if (currentEx.targetAction === actionName) {
    alert("¡Excelente! Ejercicio completado correctamente.");
    if (currentIdx < exercises.length - 1) navigate(1);
  }
}

// 6. MANEJADORES DE EVENTOS (Escritorio, Iconos, Menú)
// ============================================================
function handleIconClick(e, iconName) {
  e.stopPropagation();
  clearSelections();
  const icon = document.getElementById(`icon-${iconName}`);
  if (icon) icon.classList.add('selected');
  validateAction(`click-${iconName}`);
}

function handleIconDblClick(iconName) {
  clearSelections();
  const actions = {
    'este-equipo': openEsteEquipoApp,
    'wordpad': openWordpadApp,
    'facturador': openFacturadorApp,
    'correo': openCorreoApp,
    'papelera': openPapeleraApp
  };
  if (actions[iconName]) actions[iconName]();
  validateAction(`dblclick-${iconName}`);
}

function handleDesktopClick(e) {
  clearSelections();
  document.getElementById('start-menu').style.display = 'none';
  validateAction('click-desktop');
}

function toggleStartMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('start-menu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  validateAction('click-start');
}

function handleStartItem(itemName) {
  document.getElementById('start-menu').style.display = 'none';
  const actions = {
    'este-equipo': openEsteEquipoApp,
    'wordpad': openWordpadApp,
    'facturador': openFacturadorApp,
    'correo': openCorreoApp,
    'papelera': openPapeleraApp
  };
  if (actions[itemName]) actions[itemName]();
  validateAction(`start-${itemName}`);
}

function closeAppWindow() {
  document.getElementById('app-window').style.display = 'none';
  validateAction('close-window');
}

    <div id="fac-mensaje" style="margin-top:8px; font-size:0.85rem; font-weight:bold; text-align:center;"></div>
  `;
  win.style.display = 'flex';
  itemsFactura = [];
  facturaPDF = null;
}

function agregarItemFactura() {
  const producto = document.getElementById('fac-producto').value.trim();
  const cantidad = parseInt(document.getElementById('fac-cantidad').value, 10) || 1;
  const precio = parseFloat(document.getElementById('fac-precio').value) || 0;
  if (!producto || precio <= 0) { alert("Completa el producto y el precio."); return; }
  itemsFactura.push({ producto, cantidad, precio });
  actualizarListaFactura();
  calcularTotalesFactura();
  document.getElementById('fac-producto').value = '';
  document.getElementById('fac-precio').value = '';
  document.getElementById('fac-cantidad').value = '1';
  validateAction('click-agregar-item');
}

function actualizarListaFactura() {
  const lista = document.getElementById('fac-items-lista');
  if (itemsFactura.length === 0) {
    lista.innerHTML = '<em style="color:#6c757d;">No hay productos cargados</em>';
    return;
  }
  lista.innerHTML = itemsFactura.map((item, idx) =>
    `<div style="display:flex; justify-content:space-between; padding:2px 4px; border-bottom:1px solid #dee2e6;">
      <span>${item.cantidad}x ${item.producto}</span>
      <span>$${(item.cantidad * item.precio).toFixed(2)}</span>
      <button onclick="eliminarItemFactura(${idx})" style="background:none; border:none; color:#dc3545; cursor:pointer;">✖</button>
    </div>`
  ).join('');
}

function eliminarItemFactura(idx) {
  itemsFactura.splice(idx, 1);
  actualizarListaFactura();
  calcularTotalesFactura();
}

function calcularTotalesFactura() {
  const subtotal = itemsFactura.reduce((sum, item) => sum + (item.cantidad * item.precio), 0);
  const iva = subtotal * 0.21;
  const total = subtotal + iva;
  document.getElementById('fac-subtotal').textContent = subtotal.toFixed(2);
  document.getElementById('fac-iva').textContent = iva.toFixed(2);
  document.getElementById('fac-total').textContent = total.toFixed(2);
}

function emitirYGuardarFactura() {
  if (itemsFactura.length === 0) { alert("Agrega al menos un producto."); return; }
  const cliente = document.getElementById('fac-cliente').value || "Cliente";
  const cuit = document.getElementById('fac-cuit').value || "N/A";
  const domicilio = document.getElementById('fac-domicilio').value || "N/A";
  const total = document.getElementById('fac-total').textContent;
  facturaPDF = {
    numero: `F-${String(Math.floor(Math.random() * 10000)).padStart(4, '0')}`,
    fecha: new Date().toLocaleDateString('es-AR'),
    cliente, cuit, domicilio,
    items: [...itemsFactura],
    total
  };
  facturaGuardada = true;
  const facturasGuardadas = JSON.parse(localStorage.getItem('facturas_guardadas') || '[]');
  facturasGuardadas.push(facturaPDF);
  localStorage.setItem('facturas_guardadas', JSON.stringify(facturasGuardadas));
  document.getElementById('fac-mensaje').innerHTML = `<span style="color:#28a745;">✅ Factura ${facturaPDF.numero} emitida y guardada en Descargas.</span>`;
  validateAction('click-emitir-guardar');
}

function openCorreoApp() {
  const win = document.getElementById('app-window');
  document.getElementById('window-title').textContent = 'Correo - Cliente de Mail';
  document.getElementById('window-body').innerHTML = `
    <div class="app-form-group">
      <label>Para:</label>
      <input type="text" class="app-form-control" id="mail-to" value="cliente@empresa.com">
    </div>
    <div class="app-form-group">
      <label>Asunto:</label>
      <input type="text" class="app-form-control" id="mail-sub" value="Envío de Factura Digital">
    </div>
    <div style="margin-bottom:10px;">
      <button class="app-btn" onclick="simularAdjuntarDesdeCorreo()" style="background:#6c757d;">📎 Adjuntar archivo</button>
    </div>
    <div id="correo-adjunto" style="margin-bottom:10px; font-size:0.8rem; color:#495057; border:1px dashed #ced4da; padding:6px; border-radius:4px; min-height:30px;">
      📎 Archivos adjuntos: <em>Ninguno</em>
    </div>
    <button class="app-btn" onclick="enviarCorreoFinal()" style="background:#28a745;">📤 Enviar Correo</button>
  `;
  win.style.display = 'flex';
}

function simularAdjuntarDesdeCorreo() {
  const facturasGuardadas = JSON.parse(localStorage.getItem('facturas_guardadas') || '[]');
  if (facturasGuardadas.length === 0) { alert("❌ No hay facturas en Descargas. Emite una primero."); return; }
  const ultima = facturasGuardadas[facturasGuardadas.length - 1];
  const adj = document.getElementById('correo-adjunto');
  if (adj) adj.innerHTML = `📎 Archivos adjuntos: <strong style="color:green;">${ultima.numero}.pdf</strong> (Adjuntado desde Descargas)`;
  validateAction('click-adjuntar-desde-correo');
  alert("✅ Factura adjuntada correctamente.");
}

function enviarCorreoFinal() {
  const adj = document.getElementById('correo-adjunto');
  if (!adj || !adj.innerHTML.includes('.pdf')) { alert("❌ No hay factura adjunta."); return; }
  const para = document.getElementById('mail-to').value.trim();
  if (!para) { alert("❌ Escribe un destinatario."); return; }
  alert("✅ ¡Correo enviado exitosamente!");
  validateAction('click-enviar-correo');
  closeAppWindow();
}

function openEsteEquipoApp() {
  const win = document.getElementById('app-window');
  document.getElementById('window-title').textContent = 'Este Equipo';
  document.getElementById('window-body').innerHTML = `
    <div style="font-weight:bold; margin-bottom:10px;">Carpetas y Unidades:</div>
    <ul style="list-style:none; padding-left:0;">
      <li style="padding:6px; background:#f1f3f5; border-radius:4px; cursor:pointer;" onclick="abrirDescargas()">📁 Descargas</li>
      <li style="padding:6px; background:#f1f3f5; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Documentos')">📄 Documentos</li>
      <li style="padding:6px; background:#f1f3f5; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Música')">🎵 Música</li>
    </ul>
  `;
  win.style.display = 'flex';
}

function abrirDescargas() {
  const facturasGuardadas = JSON.parse(localStorage.getItem('facturas_guardadas') || '[]');
  const tiene = facturasGuardadas.length > 0;
  const body = document.getElementById('window-body');
  if (!tiene) {
    body.innerHTML = `<div style="text-align:center; color:#6c757d;">📭 No hay facturas guardadas. Emite una primero.</div>`;
    return;
  }
  const ultima = facturasGuardadas[facturasGuardadas.length - 1];
  facturaSeleccionada = ultima;
  body.innerHTML = `
    <div style="font-weight:bold; color:#0077b6;">Descargas</div>
    <div style="padding:8px; background:#d4edda; border:1px solid #c3e6cb; border-radius:4px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
      <span>📄 <strong>${ultima.numero}.pdf</strong> (${ultima.fecha})</span>
      <button class="app-btn" onclick="adjuntarDesdeDescargas()" style="background:#0077b6;">📎 Adjuntar al Correo</button>
    </div>
  `;
  validateAction('click-verificar-descargas');
}

function adjuntarDesdeDescargas() {
  if (!facturaSeleccionada) { alert("Primero selecciona una factura."); return; }
  openCorreoApp();
  setTimeout(() => {
    const adj = document.getElementById('correo-adjunto');
    if (adj) adj.innerHTML = `📎 Archivos adjuntos: <strong style="color:green;">${facturaSeleccionada.numero}.pdf</strong> (Adjuntado desde Descargas)`;
    const to = document.getElementById('mail-to');
    if (to) to.value = 'cliente@empresa.com';
    const sub = document.getElementById('mail-sub');
    if (sub) sub.value = `Factura ${facturaSeleccionada.numero}`;
  }, 300);
  validateAction('click-adjuntar-desde-descargas');
  alert("✅ Factura adjuntada al correo.");
}

function openPapeleraApp() {
  const win = document.getElementById('app-window');
  document.getElementById('window-title').textContent = 'Papelera de Reciclaje';
  document.getElementById('window-body').innerHTML = `<div style="color:#6c757d; text-align:center; padding:20px;">🗑️ La papelera está vacía.</div>`;
  win.style.display = 'flex';
}

// ============================================================
// 8. MÓDULO 6: EVALUACIÓN GENERAL CON ARRASTRE
// ============================================================
function generarExamen() {
  const preguntas = [];
  const modulos = ['1','2','3','4','5'];
  modulos.forEach(mod => {
    const pool = bank[mod] || [];
    const shuffled = pool.sort(() => Math.random() - 0.5);
    const seleccionadas = shuffled.slice(0, 5);
    preguntas.push(...seleccionadas.map(p => ({ ...p, modulo: mod })));
  });
  return preguntas.sort(() => Math.random() - 0.5);
}

function mostrarExamen() {
  examenActual = generarExamen();
  respuestasExamen = [];
  examenCompletado = false;
  const body = document.getElementById('window-body');
  let html = `<div style="margin-bottom:15px; font-weight:bold;">📝 Evaluación General (25 preguntas)</div>`;
  examenActual.forEach((p, idx) => {
    html += `<div style="margin-bottom:20px; padding:10px; background:#f8f9fa; border-radius:6px; border-left:4px solid #0077b6;">`;
    html += `<div style="font-weight:600; margin-bottom:6px;">${idx+1}. ${p.q}</div>`;
    if (p.type === 'mcq') {
      p.opts.forEach((opt, oi) => {
        html += `<label style="display:block; margin:4px 0; cursor:pointer;">
          <input type="radio" name="q${idx}" value="${oi}" onchange="guardarRespuesta(${idx}, ${oi})"> ${opt}
        </label>`;
      });
    } else if (p.type === 'tf') {
      html += `<label style="display:block; margin:4px 0; cursor:pointer;">
        <input type="radio" name="q${idx}" value="true" onchange="guardarRespuesta(${idx}, true)"> Verdadero
      </label>
      <label style="display:block; margin:4px 0; cursor:pointer;">
        <input type="radio" name="q${idx}" value="false" onchange="guardarRespuesta(${idx}, false)"> Falso
      </label>`;
    } else if (p.type === 'order') {
      html += `<div class="drop-zone" id="dropzone-${idx}" ondrop="soltarItem(event, ${idx})" ondragover="permitirDrop(event)" ondragleave="limpiarDrag(event)">
        <span style="color:#6c757d;">Arrastra los pasos en orden:</span>
      </div>
      <div id="items-${idx}" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">`;
      p.steps.forEach((step, si) => {
        html += `<span class="drop-item" draggable="true" data-idx="${idx}" data-step="${si}" ondragstart="iniciarDrag(event)">${step}</span>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `<button class="app-btn" onclick="corregirExamen()" style="background:#28a745;">✅ Corregir Examen</button>
           <button class="app-btn" onclick="actualizarExamen()" style="background:#0077b6; margin-left:10px;">🔄 Actualizar</button>
           <div id="resultado-examen" style="margin-top:15px; font-weight:bold; text-align:center;"></div>`;
  body.innerHTML = html;
  document.getElementById('app-window').style.display = 'flex';
}

function guardarRespuesta(idx, valor) {
  respuestasExamen[idx] = valor;
}

function iniciarDrag(e) {
  e.dataTransfer.setData('text/plain', JSON.stringify({
    idx: e.target.dataset.idx,
    step: e.target.dataset.step,
    text: e.target.textContent
  }));
  e.target.classList.add('dragging');
}

function permitirDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function limpiarDrag(e) { e.currentTarget.classList.remove('drag-over'); }

function soltarItem(e, idx) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const data = JSON.parse(e.dataTransfer.getData('text/plain'));
  if (parseInt(data.idx) !== idx) return;
  const dropZone = document.getElementById(`dropzone-${idx}`);
  const item = document.createElement('span');
  item.className = 'drop-item';
  item.textContent = data.text;
  item.style.cursor = 'default';
  item.draggable = false;
  dropZone.appendChild(item);
  // Remover el original
  const itemsContainer = document.getElementById(`items-${idx}`);
  const original = itemsContainer.querySelector(`[data-step="${data.step}"]`);
  if (original) original.remove();
  // Guardar orden
  const orden = Array.from(dropZone.querySelectorAll('.drop-item')).map(el => el.textContent);
  const originalSteps = examenActual[idx].steps;
  const ordenNumeros = orden.map(text => originalSteps.indexOf(text));
  respuestasExamen[idx] = ordenNumeros;
}

function corregirExamen() {
  if (examenCompletado) return;
  let correctas = 0;
  const total = examenActual.length;
  examenActual.forEach((p, idx) => {
    let resp = respuestasExamen[idx];
    if (resp === undefined) return;
    let esCorrecto = false;
    if (p.type === 'mcq' || p.type === 'tf') {
      esCorrecto = (resp === p.answer);
    } else if (p.type === 'order') {
      if (Array.isArray(resp) && resp.length === p.correct.length) {
        esCorrecto = resp.every((v, i) => v === p.correct[i]);
      }
    }
    if (esCorrecto) correctas++;
    // Marcar visualmente
    const container = document.querySelector(`#app-window .window-body > div:nth-child(${idx+1})`);
    if (container) {
      container.style.borderLeftColor = esCorrecto ? '#28a745' : '#dc3545';
      container.style.background = esCorrecto ? '#d4edda' : '#f8d7da';
    }
  });
  examenCompletado = true;
  const mensaje = correctas >= 9 ? '¡Excelente! Bien logrado' :
                  correctas >= 6 ? 'Bien logrado' :
                  'Estuviste muy cerca, hay que seguir practicando';
  document.getElementById('resultado-examen').innerHTML = `
    <span style="font-size:1.2rem;">${correctas}/${total} - ${mensaje}</span>
  `;
}

function actualizarExamen() {
  if (!examenCompletado) { alert("Completa el examen antes de actualizar."); return; }
  mostrarExamen();
}
