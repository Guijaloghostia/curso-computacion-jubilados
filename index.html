<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacitación Digital - Simulador Educativo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Panel Izquierdo: Capacitación Digital */
    .sidebar {
      width: 350px;
      background-color: #0b132b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
      z-index: 20;
    }

    .sidebar-header h2 {
      font-size: 1.3rem;
      color: #00b4d8;
      margin-bottom: 15px;
    }

    .exercise-select {
      width: 100%;
      padding: 10px;
      background: #1c2541;
      color: #fff;
      border: 1px solid #3a506b;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .badge-module {
      display: inline-block;
      background-color: #0077b6;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .exercise-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .instruction-card {
      background-color: #1c2541;
      border-left: 4px solid #00b4d8;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }

    .instruction-text {
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 15px;
      color: #e0e1dd;
    }

    .hint-btn {
      width: 100%;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid #ffb703;
      color: #ffb703;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .hint-box {
      display: none;
      background: rgba(255, 183, 3, 0.1);
      border: 1px dashed #ffb703;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #ffb703;
      margin-bottom: 15px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background-color: #00b4d8;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-nav:disabled {
      background-color: #3a506b;
      color: #8d99ae;
      cursor: not-allowed;
    }

    /* Panel Derecho: Escritorio de Windows */
    .desktop-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    }

    .desktop-workspace {
      flex: 1;
      position: relative;
      padding: 15px;
    }

    /* Iconos Alineados Verticalmente */
    .desktop-icons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #ffffff;
      font-size: 0.75rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .desktop-icon:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .desktop-icon.selected {
      background-color: rgba(0, 180, 216, 0.3);
      border: 1px solid #00b4d8;
    }

    .desktop-icon img {
      width: 38px;
      height: 38px;
      margin-bottom: 4px;
    }

    /* Ventanas */
    .window {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 440px;
      background-color: #ffffff;
      color: #333333;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: none;
      z-index: 10;
    }

    .window-header {
      background-color: #f0f0f0;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dddddd;
    }

    .window-title {
      font-size: 0.8rem;
      color: #333333;
      font-weight: 600;
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      color: #555555;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .btn-close:hover {
      background-color: #e81123;
      color: #ffffff;
    }

    .window-body {
      padding: 15px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* Menú Inicio */
    .start-menu {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 250px;
      background-color: rgba(15, 23, 42, 0.95);
      border-top-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: none;
      z-index: 15;
    }

    .start-item {
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .start-item:hover {
      background-color: #00b4d8;
      color: #000;
    }

    /* Barra de Tareas */
    .taskbar {
      height: 45px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .start-btn {
      background: transparent;
      border: none;
      color: #00b4d8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 4px;
    }

    .start-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .taskbar-clock {
      font-size: 0.75rem;
      text-align: right;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <h2>Capacitación Digital</h2>
        </div>

        <select id="exercise-select" class="exercise-select" onchange="selectExercise(this.value)"></select>

        <span id="badge-module" class="badge-module">Módulo 1</span>
        <h3 id="exercise-title" class="exercise-title">Ejercicio 1</h3>
        
        <div class="instruction-card">
          📌 <span id="location-text">Ubicación inicial: Escritorio principal</span>
        </div>
        
        <p id="instruction-text" class="instruction-text">Cargando consigna...</p>
        
        <button class="hint-btn" onclick="toggleHint()">💡 Pista: Ver ayuda paso a paso</button>
        <div id="hint-box" class="hint-box"></div>
      </div>

      <div class="nav-buttons">
        <button id="btn-prev" class="btn-nav" onclick="navigate(-1)">Anterior</button>
        <button id="btn-next" class="btn-nav" onclick="navigate(1)">Siguiente</button>
      </div>
    </aside>

    <main class="desktop-container" onclick="handleDesktopClick(event)">
      <div class="desktop-workspace">
        
        <div class="desktop-icons">
          <div class="desktop-icon" id="icon-este-equipo" onclick="handleIconClick(event, 'este-equipo')" ondblclick="handleIconDblClick('este-equipo')">
            <img src="https://img.icons8.com/fluent/48/display.png" alt="Este Equipo">
            <span>Este Equipo</span>
          </div>
          <div class="desktop-icon" id="icon-wordpad" onclick="handleIconClick(event, 'wordpad')" ondblclick="handleIconDblClick('wordpad')">
            <img src="https://img.icons8.com/color/48/wordpad.png" alt="WordPad">
            <span>WordPad</span>
          </div>
          <div class="desktop-icon" id="icon-facturador" onclick="handleIconClick(event, 'facturador')" ondblclick="handleIconDblClick('facturador')">
            <img src="https://img.icons8.com/color/48/calculator.png" alt="Facturador">
            <span>Facturador</span>
          </div>
          <div class="desktop-icon" id="icon-correo" onclick="handleIconClick(event, 'correo')" ondblclick="handleIconDblClick('correo')">
            <img src="https://img.icons8.com/color/48/gmail-new.png" alt="Correo">
            <span>Correo</span>
          </div>
        </div>

        <div class="window" id="app-window">
          <div class="window-header">
            <span class="window-title" id="window-title">Ventana</span>
            <button class="btn-close" onclick="closeAppWindow()" title="Cerrar">[X]</button>
          </div>
          <div class="window-body" id="window-body">
            Contenido de la aplicación...
          </div>
        </div>

        <div class="start-menu" id="start-menu">
          <div class="start-item" onclick="handleStartItem('wordpad')">📝 WordPad</div>
          <div class="start-item" onclick="handleStartItem('facturador')">🧮 Facturador</div>
          <div class="start-item" onclick="handleStartItem('correo')">✉️ Correo</div>
          <div class="start-item" onclick="handleStartItem('este-equipo')">💻 Este Equipo</div>
        </div>

      </div>

      <footer class="taskbar">
        <div class="taskbar-left">
          <button class="start-btn" id="start-btn" onclick="toggleStartMenu(event)">⊞</button>
        </div>
        <div class="taskbar-clock">
          <div id="clock-time">20:47</div>
          <div id="clock-date">16/08/2026</div>
        </div>
      </footer>
    </main>
  </div>

      { id: 39, module: "Módulo 3: Explorador de Archivos", title: "Ejercicio 39: Cerrar Correo", context: "📌 Ubicación inicial: Ventana de Correo", instruction: "Cierre la ventana de Correo.", hint: "Haga clic en [X].", targetAction: "close-window" },
      { id: 40, module: "Módulo 3: Explorador de Archivos", title: "Ejercicio 40: Menú Inicio", context: "📌 Ubicación inicial: Barra de tareas", instruction: "Despliegue el menú principal de Windows.", hint: "Haga clic en el ícono de inicio.", targetAction: "click-start" },

      { id: 100, module: "Módulo 8: Integración Final", title: "Ejercicio 100: Evaluación Final", context: "📌 Ubicación inicial: Escritorio principal", instruction: "Cierre la última ventana activa pulsando <strong>[X]</strong> para finalizar la evaluación.", hint: "Haga clic en la [X] de la ventana superior.", targetAction: "close-window" }
    ];

    let currentIdx = 0;

    const selectElem = document.getElementById('exercise-select');
    const badgeElem = document.getElementById('badge-module');
    const titleElem = document.getElementById('exercise-title');
    const contextElem = document.getElementById('location-text');
    const instructionElem = document.getElementById('instruction-text');
    const hintBox = document.getElementById('hint-box');
    const appWindow = document.getElementById('app-window');
    const windowTitle = document.getElementById('window-title');
    const windowBody = document.getElementById('window-body');
    const startMenu = document.getElementById('start-menu');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    function init() {
      selectElem.innerHTML = '';
      exercises.forEach((ex, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${ex.title}`;
        selectElem.appendChild(opt);
      });
      loadExercise(0);
    }

    function loadExercise(idx) {
      currentIdx = idx;
      const ex = exercises[currentIdx];

      selectElem.value = currentIdx;
      badgeElem.textContent = ex.module;
      titleElem.textContent = ex.title;
      contextElem.textContent = ex.context;
      instructionElem.innerHTML = ex.instruction;
      hintBox.innerHTML = ex.hint;
      hintBox.style.display = 'none';

      clearSelections();
      startMenu.style.display = 'none';

      if (ex.targetAction === 'close-window' || ex.id === 89) {
        windowTitle.textContent = ex.id === 89 ? "Propiedades del Sistema - Este Equipo" : "Ventana de Aplicación";
        windowBody.innerHTML = ex.id === 89 
          ? "<b>Procesador:</b> Intel Core i5<br><b>RAM:</b> 8.00 GB<br><b>Sistema Operativo:</b> Capacitación Digital OS 64 bits"
          : "Contenido del programa en ejecución.";
        appWindow.style.display = 'block';
      } else {
        appWindow.style.display = 'none';
      }

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === exercises.length - 1;
    }

    function selectExercise(val) {
      loadExercise(parseInt(val, 10));
    }

    function navigate(dir) {
      const next = currentIdx + dir;
      if (next >= 0 && next < exercises.length) {
        loadExercise(next);
      }
    }

    function toggleHint() {
      hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    function clearSelections() {
      document.querySelectorAll('.desktop-icon').forEach(icon => icon.classList.remove('selected'));
    }

    function validateAction(actionName) {
      const currentEx = exercises[currentIdx];
      if (currentEx.targetAction === actionName) {
        alert("¡Correcto! Ejercicio completado.");
        if (currentIdx < exercises.length - 1) {
          navigate(1);
        }
      }
    }

    function handleIconClick(e, iconName) {
      e.stopPropagation();
      clearSelections();
      document.getElementById(`icon-${iconName}`).classList.add('selected');
      validateAction(`click-${iconName}`);
    }

    function handleIconDblClick(iconName) {
      clearSelections();
      windowTitle.textContent = iconName.toUpperCase();
      windowBody.innerHTML = `Ventana abierta de ${iconName}.`;
      appWindow.style.display = 'block';
      validateAction(`dblclick-${iconName}`);
    }

    function handleDesktopClick(e) {
      clearSelections();
      startMenu.style.display = 'none';
      validateAction('click-desktop');
    }

    function toggleStartMenu(e) {
      e.stopPropagation();
      startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
      validateAction('click-start');
    }

    function handleStartItem(itemName) {
      startMenu.style.display = 'none';
      windowTitle.textContent = itemName.toUpperCase();
      windowBody.innerHTML = `Programa ${itemName} iniciado desde Menú Inicio.`;
      appWindow.style.display = 'block';
      validateAction(`start-${itemName}`);
    }

    function closeAppWindow() {
      appWindow.style.display = 'none';
      validateAction('close-window');
    }

    init();
  </script>
