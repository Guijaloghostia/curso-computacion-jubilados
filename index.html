<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso Integral de Alfabetización Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Panel Izquierdo */
    .sidebar {
      width: 410px;
      background-color: #0b132b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
      z-index: 20;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      color: #00b4d8;
      margin-bottom: 8px;
      text-align: center;
    }

    .control-group {
      margin-bottom: 8px;
    }

    .control-label {
      font-size: 0.78rem;
      color: #8d99ae;
      margin-bottom: 3px;
      display: block;
      font-weight: 600;
    }

    .module-select, .exercise-dropdown-select {
      width: 100%;
      padding: 7px;
      background: #1c2541;
      color: #fff;
      border: 1px solid #3a506b;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .badge-module {
      display: inline-block;
      background-color: #0077b6;
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .exercise-title {
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .instruction-card {
      background-color: #1c2541;
      border-left: 4px solid #00b4d8;
      padding: 7px;
      border-radius: 4px;
      margin-bottom: 5px;
      font-size: 0.75rem;
    }

    .instruction-text {
      font-size: 0.82rem;
      line-height: 1.3;
      margin-bottom: 6px;
      color: #e0e1dd;
      max-height: 95px;
      overflow-y: auto;
    }

    .hint-btn {
      width: 100%;
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid #ffb703;
      color: #ffb703;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    .hint-box {
      display: none;
      background: rgba(255, 183, 3, 0.1);
      border: 1px dashed #ffb703;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #ffb703;
      margin-bottom: 6px;
      max-height: 85px;
      overflow-y: auto;
    }

    .eval-controls {
      display: none;
      background: rgba(0, 180, 216, 0.15);
      border: 1px solid #00b4d8;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      text-align: center;
    }

    .eval-btn {
      background: #00b4d8;
      color: #000;
      border: none;
      padding: 6px 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78rem;
      width: 100%;
    }
    .eval-btn:hover {
      background: #90e0ef;
    }

    .nav-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-nav {
      flex: 1;
      padding: 7px;
      border: none;
      border-radius: 6px;
      background-color: #00b4d8;
      color: #000000;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-nav:disabled {
      background-color: #3a506b;
      color: #8d99ae;
      cursor: not-allowed;
    }

    /* Panel Derecho: Escritorio */
    .desktop-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    }

    .desktop-workspace {
      flex: 1;
      position: relative;
      padding: 15px;
    }

    .desktop-icons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #ffffff;
      font-size: 0.75rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }

    .desktop-icon:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .desktop-icon.selected {
      background-color: rgba(0, 180, 216, 0.3);
      border: 1px solid #00b4d8;
    }

    .desktop-icon svg, .desktop-icon img {
      width: 38px;
      height: 38px;
      margin-bottom: 4px;
    }

    /* Ventanas */
    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 560px;
      height: 390px;
      background-color: #f8f9fa;
      color: #333333;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: none;
      z-index: 10;
      flex-direction: column;
    }

    .window-header {
      background-color: #e9ecef;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ced4da;
    }

    .window-title {
      font-size: 0.85rem;
      color: #212529;
      font-weight: 600;
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 3px;
    }

    .btn-close:hover {
      background-color: #dc3545;
      color: #ffffff;
    }

    .window-body {
      padding: 15px;
      font-size: 0.85rem;
      flex: 1;
      overflow-y: auto;
      background-color: #ffffff;
      color: #212529;
    }

    .app-form-group {
      margin-bottom: 10px;
    }
    .app-form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 3px;
      font-weight: 600;
    }
    .app-form-control {
      width: 100%;
      padding: 6px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .app-btn {
      background: #0077b6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .app-btn:hover {
      background: #0096c7;
    }

    /* Menú Inicio */
    .start-menu {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 260px;
      background-color: rgba(15, 23, 42, 0.96);
      border-top-right-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      display: none;
      z-index: 15;
    }

    .start-item {
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .start-item:hover {
      background-color: #00b4d8;
      color: #000;
    }

    /* Barra de tareas */
    .taskbar {
      height: 45px;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 20;
    }

    .start-btn {
      background: transparent;
      border: none;
      color: #00b4d8;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }

    .start-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .taskbar-clock {
      font-size: 0.75rem;
      text-align: right;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <h2>Curso Integral de Alfabetización Digital</h2>
        </div>

        <div class="control-group">
          <label class="control-label">Módulo de Aprendizaje:</label>
          <select id="module-select" class="module-select" onchange="changeModuleFilter(this.value)">
            <option value="all">Ver los 100 ejercicios integrales</option>
            <option value="1">Módulo 1: Escritorio y Puntero (01-12)</option>
            <option value="2">Módulo 2: Gestión de Ventanas (13-25)</option>
            <option value="3">Módulo 3: Explorador de Archivos (26-40)</option>
            <option value="4">Módulo 4: WordPad y Textos (41-55)</option>
            <option value="5">Módulo 5: Facturador Digital (56-72)</option>
            <option value="6">Módulo 6: Correo Electrónico (73-86)</option>
            <option value="7">Módulo 7: Primeros Auxilios de la PC (87-97)</option>
            <option value="8">Módulo 8: Evaluador Dinámico y Actualizable (98-100)</option>
          </select>
        </div>

        <div class="control-group">
          <label class="control-label">Seleccionar Ejercicio:</label>
          <select id="exercise-dropdown-select" class="exercise-dropdown-select" onchange="selectExercise(this.value)"></select>
        </div>

        <span id="badge-module" class="badge-module">Módulo 1</span>
        <h3 id="exercise-title" class="exercise-title">Ejercicio 1</h3>
        
        <div class="instruction-card">
          📌 <span id="location-text">Pantalla Principal</span>
        </div>
        
        <p id="instruction-text" class="instruction-text">Cargando...</p>
        
        <button class="hint-btn" onclick="toggleHint()">💡 Ayuda paso a paso</button>
        <div id="hint-box" class="hint-box"></div>

        <div id="eval-controls" class="eval-controls">
          <button class="eval-btn" onclick="actualizarDesafioEvaluador()">🔄 Actualizar Desafío Dinámico</button>
        </div>
      </div>

      <div class="nav-buttons">
        <button id="btn-prev" class="btn-nav" onclick="navigate(-1)">Anterior</button>
        <button id="btn-next" class="btn-nav" onclick="navigate(1)">Siguiente</button>
      </div>
    </aside>

    <main class="desktop-container" onclick="handleDesktopClick(event)">
      <div class="desktop-workspace">
        
        <div class="desktop-icons">
          <div class="desktop-icon" id="icon-este-equipo" onclick="handleIconClick(event, 'este-equipo')" ondblclick="handleIconDblClick('este-equipo')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#0078d7" d="M40 8H8a4 4 0 00-4 4v20a4 4 0 004 4h14l-2 4h-4v2h16v-2h-4l-2-4h14a4 4 0 004-4V12a4 4 0 00-4-4zm0 22H8V12h32z"/></svg>
            <span>Este Equipo</span>
          </div>

          <div class="desktop-icon" id="icon-wordpad" onclick="handleIconClick(event, 'wordpad')" ondblclick="handleIconDblClick('wordpad')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#2b579a" d="M6 6h28l8 8v28H6z"/><path fill="#fff" d="M14 18h20v2H14zm0 6h20v2H14zm0 6h14v2H14z"/><path fill="#19325c" d="M34 6v8h8z"/></svg>
            <span>WordPad</span>
          </div>

          <div class="desktop-icon" id="icon-facturador" onclick="handleIconClick(event, 'facturador')" ondblclick="handleIconDblClick('facturador')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#107c41" d="M8 4h24l8 8v32H8z"/><path fill="#fff" d="M14 16h20v2H14zm0 6h20v2H14zm0 6h12v2H14z"/><path fill="#0b532c" d="M32 4v10h10z"/></svg>
            <span>Facturador</span>
          </div>

          <div class="desktop-icon" id="icon-correo" onclick="handleIconClick(event, 'correo')" ondblclick="handleIconDblClick('correo')">
            <img src="https://img.icons8.com/color/48/gmail-new.png" alt="Correo">
            <span>Correo</span>
          </div>

          <div class="desktop-icon" id="icon-papelera" onclick="handleIconClick(event, 'papelera')" ondblclick="handleIconDblClick('papelera')">
            <svg viewBox="0 0 48 48" width="38" height="38"><path fill="#6c757d" d="M12 12h24v30H12z"/><path fill="#495057" d="M10 8h28v4H10z"/><path fill="#adb5bd" d="M20 4h8v4h-8z"/></svg>
            <span>Papelera</span>
          </div>
        </div>

        <div class="window" id="app-window">
          <div class="window-header">
            <span class="window-title" id="window-title">Ventana</span>
            <button class="btn-close" onclick="closeAppWindow()" title="Cerrar">[X]</button>
          </div>
          <div class="window-body" id="window-body">
            Contenido...
          </div>
        </div>

        <div class="start-menu" id="start-menu">
          <div class="start-item" onclick="handleStartItem('wordpad')">📝 Escribir en WordPad</div>
          <div class="start-item" onclick="handleStartItem('facturador')">🧮 Abrir Facturador</div>
          <div class="start-item" onclick="handleStartItem('correo')">✉️ Revisar Correo</div>
          <div class="start-item" onclick="handleStartItem('este-equipo')">💻 Ver Mis Archivos</div>
          <div class="start-item" onclick="handleStartItem('papelera')">🗑️ Papelera de Reciclaje</div>
        </div>

      </div>

      <footer class="taskbar">
        <div class="taskbar-left">
          <button class="start-btn" id="start-btn" onclick="toggleStartMenu(event)" title="Menú Inicio">
            <svg viewBox="0 0 88 88" width="20" height="20">
              <path fill="#00b4d8" d="M0 12.402l35.687-4.86.016 34.423-35.703.203zm35.687 34.93l.031 34.531-35.718-4.937-.016-29.75zm5.797-40.407L87.89 0l-.016 41.563-42.39.313zm42.422 41.141l.016 42.188-42.438-6.094-.031-36.438z"/>
            </svg>
          </button>
        </div>
        <div class="taskbar-clock">
          <div id="clock-time">10:25</div>
          <div id="clock-date">12/10/2026</div>
        </div>
      </footer>
    </main>
  </div>

  <script>
    // MATRIZ COMPLETA Y AUDITADA DE 100 EJERCICIOS
    const exercises = [
      // MÓDULO 1: Escritorio y Puntero (01 a 12)
      { id: 1, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 01: Ajustar tamaño de íconos", context: "📌 Pantalla Principal", instruction: "Haga clic derecho en el fondo libre para configurar la vista de íconos.", hint: "Paso 1: Apunte a una zona vacía del fondo.\nPaso 2: Haga clic con el botón derecho del mouse.", targetAction: "click-desktop" },
      { id: 2, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 02: Seleccionar WordPad", context: "📌 Pantalla Principal", instruction: "Haga un clic simple sobre el ícono de WordPad.", hint: "Paso 1: Ubique WordPad.\nPaso 2: Haga clic izquierdo.", targetAction: "click-wordpad" },
      { id: 3, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 03: Seleccionar Facturador", context: "📌 Pantalla Principal", instruction: "Haga un clic simple sobre el Facturador.", hint: "Paso 1: Busque el Facturador.\nPaso 2: Haga clic izquierdo.", targetAction: "click-facturador" },
      { id: 4, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 04: Seleccionar Este Equipo", context: "📌 Pantalla Principal", instruction: "Haga clic simple en 'Este Equipo'.", hint: "Paso 1: Haga clic sobre 'Este Equipo'.", targetAction: "click-este-equipo" },
      { id: 5, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 05: Menú contextual de Facturador", context: "📌 Pantalla Principal", instruction: "Haga clic derecho en el Facturador para ver sus opciones.", hint: "Paso 1: Apunte al Facturador.\nPaso 2: Haga clic derecho.", targetAction: "click-facturador" },
      { id: 6, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 06: Seleccionar Correo", context: "📌 Pantalla Principal", instruction: "Haga clic simple en Correo.", hint: "Paso 1: Haga clic sobre el ícono de Correo.", targetAction: "click-correo" },
      { id: 7, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 07: Abrir menú Inicio", context: "📌 Barra de tareas", instruction: "Haga clic en el botón de Windows inferior izquierdo.", hint: "Paso 1: Vaya a la esquina inferior izquierda.\nPaso 2: Haga clic en el botón Inicio.", targetAction: "click-start" },
      { id: 8, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 08: Limpiar selección de pantalla", context: "📌 Pantalla Principal", instruction: "Haga clic en un espacio vacío del fondo.", hint: "Paso 1: Haga clic en el fondo libre.", targetAction: "click-desktop" },
      { id: 9, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 09: Marcar Papelera", context: "📌 Pantalla Principal", instruction: "Haga clic simple en la Papelera.", hint: "Paso 1: Haga clic en la Papelera.", targetAction: "click-papelera" },
      { id: 10, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 10: Comprobación de acceso rápido", context: "📌 Barra de tareas", instruction: "Abra el menú Inicio para verificar la respuesta del sistema.", hint: "Paso 1: Haga clic en el botón Inicio.", targetAction: "click-start" },
      { id: 11, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 11: Fondo libre de escritorio", context: "📌 Pantalla Principal", instruction: "Haga clic en el fondo.", hint: "Paso 1: Haga clic en el fondo.", targetAction: "click-desktop" },
      { id: 12, module: "1", modName: "Módulo 1: Escritorio y Puntero", title: "Ej 12: AUTOEVALUACIÓN M1 - Abrir WordPad", context: "📌 Pantalla Principal", instruction: "Autoevaluación M1: Abra WordPad con doble clic rápido.", hint: "Paso 1: Doble clic rápido sobre WordPad.", targetAction: "dblclick-wordpad" },

      // MÓDULO 2: Gestión de Ventanas (13 a 25)
      { id: 13, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 13: Cerrar ventana activa", context: "📌 Ventana Abierta", instruction: "Cierre la ventana con la cruz [X].", hint: "Paso 1: Haga clic en [X].", targetAction: "close-window" },
      { id: 14, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 14: Abrir Facturador", context: "📌 Pantalla Principal", instruction: "Abra el Facturador con doble clic.", hint: "Paso 1: Doble clic en el Facturador.", targetAction: "dblclick-facturador" },
      { id: 15, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 15: Cerrar Facturador", context: "📌 Ventana del Facturador", instruction: "Cierre la ventana con [X].", hint: "Paso 1: Haga clic en [X].", targetAction: "close-window" },
      { id: 16, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 16: Abrir Correo", context: "📌 Pantalla Principal", instruction: "Abra Correo con doble clic.", hint: "Paso 1: Doble clic en Correo.", targetAction: "dblclick-correo" },
      { id: 17, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 17: Cerrar Correo", context: "📌 Ventana de Correo", instruction: "Cierre la ventana con [X].", hint: "Paso 1: Haga clic en [X].", targetAction: "close-window" },
      { id: 18, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 18: Abrir Este Equipo", context: "📌 Pantalla Principal", instruction: "Abra 'Este Equipo' con doble clic.", hint: "Paso 1: Doble clic en 'Este Equipo'.", targetAction: "dblclick-este-equipo" },
      { id: 19, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 19: Cerrar Este Equipo", context: "📌 Ventana de Este Equipo", instruction: "Cierre la ventana con [X].", hint: "Paso 1: Haga clic en [X].", targetAction: "close-window" },
      { id: 20, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 20: Abrir Papelera", context: "📌 Pantalla Principal", instruction: "Abra la Papelera con doble clic.", hint: "Paso 1: Doble clic en la Papelera.", targetAction: "dblclick-papelera" },
      { id: 21, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 21: Cerrar Papelera", context: "📌 Ventana de Papelera", instruction: "Cierre la ventana con [X].", hint: "Paso 1: Haga clic en [X].", targetAction: "close-window" },
      { id: 22, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 22: Lanzar app vía menú Inicio", context: "📌 Menú Inicio", instruction: "Abra el menú Inicio y seleccione Facturador.", hint: "Paso 1: Abra el menú Inicio.\nPaso 2: Haga clic en 'Facturador Digital'.", targetAction: "start-facturador" },
      { id: 23, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 23: Cerrar app lanzada", context: "📌 Ventana del Facturador", instruction: "Cierre la ventana con [X].", hint: "Paso 1: Haga clic en [X].", targetAction: "close-window" },
      { id: 24, module: "2", modName: "Módulo 2: Gestión de Ventanas", title: "Ej 24: Lanzar WordPad vía menú", context: "📌 Menú Inicio", instruction: "Abra el menú Inicio y seleccione WordPad.", hint: "Paso 1: Abra el menú Inicio.\nPaso 2: Haga clic en 'WordPad'.", targetAction: "start-wordpad" },

    let currentIdx = 0;
    let facturaGuardada = false;

    const moduleSelectElem = document.getElementById('module-select');
    const exerciseDropdownElem = document.getElementById('exercise-dropdown-select');
    const badgeElem = document.getElementById('badge-module');
    const titleElem = document.getElementById('exercise-title');
    const contextElem = document.getElementById('location-text');
    const instructionElem = document.getElementById('instruction-text');
    const hintBox = document.getElementById('hint-box');
    const evalControls = document.getElementById('eval-controls');
    const appWindow = document.getElementById('app-window');
    const windowTitle = document.getElementById('window-title');
    const windowBody = document.getElementById('window-body');
    const startMenu = document.getElementById('start-menu');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    function init() {
      populateExerciseDropdown();
      loadExercise(0);
    }

    function populateExerciseDropdown() {
      const selectedModule = moduleSelectElem.value;
      exerciseDropdownElem.innerHTML = '';

      exercises.forEach((ex, idx) => {
        if (selectedModule === 'all' || ex.module === selectedModule) {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.textContent = ex.title;
          exerciseDropdownElem.appendChild(opt);
        }
      });
    }

    function changeModuleFilter(modVal) {
      populateExerciseDropdown();
      const firstOpt = exerciseDropdownElem.options[0];
      if (firstOpt) {
        loadExercise(parseInt(firstOpt.value, 10));
      }
    }

    function loadExercise(idx) {
      currentIdx = idx;
      const ex = exercises[currentIdx];

      exerciseDropdownElem.value = currentIdx;

      badgeElem.textContent = ex.modName;
      titleElem.textContent = ex.title;
      contextElem.textContent = ex.context;
      instructionElem.innerHTML = ex.instruction;
      hintBox.innerHTML = ex.hint;
      hintBox.style.display = 'none';

      // Mostrar controles del evaluador solo en el Módulo 8
      if (ex.module === "8") {
        evalControls.style.display = 'block';
      } else {
        evalControls.style.display = 'none';
      }

      clearSelections();
      startMenu.style.display = 'none';
      appWindow.style.display = 'none';

      btnPrev.disabled = currentIdx === 0;
      btnNext.disabled = currentIdx === exercises.length - 1;
    }

    function selectExercise(val) {
      loadExercise(parseInt(val, 10));
    }

    function navigate(dir) {
      const next = currentIdx + dir;
      if (next >= 0 && next < exercises.length) {
        const targetEx = exercises[next];
        if (moduleSelectElem.value !== 'all' && targetEx.module !== moduleSelectElem.value) {
          moduleSelectElem.value = targetEx.module;
          populateExerciseDropdown();
        }
        loadExercise(next);
      }
    }

    function toggleHint() {
      hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
    }

    function actualizarDesafioEvaluador() {
      const randomMontos = [15000, 32000, 48000, 65000, 92000];
      const randomClientes = ["Estudio Jurídico Gómez", "Comercio Don Pepe", "Farmacia Central", "Distribuidora Sur", "Servicios Médicos San Justo"];
      const mR = randomMontos[Math.floor(Math.random() * randomMontos.length)];
      const cR = randomClientes[Math.floor(Math.random() * randomClientes.length)];
      
      exercises[97].instruction = `Evaluador Dinámico Actualizado: 1) Abra el Facturador y emita una factura para <strong>${cR}</strong> por un monto de <strong>$${mR}</strong> (se guarda sola en Descargas).`;
      if (currentIdx === 97) {
        loadExercise(97);
      }
      alert(`🔄 ¡Desafío actualizado con éxito!\nNuevo caso generado:\nCliente: ${cR}\nMonto: $${mR}`);
    }

    function clearSelections() {
      document.querySelectorAll('.desktop-icon').forEach(icon => icon.classList.remove('selected'));
    }

    function validateAction(actionName) {
      const currentEx = exercises[currentIdx];
      if (currentEx && currentEx.targetAction === actionName) {
        if (currentIdx === 97) { // Ejercicio 98
          if (actionName === 'dblclick-facturador') {
            openFacturadorApp();
            return;
          }
        }
        alert("¡Excelente! Ejercicio aprobado correctamente.");
        if (currentIdx < exercises.length - 1) {
          navigate(1);
        }
      }
    }

    function handleIconClick(e, iconName) {
      e.stopPropagation();
      clearSelections();
      document.getElementById(`icon-${iconName}`).classList.add('selected');
      validateAction(`click-${iconName}`);
    }

    function handleIconDblClick(iconName) {
      clearSelections();
      if (iconName === 'este-equipo') openEsteEquipoApp();
      else if (iconName === 'wordpad') openWordpadApp();
      else if (iconName === 'facturador') openFacturadorApp();
      else if (iconName === 'correo') openCorreoApp();
      else if (iconName === 'papelera') openPapeleraApp();
      validateAction(`dblclick-${iconName}`);
    }

    function handleDesktopClick(e) {
      clearSelections();
      startMenu.style.display = 'none';
      validateAction('click-desktop');
    }

    function toggleStartMenu(e) {
      e.stopPropagation();
      startMenu.style.display = startMenu.style.display === 'block' ? 'none' : 'block';
      validateAction('click-start');
    }

    function handleStartItem(itemName) {
      startMenu.style.display = 'none';
      if (itemName === 'este-equipo') openEsteEquipoApp();
      else if (itemName === 'wordpad') openWordpadApp();
      else if (itemName === 'facturador') openFacturadorApp();
      else if (itemName === 'correo') openCorreoApp();
      else if (itemName === 'papelera') openPapeleraApp();
      validateAction(`start-${itemName}`);
    }

    function closeAppWindow() {
      appWindow.style.display = 'none';
      validateAction('close-window');
    }

    // APLICACIONES INTERACTIVAS REALES
    function openEsteEquipoApp() {
      windowTitle.textContent = "Este Equipo - Mis Archivos";
      windowBody.innerHTML = `
        <div style="font-weight:bold; margin-bottom:10px;">Carpetas de la computadora:</div>
        <ul style="list-style:none; padding-left:0;">
          <li style="padding:8px; background:#f1f3f5; margin-bottom:6px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Disco Local (C:)')">💻 Disco Local (C:)</li>
          <li style="padding:8px; background:#e2f0d9; margin-bottom:6px; border-radius:4px; cursor:pointer; font-weight:600;" onclick="openCarpetaDescargas()">📁 Descargas ${facturaGuardada ? '<span style="color:green; float:right;">[Factura_001.pdf lista]</span>' : ''}</li>
          <li style="padding:8px; background:#f1f3f5; margin-bottom:6px; border-radius:4px; cursor:pointer;" onclick="alert('Abriendo Documentos')">📄 Documentos</li>
        </ul>
      `;
      appWindow.style.display = 'flex';
    }

    function openCarpetaDescargas() {
      if (currentIdx === 97 && facturaGuardada) {
        windowBody.innerHTML = `
          <div style="font-weight:bold; color:#0077b6; margin-bottom:10px;">Carpeta: Descargas</div>
          <div style="padding:10px; background:#d4edda; border:1px solid #c3e6cb; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            <span>📄 Factura_001.pdf (Guardada correctamente)</span>
            <button class="app-btn" onclick="abrirCorreoParaAdjuntar()">Enviar por Mail</button>
          </div>
        `;
      } else {
        alert("Carpeta Descargas abierta.");
      }
    }

    function openWordpadApp() {
      windowTitle.textContent = "WordPad - Escribir Textos";
      windowBody.innerHTML = `
        <div style="border-bottom:1px solid #dee2e6; padding-bottom:6px; margin-bottom:10px; font-size:0.8rem; color:#6c757d;">
          Archivo | Editar | Ver | Insertar | Formato
        </div>
        <textarea class="app-form-control" style="height:180px; resize:none;" placeholder="Escriba aquí su carta o nota personal..."></textarea>
      `;
      appWindow.style.display = 'flex';
    }

    function openFacturadorApp() {
      windowTitle.textContent = "Facturador Digital - Cargar Comprobante";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Nombre del Cliente o Comercio:</label>
          <input type="text" class="app-form-control" id="fac-cliente" value="Guillermo López">
        </div>
        <div class="app-form-group">
          <label>Monto Total ($):</label>
          <input type="text" class="app-form-control" id="fac-total" value="15000">
        </div>
        <button class="app-btn" onclick="emitirYGuardarFactura()">Emitir Factura y Guardar</button>
      `;
      appWindow.style.display = 'flex';
    }

    function emitirYGuardarFactura() {
      facturaGuardada = true;
      alert("¡Factura emitida con éxito! Se ha guardado en la carpeta Descargas.");
      closeAppWindow();
      if (currentIdx === 97) {
        setTimeout(() => {
          openEsteEquipoApp();
        }, 500);
      }
    }

    function openCorreoApp() {
      windowTitle.textContent = "Correo Electrónico";
      windowBody.innerHTML = `
        <div class="app-form-group">
          <label>Para:</label>
          <input type="text" class="app-form-control" id="mail-to" value="contacto@comercio.com">
        </div>
        <div class="app-form-group">
          <label>Asunto:</label>
          <input type="text" class="app-form-control" id="mail-sub" value="Envío de Factura">
        </div>
        <div id="mail-adjunto-container" style="margin-bottom:10px; font-size:0.85rem; color:#495057;">
          📎 Archivos adjuntos: <em>Ninguno</em>
        </div>
        <button class="app-btn" onclick="enviarCorreoFinal()">Enviar Correo</button>
      `;
      appWindow.style.display = 'flex';
    }

    function abrirCorreoParaAdjuntar() {
      openCorreoApp();
      setTimeout(() => {
        const adjContainer = document.getElementById('mail-adjunto-container');
        if (adjContainer) {
          adjContainer.innerHTML = `📎 Archivos adjuntos: <strong style="color:green;">Factura_001.pdf</strong> (Adjuntado desde Descargas)`;
        }
      }, 200);
    }

    function enviarCorreoFinal() {
      alert("¡Correo enviado con éxito junto con la factura adjunta!");
      closeAppWindow();
      if (currentIdx === 97) {
        alert("¡Felicitaciones! Ha aprobado la auditoría del Módulo Evaluador Dinámico y completado los 100 ejercicios.");
        navigate(1);
      }
    }

    function openPapeleraApp() {
      windowTitle.textContent = "Papelera de Reciclaje";
      windowBody.innerHTML = `
        <div style="color:#6c757d; font-size:0.95rem; text-align:center; padding:25px;">
          🗑️ La papelera está vacía en este momento.
        </div>
      `;
      appWindow.style.display = 'flex';
    }

    // Inicializar al cargar el script
    init();
  </script>
</body>
</html>
