<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Windows 10 - Eterna Juventud (100 Ejercicios Interactivos)</title>
    <style>
        :root {
            --win-bg: #0063b1;
            --taskbar-bg: #1f1f1f;
            --panel-bg: #2b2b2b;
            --accent: #0078d7;
            --success: #107c41;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* PANEL LATERAL DE EJERCICIOS */
        #exercisePanel {
            width: 400px;
            background-color: var(--panel-bg);
            border-right: 2px solid #3f3f3f;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .panel-header h1 {
            font-size: 1.2rem;
            color: #00a4ef;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #3f3f3f;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .exercise-card {
            background: #1f1f1f;
            border-radius: 6px;
            padding: 15px;
            border-left: 4px solid var(--accent);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .badge-module {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #3a3a3a;
            padding: 3px 8px;
            border-radius: 3px;
            width: fit-content;
            color: #aaa;
        }

        .exercise-title {
            font-size: 1.1rem;
            color: #fff;
        }

        .exercise-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #ddd;
        }

        .clarification {
            color: #9cdcfcfe;
            font-style: italic;
        }

        .hint-box {
            background: #2d2d00;
            border: 1px solid #808000;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #ffff80;
        }

        .ok-box {
            background: var(--success);
            color: white;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        .hidden { display: none !important; }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* ENTORNO SIMULADOR WINDOWS 10 */
        #simulator {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--win-bg) url('https://picsum.photos/id/1018/1200/800') center/cover no-repeat;
        }

        #desktop {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 20px;
            position: relative;
        }

        .desktop-icon {
            width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 5px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .desktop-icon img {
            width: 40px;
            height: 40px;
            pointer-events: none;
        }

        .desktop-icon span {
            font-size: 0.8rem;
            text-shadow: 1px 1px 2px #000;
        }

        /* VENTANAS SIMULADAS */
        .window {
            position: absolute;
            width: 480px;
            height: 320px;
            background: #ffffff;
            color: #000;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            top: 80px;
            left: 80px;
            overflow: hidden;
            border: 1px solid #777;
        }

        .window-header {
            background: #eee;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            cursor: move;
        }

        .window-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #333;
        }

        .window-controls {
            display: flex;
            gap: 5px;
        }

        .win-btn {
            width: 25px;
            height: 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
        }

        .win-btn-close:hover {
            background: #e81123;
            color: white;
        }

        .window-toolbar {
            display: flex;
            gap: 5px;
            padding: 5px;
            background: #f4f4f4;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
        }

        .tool-btn {
            padding: 3px 8px;
            font-size: 0.75rem;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }

        .window-body {
            flex-grow: 1;
            padding: 10px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .window-body textarea, .window-body input {
            width: 100%;
            border: 1px solid #ccc;
            padding: 8px;
            outline: none;
        }

        .window-body textarea {
            flex-grow: 1;
            resize: none;
        }

        /* BARRA DE TAREAS */
        #taskbar {
            height: 40px;
            background: var(--taskbar-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            z-index: 10;
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .start-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 12px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .start-btn:hover { background: rgba(255,255,255,0.1); }

        .system-tray {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            align-items: center;
        }

        /* MENÚ CONTEXTUAL */
        .context-menu {
            position: absolute;
            background: #2b2b2b;
            border: 1px solid #444;
            width: 180px;
            border-radius: 4px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            z-index: 200;
        }

        .context-menu-item {
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .context-menu-item:hover { background: var(--accent); }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- PANEL DE CONTROL Y GUÍA DE EJERCICIOS -->
    <div id="exercisePanel">
        <div class="panel-header">
            <h1>Capacitación Digital</h1>
            <p style="font-size: 0.8rem; color: #aaa;">Plataforma Eterna Juventud</p>
        </div>

        <select id="exerciseSelector"></select>

        <div class="exercise-card">
            <span id="exerciseModule" class="badge-module">Módulo 1</span>
            <h2 id="exerciseTitle" class="exercise-title">Título del ejercicio</h2>
            <p id="exerciseText" class="exercise-text">Consigna...</p>
            <div id="exerciseHint" class="hint-box">Pista...</div>
            <div id="exerciseOk" class="ok-box hidden">¡Excelente!</div>
        </div>

        <div class="nav-buttons">
            <button id="prevBtn" class="btn" onclick="prevExercise()">Anterior</button>
            <button id="nextBtn" class="btn" onclick="nextExercise()">Siguiente</button>
        </div>
    </div>

    <!-- ENTORNO SIMULADO WINDOWS 10 -->
    <div id="simulator">
        <div id="desktop" onmousedown="triggerAction('drag', 'desktop')">
            <div id="icon-wordpad" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'desktop-icon')">
                <img src="https://img.icons8.com/color/48/wordpad.png" alt="WordPad">
                <span>WordPad</span>
            </div>
            <div id="icon-facturador" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'desktop-icon')">
                <img src="https://img.icons8.com/color/48/ms-excel.png" alt="Facturador">
                <span>Facturador</span>
            </div>
            <div id="icon-computer" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'desktop-icon')">
                <img src="https://img.icons8.com/color/48/display.png" alt="Este equipo">
                <span>Este equipo</span>
            </div>
            <div id="icon-trash" class="desktop-icon" draggable="true" ondragend="triggerAction('drag', 'icon-trash')">
                <img src="https://img.icons8.com/color/48/full-trash.png" alt="Papelera">
                <span>Papelera</span>
            </div>
            <div id="icon-folder" class="desktop-icon hidden" id="createdFolder">
                <img src="https://img.icons8.com/color/48/folder-invoices.png" alt="Mis Recetas">
                <span id="folder-name">Mis Recetas</span>
            </div>
        </div>

        <!-- VENTANA SIMULADA GENERAL -->
        <div id="appWindow" class="window hidden">
            <div id="window-header" class="window-header" onmousedown="triggerAction('drag', 'window-header')">
                <span id="winTitle" class="window-title">Programa</span>
                <div class="window-controls">
                    <button id="btn-minimize" class="win-btn win-btn-minimize" onclick="triggerAction('click', 'btn-minimize')">–</button>
                    <button id="btn-close" class="win-btn win-btn-close" onclick="closeWindow()">X</button>
                </div>
            </div>
            <div id="window-toolbar" class="window-toolbar">
                <button id="btn-font" class="tool-btn" onclick="triggerAction('click', 'btn-font')">Fuente: Arial</button>
                <button id="btn-size" class="tool-btn" onclick="triggerAction('click', 'btn-size')">Tamaño: 18</button>
                <button id="btn-bold" class="tool-btn" onclick="triggerAction('click', 'btn-bold')"><b>N</b></button>
                <button id="btn-underline" class="tool-btn" onclick="triggerAction('click', 'btn-underline')"><u>S</u></button>
                <button id="btn-color" class="tool-btn" onclick="triggerAction('click', 'btn-color')">Color Azul</button>
                <button id="btn-center" class="tool-btn" onclick="triggerAction('click', 'btn-center')">Centrar</button>
                <button id="btn-save" class="tool-btn" onclick="triggerAction('click', 'btn-save')">Guardar</button>
                <button id="btn-open" class="tool-btn" onclick="triggerAction('click', 'btn-open')">Abrir</button>
                <button id="btn-img" class="tool-btn" onclick="triggerAction('click', 'btn-img')">Imagen</button>
                <button id="btn-print" class="tool-btn" onclick="triggerAction('click', 'btn-print')">Imprimir</button>
                <button id="btn-sum" class="tool-btn" onclick="triggerAction('click', 'btn-sum')">Σ Suma</button>
                <button id="btn-currency" class="tool-btn" onclick="triggerAction('click', 'btn-currency')">$ Moneda</button>
                <button id="btn-colorfill" class="tool-btn" onclick="triggerAction('click', 'btn-colorfill')">🎨 Color</button>
                <button id="btn-borders" class="tool-btn" onclick="triggerAction('click', 'btn-borders')">🔲 Bordes</button>
                <button id="btn-restore" class="tool-btn" onclick="triggerAction('click', 'btn-restore')">Restaurar</button>
            </div>
            <div class="window-body">
                <input type="text" id="search-input" placeholder="Buscar documento..." oninput="triggerAction('input', 'search-input')" class="hidden">
                <textarea id="winEditor" placeholder="Escriba aquí su documento..." oninput="triggerAction('input', 'winEditor')"></textarea>
                <div id="facturadorGrid" class="hidden" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <input type="text" id="cell-1" placeholder="Concepto (ej. Luz)" oninput="triggerAction('input', 'cell-1')" onclick="triggerAction('click', 'cell-1')">
                    <input type="text" id="cell-2" placeholder="Importe ($)" oninput="triggerAction('input', 'cell-2')">
                </div>
            </div>
        </div>

        <!-- BARRA DE TAREAS -->
        <div id="taskbar" oncontextmenu="e.preventDefault(); triggerAction('contextmenu', 'taskbar')">
            <div class="taskbar-left">
                <button id="btn-start-menu" class="start-btn" onclick="triggerAction('click', 'btn-start-menu')">🪟</button>
                <div id="icon-mail" class="desktop-icon" style="flex-direction:row; width:auto; padding:3px 8px;" onclick="triggerAction('click', 'icon-mail')" oncontextmenu="e.preventDefault(); triggerAction('contextmenu', 'icon-mail')">
                    <img src="https://img.icons8.com/color/24/gmail-new.png" alt="Correo">
                    <span style="font-size:0.75rem">Correo</span>
                </div>
            </div>
            <div id="system-tray" class="system-tray" onmousemove="triggerAction('mousemove', 'system-tray')" onclick="triggerAction('click', 'system-tray')">
                <span id="btn-lang" style="cursor:pointer;" onclick="triggerAction('click', 'btn-lang')">ESP</span>
                <span id="btn-volume" style="cursor:pointer;" onclick="triggerAction('click', 'btn-volume')">🔊</span>
                <span id="btn-wifi" style="cursor:pointer;" onclick="triggerAction('click', 'btn-wifi')">📶</span>
                <span id="clock" style="cursor:pointer;" onclick="triggerAction('click', 'clock')">12:00</span>
                <span id="btn-showdesktop" style="border-left:1px solid #555; padding-left:5px; cursor:pointer;" onclick="triggerAction('click', 'btn-showdesktop')">|</span>
            </div>
        </div>

        <!-- MENÚ CONTEXTUAL -->
        <div id="contextMenu" class="context-menu hidden">
            <div class="context-menu-item" onclick="triggerAction('click', 'menu-view')">Ver (Iconos grandes)</div>
            <div class="context-menu-item" onclick="triggerAction('click', 'menu-sort')">Ordenar por fecha</div>
            <div class="context-menu-item" onclick="createNewFolder(); triggerAction('create-folder', 'desktop');">Nueva Carpeta</div>
            <div class="context-menu-item" onclick="triggerAction('contextmenu', 'icon-trash')">Vaciar papelera</div>
            <div class="context-menu-item" onclick="triggerAction('contextmenu', 'taskbar')">Cascada / Paralelo</div>
        </div>
    </div>

   <script>
    // MATRIZ COMPLETA DE LOS 100 EJERCICIOS DEFINIDOS INDIVIDUALMENTE
    const exercises = [
      // MÓDULO 1
      { id: 1, module: "Módulo 1: Panel Táctil", title: "Ejercicio 1: Selección Individual", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Haga un solo clic izquierdo sobre el icono 'Este equipo' para seleccionarlo.", target: "icon-pc", event: "click", hint: "Presione una sola vez el botón izquierdo sobre la computadora.", success: "¡Perfecto! El icono quedó seleccionado correctamente." },
      { id: 2, module: "Módulo 1: Panel Táctil", title: "Ejercicio 2: Apertura por Doble Clic", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Haga doble clic rápido sobre el icono 'Este equipo' para abrirlo.", target: "icon-pc", event: "dblclick", hint: "Realice dos clics rápidos seguidos sobre el icono de Este equipo.", success: "¡Excelente! Se logró la apertura por doble clic." },
      { id: 3, module: "Módulo 1: Panel Táctil", title: "Ejercicio 3: Menú Contextual", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Haga clic derecho sobre el icono 'Papelera' para desplegar sus opciones.", target: "icon-trash", event: "contextmenu", hint: "Oprima el botón derecho del mouse sobre el cesto de residuos.", success: "¡Muy bien! Desplegó el menú contextual." },
      { id: 4, module: "Módulo 1: Panel Táctil", title: "Ejercicio 4: Abrir Menú Inicio", context: "📍 Ubicación inicial: Barra de tareas", instruction: "Haga clic sobre el botón Inicio en la esquina inferior izquierda.", target: "startBtn", event: "click", hint: "Haga clic en el icono con 4 cuadrados azules en la barra inferior.", success: "¡Genial! El menú Inicio está desplegado." },
      { id: 5, module: "Módulo 1: Panel Táctil", title: "Ejercicio 5: Selección de WordPad", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Haga un clic izquierdo sobre el icono 'WordPad'.", target: "icon-wordpad", event: "click", hint: "Un solo clic izquierdo sobre la hoja azul de WordPad.", success: "¡Correcto! Icono de WordPad marcado." },
      { id: 6, module: "Módulo 1: Panel Táctil", title: "Ejercicio 6: Abrir WordPad", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Abra la aplicación WordPad haciendo doble clic sobre su icono.", target: "icon-wordpad", event: "dblclick", hint: "Dos clics rápidos consecutivos sobre el acceso de WordPad.", success: "¡Estupendo! Ventana de WordPad abierta." },
      { id: 7, module: "Módulo 1: Panel Táctil", title: "Ejercicio 7: Selección de Facturador", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Haga un clic izquierdo sobre el icono 'Facturador' para resaltarlo.", target: "icon-facturador", event: "click", hint: "Un clic sobre el icono verde del Facturador.", success: "¡Bien hecho! Facturador seleccionado." },
      { id: 8, module: "Módulo 1: Panel Táctil", title: "Ejercicio 8: Abrir Facturador", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Ejecute el Facturador mediante un doble clic sobre su icono.", target: "icon-facturador", event: "dblclick", hint: "Dos clics firmes y seguidos sobre el acceso directo verde.", success: "¡Excelente! Sistema Facturador activo." },
      { id: 9, module: "Módulo 1: Panel Táctil", title: "Ejercicio 9: Selección de Correo", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Haga un clic sobre el icono 'Correo' para enfocar la aplicación.", target: "icon-mail", event: "click", hint: "Un clic izquierdo sobre el sobre amarillo.", success: "¡Muy bien! Icono de Correo enfocado." },
      { id: 10, module: "Módulo 1: Panel Táctil", title: "Ejercicio 10: Abrir Correo", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Abre el cliente de correo realizando doble clic sobre el icono 'Correo'.", target: "icon-mail", event: "dblclick", hint: "Dos clics sobre el icono del sobre en el escritorio.", success: "¡Correcto! Aplicación de Correo lista." },
      { id: 11, module: "Módulo 1: Panel Táctil", title: "Ejercicio 11: Desplegar Menú Inicio", context: "📍 Ubicación inicial: Barra de tareas", instruction: "Oprima el botón Inicio para desplegar la lista de programas.", target: "startBtn", event: "click", hint: "Haga clic en el botón de la esquina inferior izquierda.", success: "¡Perfecto! Menú Inicio listo." },
      { id: 12, module: "Módulo 1: Panel Táctil", title: "Ejercicio 12: Iniciar WordPad desde Inicio", context: "📍 Ubicación inicial: Menú Inicio", instruction: "En el menú desplegado, haga clic sobre la opción 'WordPad'.", target: "start-wordpad", event: "click", hint: "Haga clic sobre el texto de WordPad dentro del menú desplegado.", success: "¡Excelente! WordPad iniciado desde el Menú Inicio." },

      // MÓDULO 2
      { id: 13, module: "Módulo 2: Manejo de Ventanas", title: "Ejercicio 13: Minimizar WordPad", context: "📍 Ubicación inicial: Ventana de WordPad abierta", instruction: "Haga clic en el botón amarillo (-) de minimizar en la ventana de WordPad.", target: "wordpad-min", event: "click", hint: "Es el botón circular del centro en los controles superiores de la ventana.", success: "¡Muy bien! La ventana se ha minimizado." },
      { id: 14, module: "Módulo 2: Manejo de Ventanas", title: "Ejercicio 14: Maximizar WordPad", context: "📍 Ubicación inicial: Ventana de WordPad abierta", instruction: "Haga clic en el botón verde (+) para maximizar la ventana de WordPad.", target: "wordpad-max", event: "click", hint: "Oprima el círculo verde en la esquina superior derecha de la ventana.", success: "¡Correcto! Ventana maximizada." },
      { id: 15, module: "Módulo 2: Manejo de Ventanas", title: "Ejercicio 15: Cerrar WordPad", context: "📍 Ubicación inicial: Ventana de WordPad abierta", instruction: "Haga clic en el botón rojo [X] para cerrar la ventana de WordPad.", target: "wordpad-close", event: "click", hint: "Oprima el botón circular rojo de la ventana.", success: "¡Estupendo! Ventana cerrada." },
      { id: 16, module: "Módulo 2: Manejo de Ventanas", title: "Ejercicio 16: Abrir Facturador", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Haga doble clic en el icono 'Facturador' para abrir su ventana.", target: "icon-facturador", event: "dblclick", hint: "Dos clics seguidos en el icono verde.", success: "¡Ventana del Facturador abierta!" },
      { id: 17, module: "Módulo 2: Manejo de Ventanas", title: "Ejercicio 17: Minimizar Facturador", context: "📍 Ubicación inicial: Ventana del Facturador abierta", instruction: "Minimice la ventana del Facturador haciendo clic en el botón amarillo.", target: "fac-min", event: "click", hint: "Haga clic en el botón amarillo superior derecho.", success: "¡Facturador minimizado con éxito!" },
      { id: 18, module: "Módulo 2: Manejo de Ventanas", title: "Ejercicio 18: Cerrar Facturador", context: "📍 Ubicación inicial: Ventana del Facturador abierta", instruction: "Cierre la ventana del Facturador pulsando el botón rojo [X].", target: "fac-close", event: "click", hint: "Haga clic en el botón rojo superior de la ventana.", success: "¡Facturador cerrado correctamente!" },
      { id: 19, module: "Módulo 2: Manejo de Ventanas", title: "Ejercicio 19: Abrir Correo", context: "📍 Ubicación inicial: Escritorio principal", instruction: "Abra la ventana de Correo haciendo doble clic en su icono.", target: "icon-mail", event: "dblclick", hint: "Dos clics sobre el sobre amarillo.", success: "¡Ventana de Correo desplegada!" },

        let currentExId = 1;

        // INICIALIZACIÓN Y NAVEGACIÓN
        function initDropdown() {
            const selector = document.getElementById("exerciseSelector");
            selector.innerHTML = "";
            exercises.forEach((ex) => {
                const option = document.createElement("option");
                option.value = ex.id;
                option.textContent = `${ex.id}. ${ex.title}`;
                selector.appendChild(option);
            });

            selector.addEventListener("change", (e) => {
                loadExercise(parseInt(e.target.value, 10));
            });

            loadExercise(currentExId);
        }

        function loadExercise(id) {
            const exercise = exercises.find((ex) => ex.id === id) || exercises[0];
            currentExId = exercise.id;

            document.getElementById("exerciseSelector").value = currentExId;
            document.getElementById("exerciseModule").innerText = exercise.mod;
            document.getElementById("exerciseTitle").innerText = exercise.title;
            document.getElementById("exerciseText").innerHTML = exercise.text;
            document.getElementById("exerciseHint").innerText = "💡 Pista: " + exercise.hint;
            
            const okEl = document.getElementById("exerciseOk");
            okEl.innerText = exercise.ok;
            okEl.classList.add("hidden");

            document.getElementById("prevBtn").disabled = (currentExId === 1);
            document.getElementById("nextBtn").disabled = (currentExId === exercises[exercises.length - 1].id);

            // Ajuste visual según la app requerida por el ejercicio
            if (exercise.mod.includes("Facturador")) {
                document.getElementById('winEditor').classList.add('hidden');
                document.getElementById('facturadorGrid').classList.remove('hidden');
                document.getElementById('search-input').classList.add('hidden');
            } else if (exercise.id === 38 || exercise.id === 80) {
                document.getElementById('search-input').classList.remove('hidden');
                document.getElementById('winEditor').classList.add('hidden');
                document.getElementById('facturadorGrid').classList.add('hidden');
            } else {
                document.getElementById('winEditor').classList.remove('hidden');
                document.getElementById('facturadorGrid').classList.add('hidden');
                document.getElementById('search-input').classList.add('hidden');
            }
        }

        function nextExercise() {
            const currentIndex = exercises.findIndex(ex => ex.id === currentExId);
            if (currentIndex < exercises.length - 1) {
                loadExercise(exercises[currentIndex + 1].id);
            }
        }

        function prevExercise() {
            const currentIndex = exercises.findIndex(ex => ex.id === currentExId);
            if (currentIndex > 0) {
                loadExercise(exercises[currentIndex - 1].id);
            }
        }

        function completeExercise() {
            const okEl = document.getElementById("exerciseOk");
            if (okEl) okEl.classList.remove("hidden");
        }

        // MOTOR GENERAL DE ACCIONES INTERACTIVAS
        function triggerAction(type, targetId) {
            const currentEx = exercises.find(ex => ex.id === currentExId);
            
            if (type === 'click' && targetId !== 'desktop') {
                document.getElementById('contextMenu').classList.add('hidden');
            }

            if (currentEx && currentEx.trigger) {
                const matchType = (currentEx.trigger.type === type);
                const matchTarget = (currentEx.trigger.target === targetId || currentEx.trigger.target === 'desktop');
                
                if (matchType && matchTarget) {
                    completeExercise();
                }
            }
        }

        function openWindow(title) {
            const win = document.getElementById('appWindow');
            document.getElementById('winTitle').innerText = title;
            win.classList.remove('hidden');
        }

        function closeWindow() {
            document.getElementById('appWindow').classList.add('hidden');
            triggerAction('click', 'btn-close');
        }

        function createNewFolder() {
            const folder = document.getElementById('createdFolder');
            if (folder) folder.classList.remove('hidden');
        }

        // CONTROL DE EVENTOS EN EL ENTORNO
        document.addEventListener('DOMContentLoaded', () => {
            initDropdown();

            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }, 1000);

            // Iconos del escritorio
            document.getElementById('icon-wordpad').addEventListener('dblclick', () => {
                openWindow('WordPad');
                triggerAction('dblclick', 'icon-wordpad');
            });

            document.getElementById('icon-facturador').addEventListener('dblclick', () => {
                openWindow('Facturador');
                triggerAction('dblclick', 'icon-facturador');
            });

            document.getElementById('icon-computer').addEventListener('dblclick', () => {
                openWindow('Este Equipo');
                triggerAction('dblclick', 'icon-computer');
            });

            document.getElementById('icon-trash').addEventListener('dblclick', () => {
                openWindow('Papelera de Reciclaje');
                triggerAction('dblclick', 'icon-trash');
            });

            // Menú contextual en el escritorio
            const desktop = document.getElementById('desktop');
            desktop.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const cm = document.getElementById('contextMenu');
                cm.style.top = `${e.clientY}px`;
                cm.style.left = `${e.clientX}px`;
                cm.classList.remove('hidden');
                triggerAction('contextmenu', 'desktop');
            });

            desktop.addEventListener('mousemove', () => {
                triggerAction('mousemove', 'desktop');
            });

            desktop.addEventListener('wheel', () => {
                triggerAction('wheel', 'desktop');
            });

            // Captura de combinaciones de teclado
            document.addEventListener('keydown', (e) => {
                if (e.altKey && e.key === 'Tab') {
                    triggerAction('keydown', 'alttab');
                }
                if (e.key === 'Delete') {
                    triggerAction('keydown', 'delete');
                }
                if (e.key === 'l' || e.key === 'L') {
                    triggerAction('keydown', 'winl');
                }
            });
        });
    </script>
