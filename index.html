<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador Windows 10 - Capacitación Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 75% 85%, #ff1493 0%, #7b1fa2 40%, #120428 75%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #desktop {
            flex: 1;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 25px;
        }

        .desktop-icon {
            width: 85px;
            text-align: center;
            color: white;
            cursor: pointer;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            font-size: 13px;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .desktop-icon i {
            font-size: 42px;
            margin-bottom: 6px;
            display: block;
        }

        /* Barra de tareas */
        #taskbar {
            height: 48px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
            position: relative;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        #start-btn {
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Menú Inicio */
        #start-menu {
            position: absolute;
            bottom: 48px;
            left: 0;
            width: 300px;
            background: rgba(24, 24, 24, 0.95);
            backdrop-filter: blur(15px);
            color: white;
            display: none;
            flex-direction: column;
            z-index: 1001;
            padding: 12px 0;
            box-shadow: 4px -4px 20px rgba(0,0,0,0.6);
            border-top-right-radius: 8px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .menu-item {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 15px;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .menu-item i {
            width: 25px;
            text-align: center;
            font-size: 18px;
        }

        /* Tarjeta de Guía Didáctica */
        #guide-card {
            position: fixed;
            right: 20px;
            top: 20px;
            width: 380px;
            height: 88vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .guide-header {
            background: #2b5797;
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }

        .guide-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        #exercise-select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            background: #fdfdfd;
            cursor: pointer;
        }

        .guide-footer {
            padding: 15px;
            background: #f1f1f1;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            flex: 1;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-verify { background: #2b5797; width: 100%; margin-top: 10px; }
        .btn-retry { background: #e68a00; }
        .btn-hint { background: #6c757d; }

        /* Ventanas de Aplicaciones */
        .app-window {
            position: absolute;
            top: 30px;
            left: 30px;
            width: calc(100vw - 440px);
            height: 82vh;
            background: white;
            border: 1px solid #0078D7;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 500;
            display: none;
            flex-direction: column;
            border-radius: 6px;
            overflow: hidden;
        }

        .window-header {
            background: #f3f3f3;
            color: black;
            border-bottom: 1px solid #dcdcdc;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .close-btn {
            cursor: pointer;
            color: black;
            font-weight: bold;
            font-size: 16px;
            padding: 4px 12px;
            border-radius: 4px;
        }

        .close-btn:hover {
            background: #e81123;
            color: white;
        }

        .window-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #fafafa;
        }
    </style>
</head>
<body>

    <!-- ESCRITORIO -->
    <div id="desktop">
        <div class="desktop-icon" ondblclick="openApp('wordpad')" onclick="selectIcon(this)">
            <i class="fas fa-file-word" style="color:#2b5797;"></i><span>WordPad</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('facturador')" onclick="selectIcon(this)">
            <i class="fas fa-file-invoice-dollar" style="color:#2ecc71;"></i><span>Facturador</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('este-equipo')" onclick="selectIcon(this)">
            <i class="fas fa-desktop" style="color:#17a2b8;"></i><span>Este equipo</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('correo')" onclick="selectIcon(this)">
            <i class="fas fa-envelope" style="color:#e67e22;"></i><span>Correo</span>
        </div>
    </div>

    <!-- TARJETA DE GUÍA DIDÁCTICA -->
    <div id="guide-card">
        <div class="guide-header">
            <span>Capacitación Digital</span>
            <span id="exercise-counter">Ej. 41 de 100</span>
        </div>
        <div class="guide-body">
            <select id="exercise-select" onchange="changeExercise(this.value)">
                <!-- Se llena dinámicamente -->
            </select>
            
            <div id="exercise-instructions">
                <!-- Se carga dinámicamente -->
            </div>
        </div>
        <div class="guide-footer">
            <button class="btn btn-hint" onclick="showHint()"><i class="fas fa-lightbulb"></i> Pista</button>
            <button class="btn btn-retry" onclick="resetExercise()"><i class="fas fa-undo"></i> Volver</button>
        </div>
        <div style="padding: 0 15px 15px 15px;">
           <button class="btn btn-verify" onclick="verifyExercise()">Verificar Ejercicio</button>
        </div>
    </div>

    <!-- VENTANA WORDPAD -->
    <div id="window-wordpad" class="app-window">
        <div class="window-header">
            <div class="window-title"><i class="fas fa-file-word" style="color:#2b5797;"></i> Documento - WordPad</div>
            <div class="close-btn" onclick="closeApp('wordpad')">✕</div>
        </div>
        <div class="window-content" style="background: white;">
            <div style="border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; font-size: 13px; color: #555;">
                Archivo &nbsp;|&nbsp; Edición &nbsp;|&nbsp; Ver &nbsp;|&nbsp; Insertar
            </div>
            <textarea style="width: 100%; height: 300px; border: 1px solid #ccc; padding: 10px; font-family: sans-serif; font-size: 15px; outline: none;" placeholder="Escribe tu texto aquí..."></textarea>
        </div>
    </div>

    <!-- VENTANA ESTE EQUIPO -->
    <div id="window-este-equipo" class="app-window">
        <div class="window-header">
            <div class="window-title"><i class="fas fa-desktop" style="color:#17a2b8;"></i> Este equipo</div>
            <div class="close-btn" onclick="closeApp('este-equipo')">✕</div>
        </div>
        <div class="window-content" style="background: white; display: flex;">
            <div style="width: 180px; border-right: 1px solid #ddd; padding-right: 15px;">
                <p><b>Acceso rápido</b></p>
                <p>Escritorio</p>
                <p>Descargas</p>
            </div>
            <div style="flex: 1; padding-left: 20px;">
                <h4>Unidades de disco</h4>
                <p><i class="fas fa-hdd fa-2x" style="color: #666;"></i><br>Disco Local (C:)</p>
            </div>
        </div>
    </div>

    <!-- BARRA DE TAREAS Y MENÚ INICIO -->
    <div id="taskbar">
        <div id="start-btn" onclick="toggleStartMenu()"><i class="fab fa-windows"></i></div>
    </div>

    <div id="start-menu">
        <div class="menu-item" onclick="alert('Apagando sistema...')">
            <i class="fas fa-power-off" style="color: #bbb;"></i> Inicio / Apagado
        </div>
        <hr style="border-color: #333; margin: 4px 0;">
        <div class="menu-item" onclick="openApp('wordpad')"><i class="fas fa-file-word" style="color:#2b5797;"></i> WordPad</div>
        <div class="menu-item" onclick="openApp('facturador')"><i class="fas fa-file-invoice-dollar" style="color:#2ecc71;"></i> Facturador</div>
        <div class="menu-item" onclick="openApp('este-equipo')"><i class="fas fa-desktop" style="color:#17a2b8;"></i> Este equipo</div>
        <div class="menu-item" onclick="openApp('correo')"><i class="fas fa-envelope" style="color:#e67e22;"></i> Correo</div>
    </div>

    <!-- SCRIPT CON CONTENIDO REAL PARA CADA UNO DE LOS 100 EJERCICIOS -->
    <script>
        const exerciseSelect = document.getElementById('exercise-select');

        function getModuleTitle(num) {
            if (num <= 12) return "Módulo 1: Manejo Básico y Touchpad";
            if (num <= 25) return "Módulo 2: Gestión de Ventanas";
            if (num <= 40) return "Módulo 3: Explorador de Archivos";
            if (num <= 55) return "Módulo 4: Procesador WordPad";
            if (num <= 70) return "Módulo 5: Facturación Digital";
            if (num <= 85) return "Módulo 6: Correo Electrónico";
            if (num <= 95) return "Módulo 7: WhatsApp Web";
            return "Módulo 8: Integración Total";
        }

        // Poblar el selector con títulos descriptivos
        for (let i = 1; i <= 100; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.text = `Ejercicio ${i}: Tarea práctica (${getModuleTitle(i).split(':')[0]})`;
            if (i === 41) opt.selected = true;
            exerciseSelect.appendChild(opt);
        }

        function getExerciseDetails(num) {
            if (num >= 1 && num <= 12) {
                return {
                    title: `Ejercicio ${num}: Práctica de Clic y Touchpad`,
                    steps: [
                        "Ubica el puntero del mouse sobre la pantalla de forma estable.",
                        "Realiza un <b>clic simple</b> sobre cualquier ícono del escritorio para seleccionarlo.",
                        "Practica desplazar la vista utilizando el desplazamiento vertical del touchpad."
                    ]
                };
            } else if (num >= 13 && num <= 25) {
                return {
                    title: `Ejercicio ${num}: Manipulación de Ventanas`,
                    steps: [
                        "Abre una aplicación desde el escritorio o el menú de inicio.",
                        "Haz clic en el botón superior para <b>maximizar</b> la ventana.",
                        "Haz clic en el botón de minimizar y luego restáurala a su tamaño original."
                    ]
                };
            } else if (num >= 26 && num <= 40) {
                return {
                    title: `Ejercicio ${num}: Exploración y Carpetas`,
                    steps: [
                        "Abre la aplicación <b>Este equipo</b> haciendo doble clic.",
                        "Navega entre los accesos rápidos del panel izquierdo.",
                        "Identifica la unidad de disco local (C:) visualizada en la ventana."
                    ]
                };
            } else if (num >= 41 && num <= 55) {
                return {
                    title: `Ejercicio ${num}: Uso de WordPad`,
                    steps: [
                        "Ubícate sobre el ícono de <b>WordPad</b> en el escritorio.",
                        "Haz <b>doble clic rápido</b> con el botón izquierdo del mouse para abrirlo.",
                        "Escribe un breve texto en el área de trabajo y verifica el resultado."
                    ]
                };
            } else if (num >= 56 && num <= 70) {
                return {
                    title: `Ejercicio ${num}: Facturación Digital`,
                    steps: [
                        "Abre la aplicación del <b>Facturador</b> desde el escritorio.",
                        "Ingresa los datos del cliente y el monto correspondiente en los campos habilitados.",
                        "Valida los valores y presiona emitir comprobante."
                    ]
                };
            } else if (num >= 71 && num <= 85) {
                return {
                    title: `Ejercicio ${num}: Gestión de Correo`,
                    steps: [
                        "Abre la aplicación de <b>Correo</b> desde el menú o acceso directo.",
                        "Completa el campo de destinatario con una dirección simulada.",
                        "Escribe el asunto y redacta un mensaje formal antes de simular el envío."
                    ]
                };
            } else if (num >= 86 && num <= 95) {
                return {
                    title: `Ejercicio ${num}: Mensajería de Texto`,
                    steps: [
                        "Selecciona un contacto disponible en la agenda de la aplicación.",
                        "Escribe un mensaje de saludo cotidiano en la barra de chat.",
                        "Envía el mensaje utilizando el botón correspondiente."
                    ]
                };
            } else {
                return {
                    title: `Ejercicio ${num}: Integración y Autonomía`,
                    steps: [
                        "Combina las herramientas aprendidas sin asistencia paso a paso.",
                        "Abre el explorador, redacta un documento en WordPad y simula su transferencia.",
                        "Verifica que el flujo completo de trabajo digital se realice con éxito."
                    ]
                };
            }
        }

        function changeExercise(num) {
            document.getElementById('exercise-counter').innerText = 'Ej. ' + num + ' de 100';
            const inst = document.getElementById('exercise-instructions');
            const data = getExerciseDetails(parseInt(num));

            let html = `<h3>${data.title}</h3><p>Para completar este objetivo:</p><ol style="margin-left: 20px; line-height: 1.6;">`;
            data.steps.forEach(step => {
                html += `<li>${step}</li>`;
            });
            html += `</ol>`;
            inst.innerHTML = html;
        }

        // Inicializar por defecto en el ejercicio 41
        changeExercise(41);

        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function openApp(appId) {
            const win = document.getElementById('window-' + appId);
            if (win) {
                document.querySelectorAll('.app-window').forEach(w => w.style.display = 'none');
                win.style.display = 'flex';
            } else {
                alert("La aplicación seleccionada se abrirá en breve.");
            }
            document.getElementById('start-menu').style.display = 'none';
        }

        function closeApp(appId) {
            document.getElementById('window-' + appId).style.display = 'none';
        }

        function selectIcon(el) {
            document.querySelectorAll('.desktop-icon').forEach(i => i.style.background = 'transparent');
            el.style.background = 'rgba(255, 255, 255, 0.25)';
        }

        function verifyExercise() { alert("¡Excelente trabajo! Ejercicio completado correctamente."); }
        function resetExercise() { alert("Reiniciando el ejercicio actual..."); }
        function showHint() { alert("Pista: Sigue atentamente cada uno de los pasos indicados en la tarjeta."); }

        document.addEventListener('click', function(e) {
            const menu = document.getElementById('start-menu');
            const btn = document.getElementById('start-btn');
            if (menu.style.display === 'flex' && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.style.display = 'none';
            }
        });
    </script>
</body>
</html>
